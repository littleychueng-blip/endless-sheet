server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # ~225 KB of HTML with a base64 icon inside it — worth compressing
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/html text/css application/javascript application/manifest+json image/svg+xml;
    gzip_vary         on;

    # the whole app is this one file, so it must not pin a stale copy in the
    # browser after a redeploy — revalidate every load, it's a single request
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Coolify's proxy already logs; keep the container quiet
    access_log off;
    error_log  /var/log/nginx/error.log warn;
}
