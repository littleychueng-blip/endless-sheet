      if (d2 < R * R) near.push([d2, c]);
    }
    near.sort((a, b) => a[0] - b[0]);        // pops ring outward from the middle
    for (const p of near) popCell(p[1], now, mine);
    boom((x - cam.x) * k);
    if (mine === false) return;
    addXp(25);                               // a collision is worth more than the cells it clears
    buzz([12, 24, 18], 2);
  }

  /* ══ the slap ════════════════════════════════════════════
     500 pops buys one. A hand comes down where you're standing, holds for a
     beat, and lifts to reveal the sheet letting go in a ring travelling out
     from the point of impact. The ripple is what sells the weight — a whole
     screen popping at once reads as a bug, not a blow. */

  const SLAP_FALL = reduced ? 0 : 380, SLAP_HOLD = 200, SLAP_LIFT = 440;
  const WAVE_MS = reduced ? 240 : 700;
  const SLAP_R = S * 13;              // the reach, in world units — the same for everyone

  function fireSlap() {
    if (slapFx || slapCharge < SLAP_AT) return;
    const x = walker.on ? walker.x : cam.x + viewW / 2;
    const y = walker.on ? walker.y : VH * 0.52;
    slapCharge = 0;
    store.set("slap", 0);
    paintSlap();
    startSlap(x, y, true);
    netEvent({ t: "k", x: Math.round(x), y: Math.round(y) });
  }

  function startSlap(x, y, mine) {
    if (slapFx) return;
    slapFx = { t0: performance.now(), x, y, mine: !!mine, hit: false, r: 0, ring: 0, n: 0 };
  }

  // The wavefront: every cell between where the ring was last frame and where
  // it is now lets go. Only the first few each frame get a real voice —
  // three hundred queued pops would take four seconds to drain.
  /* A shockfront: everything between where the ring was last frame and where it
     is now lets go. Only the first few each frame get a real voice — three
     hundred queued pops would take four seconds to drain. Both the slap and the
     heart burst travel this way, which is also why they stay in step across
     machines: same centre, same reach, same easing, so the same cells go. */
  function crossWave(w, r1, now, loudMax, tint) {
    const r0 = w.r;
    if (r1 <= r0) return;
    w.r = r1;
    let loud = 0;
    for (const c of cells) {
      if (c.st !== 0) continue;
      const d2 = (c.x - w.x) ** 2 + (c.y - w.y) ** 2;
      if (d2 < r0 * r0 || d2 > r1 * r1) continue;
      if (loud++ < loudMax) popCell(c, now, w.mine);
      else popQuiet(c, now, w.mine);
      w.n++;
    }
    if (!reduced && r1 - w.ring > S * 1.6) {            // the front, drawn where it is
      w.ring = r1;
      rings.push({ x: w.x, y: w.y, t: now, life: 430, wave: r1, c: tint });
    }
  }

  function stepSlap(now) {
    if (!slapFx) return;
    const e = now - slapFx.t0;
    if (e < SLAP_FALL) return;
    if (!slapFx.hit) { slapFx.hit = true; slapLand(now); }

    const p = Math.min(1, (e - SLAP_FALL) / WAVE_MS);
    crossWave(slapFx, SLAP_R * easeOut(p), now, 3);

    if (p >= 1 && !slapFx.told) {
      slapFx.told = true;
      countEl.textContent = fmt(pops);                   // the quiet ones never touched it
      store.set("pops", pops); store.set("exp", exp);
      if (slapFx.mine) { addXp(40); toast(slapFx.n + " flattened"); }
    }
    if (p >= 1 && e > SLAP_FALL + SLAP_HOLD + SLAP_LIFT) slapFx = null;
  }

  function slapLand(now) {
    const cx = slapFx.x, cy = slapFx.y;
    slapSound();
    rings.push({ x: cx, y: cy, t: now, life: 540, big: true });

    if (!reduced) {
      shake = 1.8;
      flash = { x: cx, y: cy, t: now };
      for (let i = 0; i < 30; i++) {           // dust thrown out along the ground
        const a = Math.random() * 6.2832, sp = 1.5 + Math.random() * 4;
        parts.push({
          x: cx + (Math.random() - 0.5) * S * 5, y: cy + (Math.random() - 0.5) * S,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.4 - 0.6,
          r: 2 + Math.random() * 3.4, life: 520 + Math.random() * 420,
          t: now, c: darkNow ? "#8E8CA0" : "#9C9AAE", soft: true
        });
      }
    }

    // whoever is standing near it goes up. Peers are thrown on their own
    // machines and arrive here already airborne.
    for (const c of [walker, ...npcs]) {
      const d = Math.hypot(c.x - cx, c.y - cy);
      const fall = Math.max(0, 1 - d / SLAP_R);
      if (fall <= 0) continue;
      c.hopV = -S * (4 + 4.5 * fall);
      const ux = (c.x - cx) / (d || 1), uy = (c.y - cy) / (d || 1);
      c.kx += ux * S * 5 * fall;
      c.ky += uy * S * 3 * fall;
      if (fall > 0.35) c.stun = 0.5;
    }
    if (slapFx.mine) buzz([30, 40, 60], 3);
  }

  /* The hand is drawn once into its own canvas and stamped from there. It has
     to be: the fingers, the knuckles and the thumb overlap, so fading a live
     path would show every seam through itself. */

  const SKIN = { lit: "#F5CBAA", mid: "#E3A97F", low: "#C1815A", deep: "#98593B", nail: "#F8DDC9" };
  const skin = c => darkNow ? mix(c, "#0B0B12", 0.32) : c;
  const HAND_W = 2.0, HAND_H = 3.0, HAND_OX = 1.0, HAND_OY = 1.55;   // in units of u
  // index, middle, ring, little: x offset, fan angle, width, length
  const FINGERS = [[-0.42, -0.13, 0.25, 0.92], [-0.14, -0.04, 0.265, 1.03],
                   [0.14, 0.06, 0.25, 0.95], [0.40, 0.17, 0.215, 0.74]];
  let handCvs = null, handDark = null;

  function handSprite() {
    if (handCvs && handDark === darkNow) return handCvs;
    const u = 240, res = Math.min(2, window.devicePixelRatio || 1);
    const c = document.createElement("canvas");
    c.width = Math.ceil(u * HAND_W * res);
    c.height = Math.ceil(u * HAND_H * res);
    const x = c.getContext("2d");
    x.scale(res, res);
    x.translate(u * HAND_OX, u * HAND_OY);
    paintHand(x, u);
    handCvs = c; handDark = darkNow;
    return c;
  }

  // The back of a hand, lit from the top left like everything else here.
  function paintHand(x, u) {
    const grad = x.createLinearGradient(-u * 0.8, -u * 1.2, u * 0.9, u * 1.2);
    grad.addColorStop(0, skin(SKIN.lit));
    grad.addColorStop(0.45, skin(SKIN.mid));
    grad.addColorStop(1, skin(SKIN.low));
    const edge = rgba(skin(SKIN.deep), 0.5);

    x.lineJoin = "round";
    x.lineCap = "round";

    const digit = (px, py, w, len, tilt) => {
      x.save();
      x.translate(px, py);
      x.rotate(tilt);
      x.fillStyle = grad;
      rr(x, -w / 2, -len, w, len + w, w / 2);
      x.fill();
      x.lineWidth = u * 0.012;
      x.strokeStyle = edge;
      x.stroke();
      x.strokeStyle = rgba(skin(SKIN.deep), 0.26);              // knuckle creases
      x.lineWidth = u * 0.011;
      for (const f of [0.36, 0.66]) {
        x.beginPath();
        x.moveTo(-w * 0.34, -len * f); x.lineTo(w * 0.34, -len * f);
        x.stroke();
      }
      x.fillStyle = rgba(skin(SKIN.nail), 0.92);                // nail, foreshortened
      rr(x, -w * 0.28, -len + w * 0.16, w * 0.56, len * 0.2, w * 0.2);
      x.fill();
      x.restore();
    };

    x.fillStyle = grad;                                          // wrist, behind everything
    rr(x, -u * 0.34, u * 0.3, u * 0.68, u * 1.1, u * 0.2);
    x.fill();

    for (const f of FINGERS) digit(f[0] * u, -u * 0.3, f[2] * u, f[3] * u, f[1]);

    x.beginPath();                                               // the back of the hand
    x.moveTo(-u * 0.58, -u * 0.3);
    x.quadraticCurveTo(-u * 0.68, u * 0.2, -u * 0.44, u * 0.6);
    x.quadraticCurveTo(0, u * 0.86, u * 0.44, u * 0.6);
    x.quadraticCurveTo(u * 0.66, u * 0.2, u * 0.56, -u * 0.3);
    x.quadraticCurveTo(0, -u * 0.5, -u * 0.58, -u * 0.3);
    x.closePath();
    x.fillStyle = grad; x.fill();
    x.lineWidth = u * 0.013; x.strokeStyle = edge; x.stroke();

    x.save();                                                    // thumb, over the near edge
    x.translate(-u * 0.52, u * 0.16);
    x.rotate(-1.2);
    x.fillStyle = grad;
    rr(x, -u * 0.155, -u * 0.74, u * 0.31, u * 0.95, u * 0.155);
    x.fill();
    x.lineWidth = u * 0.013; x.strokeStyle = edge; x.stroke();
    x.fillStyle = rgba(skin(SKIN.nail), 0.88);
    rr(x, -u * 0.095, -u * 0.68, u * 0.19, u * 0.21, u * 0.08);
    x.fill();
    x.restore();

    x.strokeStyle = rgba(skin(SKIN.deep), 0.3);                  // knuckles
    x.lineWidth = u * 0.02;
    for (const f of FINGERS) {
      x.beginPath();
      x.arc(f[0] * u, -u * 0.24, u * 0.09, Math.PI * 1.15, Math.PI * 1.85);
      x.stroke();
    }

    x.strokeStyle = rgba("#FFFFFF", darkNow ? 0.05 : 0.14);      // tendons
    x.lineWidth = u * 0.022;
    for (const f of FINGERS) {
      x.beginPath();
      x.moveTo(f[0] * u, -u * 0.18);
      x.quadraticCurveTo(f[0] * u * 0.6, u * 0.12, f[0] * u * 0.32, u * 0.44);
      x.stroke();
    }
  }

  function drawPalm(cx, cy, scale, alpha) {
    const c = handSprite();
    const u = VH * 0.32 * scale;
    g.globalAlpha = alpha;
    g.drawImage(c, cx - u * HAND_OX, cy - u * HAND_OY, u * HAND_W, u * HAND_H);
    g.globalAlpha = 1;
  }

  function drawSlap(now) {
    if (!slapFx || reduced) return;
    const e = now - slapFx.t0;

    if (e < SLAP_FALL) {                       // coming down
      const p = e / SLAP_FALL;
      const drop = p * p;                      // accelerating
      const sh = 0.25 + drop * 0.75;
      g.fillStyle = rgba("#000000", (darkNow ? 0.5 : 0.3) * sh);
      g.beginPath();
      g.ellipse(slapFx.x, slapFx.y + S * 0.5, SLAP_R * 0.62 * sh, SLAP_R * 0.3 * sh, 0, 0, 6.2832);
      g.fill();
      drawPalm(slapFx.x, slapFx.y - VH * (1.5 - drop * 1.5), 0.6 + drop * 0.4, 0.45 + drop * 0.55);
      return;
    }

    const held = e - SLAP_FALL;
    if (held < SLAP_HOLD) { drawPalm(slapFx.x, slapFx.y, 1, 1); return; }

    const p = Math.min(1, (held - SLAP_HOLD) / SLAP_LIFT);   // lifting off
    if (p >= 1) return;
    drawPalm(slapFx.x, slapFx.y - VH * 1.5 * p * p, 1 - p * 0.12, (1 - p) * 0.95);
  }

  /* ══ multiplayer ═════════════════════════════════════════
     A relay, not a server: it stores nothing and decides nothing. What keeps
     everybody's world the same is that the world itself is deterministic —
     one fixed grid on every device, and cells that refill on a schedule
     baked into the cell rather than rolled at random. So clients only have
     to agree on *events*, never on state:

       · where each player is, twelve times a second
       · where the wanderers are, from whichever client is host — the lowest
         id in the room. Everyone else plays those positions back.
       · one short message per bang: a tap, a collision, a slap, an emote.

     Nobody ever sends the sheet. Cells pop under a peer's feet on your
     machine because you are running the same footsteps they are. */

  const ROOM = "friends";
  const SEND_HZ = 12;
  const DEFAULT_RELAY = "wss://sheet-relay.realworldkelvin.workers.dev";

  // ?relay=wss://… overrides and sticks, so the address can change without a rebuild
  const relayParam = new URLSearchParams(location.search).get("relay");
  if (relayParam !== null) store.set("relay", relayParam);
  const RELAY = (relayParam !== null ? relayParam : store.get("relay", DEFAULT_RELAY)).trim();

  const net = {
    ws: null, id: null, name: "", peers: new Map(), ids: new Set(),
    sendAt: 0, npcAt: 0, state: "off"
  };

  const idNum = s => parseInt(s, 10) || 0;

  // The lowest id in the room runs the wanderers. On your own, that's you —
  // which is why single player behaves exactly as it always did.
  function isHost() {
    if (net.state !== "on" || !net.id) return true;
    const me = idNum(net.id);
    for (const id of net.ids) if (idNum(id) < me) return false;
    return true;
  }

  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // A headcount tells you how many; a room tells you who. Names, yours first
  // and in bold, and a tail count once there are more than four of you.
  function paintOnline() {
    const el = document.getElementById("online");
    const n = document.getElementById("onlineN");
    if (!el || !n) return;
    el.classList.toggle("live", net.state === "on");
    el.classList.toggle("bad", net.state === "error" || net.state === "full");

    if (net.state !== "on") {
      n.innerHTML =
        net.state === "connecting" ? "connecting…"
        : net.state === "full" ? "room full"
        : net.state === "error" ? "reconnecting…"
        : esc(net.name || "solo");
      return;
    }

    const others = [];
    for (const [, p] of net.peers) if (p.name) others.push(p.name);
    others.sort();
    const shown = others.slice(0, 4).map(esc);
    const rest = others.length - shown.length;
    n.innerHTML = "<b>" + esc(net.name || "you") + "</b>"
      + (shown.length ? " · " + shown.join(" · ") : "")
      + (rest > 0 ? " +" + rest : "");
  }

  function netConnect(name) {
    net.name = name;
    if (!RELAY) { net.state = "solo"; paintOnline(); return; }
    net.state = "connecting";
    paintOnline();
    let ws;
    try { ws = new WebSocket(RELAY.replace(/\/+$/, "") + "/room/" + ROOM); }
    catch (e) { net.state = "error"; paintOnline(); return; }
    net.ws = ws;

    ws.onopen = () => { net.state = "on"; paintOnline(); netSend(true); };
    ws.onerror = () => { net.state = "error"; paintOnline(); };
    ws.onclose = () => {
      net.ws = null; net.peers.clear(); net.ids.clear();
      if (net.state !== "full") net.state = "error";
      paintOnline();
      setTimeout(() => { if (!net.ws && net.name) netConnect(net.name); }, 4000);
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      try { netApply(m); } catch (e) { /* a bad packet must not stop the world */ }
    };
  }

  function newPeer(id) {
    const p = {
      x: 0, y: 0, z: 0, vx: 0, vy: 0, kx: 0, ky: 0, hop: 0, hopV: 0,
      tx: 0, ty: 0, thop: 0, placed: 0,
      step: Math.random() * 6, face: 1, blink: 0, nextBlink: 2200, cool: 0,
      scale: 1, belt: true, remote: true, name: "", emo: null, duet: null,
      look: { body: "auto", hat: "none", eyes: "dots" }
    };
    net.peers.set(id, p);
    net.ids.add(id);
    paintOnline();
    return p;
  }

  function netApply(m) {
    if (m.t === "hello") {
      net.id = m.id;
      for (const id of m.peers || []) net.ids.add(id);
      return;
    }
    if (m.t === "full") { net.state = "full"; paintOnline(); return; }
    if (m.t === "join") { net.ids.add(m.id); netSend(true); return; }   // re-announce so they see us
    if (m.t === "left") {
      const p = net.peers.get(m.id);
      if (p && p.duet) endDuet(p.duet);
      net.peers.delete(m.id); net.ids.delete(m.id);
      paintOnline();
      return;
    }

    if (m.t === "s") {
      const p = net.peers.get(m.id) || newPeer(m.id);
      const named = String(m.n || "").slice(0, 14);
      // a peer exists before it has a name — the roster only reads right once
      // the first state message brings one, so repaint when it lands
      if (named !== p.name) { p.name = named; paintOnline(); }
      if (m.l) p.look = { body: m.l[0], hat: m.l[1], eyes: m.l[2] };
      p.tx = +m.x; p.ty = +m.y;                        // same world, same numbers
      p.thop = +m.h || 0;
      p.face = m.f >= 0 ? 1 : -1;
      p.moving = !!m.m;
      p.seen = performance.now();
      if (!p.placed) { p.placed = 1; p.x = p.tx; p.y = p.ty; }
      return;
    }

    if (m.t === "n") {                                 // the host's wanderers
      if (isHost()) return;                            // …unless that's me
      const a = m.a || [];
      for (let i = 0; i < Math.min(a.length, npcs.length); i++) {
        const n = npcs[i], s = a[i];
        n.rx = s[0]; n.ry = s[1]; n.rface = s[2]; n.moving = s[3]; n.rhop = s[4];
        if (!n.placed) { n.placed = 1; n.x = n.rx; n.y = n.ry; n.hop = n.rhop; n.face = n.rface; }
      }
      return;
    }

    if (m.t === "p") {                                 // somebody tapped a cell
      const c = cells[m.i | 0];
      if (c) popCell(c, performance.now(), false);
      return;
    }

    if (m.t === "b") {                                 // somebody walked into somebody
      blast(+m.x, +m.y, performance.now(), false);
      if (m.i != null) cry((+m.x - cam.x) * k, 0.22);  // their bump, our pet's voice
      if (isHost() && m.i != null && npcs[m.i]) {      // the shove they felt, applied where it counts
        const n = npcs[m.i];
        const d = Math.hypot(n.x - m.x, n.y - m.y) || 1;
        n.kx += (n.x - m.x) / d * S * 7;
        n.ky += (n.y - m.y) / d * S * 7;
        n.turn = 0.15;
        n.stun = 0.55;
      }
      return;
    }

    if (m.t === "k") { startSlap(+m.x, +m.y, false); return; }

    if (m.t === "e") {
      const p = net.peers.get(m.id) || newPeer(m.id);
      p.emo = { k: String(m.k || "").slice(0, 4), t: performance.now() };
      pairUp();
      return;
    }

    if (m.t === "d") {                                 // their score, mid-duel
      const p = net.peers.get(m.id) || newPeer(m.id);
      p.duelPops = Math.max(p.duelPops | 0, m.s | 0);   // a score never walks backwards
      return;
    }
  }

  function netSend(force) {
    if (!net.ws || net.ws.readyState !== 1) return;
    const now = performance.now();
    if (!force && now - net.sendAt < 1000 / SEND_HZ) return;
    net.sendAt = now;
    const w = walker;
    try {
      net.ws.send(JSON.stringify({
        t: "s",
        n: net.name,
        l: [look.body, look.hat, look.eyes],
        x: Math.round(w.x), y: Math.round(w.y),        // the world is the same size everywhere now
        h: Math.round(w.hop || 0),
        f: w.face >= 0 ? 1 : -1,
        m: Math.hypot(w.vx, w.vy) > S * 0.4 ? 1 : 0
      }));
    } catch (e) { /* the socket closes itself */ }
  }

  function netEvent(o) {
    if (!net.ws || net.ws.readyState !== 1) return;
    try { net.ws.send(JSON.stringify(o)); } catch (e) {}
  }

  function netNpcs() {
    if (!net.ws || net.ws.readyState !== 1) return;
    const now = performance.now();
    if (now - net.npcAt < 1000 / SEND_HZ) return;
    net.npcAt = now;
    netEvent({
      t: "n",
      a: npcs.map(n => [Math.round(n.x), Math.round(n.y), n.face >= 0 ? 1 : -1,
                        n.moving ? 1 : 0, Math.round(n.hop || 0)])
    });
  }

  // remote players are critters somebody else is steering
  function stepPeers(now, dt) {
    for (const [id, p] of net.peers) {
      if (now - p.seen > 12000) {
        if (p.duet) endDuet(p.duet);
        net.peers.delete(id); net.ids.delete(id); paintOnline();
        continue;
      }
      if (p.jail && now >= p.jail.until) p.jail = null;   // their sentence ends off screen too

      const e = Math.min(1, dt * 12);
      const ox = p.x, oy = p.y;
      p.x += (p.tx - p.x) * e;
      p.y += (p.ty - p.y) * e;
      p.hop += (p.thop - p.hop) * e;
      p.vx = dt > 0 ? (p.x - ox) / dt : 0;
      p.vy = dt > 0 ? (p.y - oy) / dt : 0;
      tick(p, dt, p.moving ? 1 : 0);
      // their feet flatten your sheet too — same footsteps, same cells
      if (p.moving) trample(p, now, S * 0.56, true, false);
    }
  }

  function drawPeerTags() {
    if (!net.peers.size) return;
    const fs = Math.max(9, Math.round(S * 0.2));
    g.font = `600 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const [, p] of net.peers) {
      if (!p.name || p.x < cam.x - S * 2 || p.x > cam.x + viewW + S * 2) continue;
      const y = p.y + p.hop - S * 1.05;
      const wide = g.measureText(p.name).width + fs * 1.5;
      rr(g, p.x - wide / 2, y - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.74);
      g.fill();
      g.fillStyle = rgba(darkNow ? "#ECECF4" : "#1A1A24", 0.92);
      g.fillText(p.name, p.x, y);
    }
  }

  function collide(now, hosting) {
    const w = walker;
    if (w.duet || w.jail) return;                      // hugging and caged are not colliding

    // bumping into a friend does the same thing as bumping into a wanderer.
    // The lower of the two ids owns the pair, so the bang happens once and
    // both of you see the same one.
    for (const [id, p] of net.peers) {
      if (p.duet || p.jail) continue;                  // a cage takes the hit for them
      const dx = p.x - w.x, dy = p.y - w.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const sep = S * 1.65;
      if (d > sep) continue;
      const ux = dx / d, uy = dy / d;
      w.x -= ux * ((sep - d) / 2 + S * 0.3);
      w.y -= uy * ((sep - d) / 2 + S * 0.3);
      w.kx -= ux * S * 7; w.ky -= uy * S * 7;
      if (p.cool > 0) continue;
      p.cool = 0.9;
      if (idNum(net.id) < idNum(id)) {
        const bx = (p.x + w.x) / 2, by = (p.y + w.y) / 2;
        blast(bx, by, now, true);
        netEvent({ t: "b", x: Math.round(bx), y: Math.round(by) });
      }
    }

    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (!n.placed) continue;
      const dx = n.x - w.x, dy = n.y - w.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const sep = S * 0.55 * (w.scale + n.scale) * 1.5;   // about two people apart
      if (d > sep) continue;

      const ux = dx / d, uy = dy / d;
      const push = (sep - d) / 2 + S * 0.3;
      n.x += ux * push; n.y += uy * push;
      w.x -= ux * push; w.y -= uy * push;

      const kick = S * 7;
      n.kx += ux * kick; n.ky += uy * kick;
      w.kx -= ux * kick; w.ky -= uy * kick;
      n.turn = 0.15;
      n.stun = 0.55;                                   // shove them and they stay shoved

      if (n.cool <= 0) {
        n.cool = 0.9;
        const bx = (n.x + w.x) / 2, by = (n.y + w.y) / 2;
        blast(bx, by, now, true);
        cry((n.x - cam.x) * k, 0.22);         // after the bang, not under it
        // the index rides along so the host can shove the same wanderer
        netEvent({ t: "b", x: Math.round(bx), y: Math.round(by), i });
      }
    }

    if (!hosting) return;
    for (let i = 0; i < npcs.length; i++) {             // wanderers just step around each other
      for (let j = i + 1; j < npcs.length; j++) {
        const a = npcs[i], b = npcs[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const sep = S * 0.9;
        if (d > sep) continue;
        const p = (sep - d) / 2, ux = dx / d, uy = dy / d;
        b.x += ux * p; b.y += uy * p;
        a.x -= ux * p; a.y -= uy * p;
      }
    }
  }

  /* ══ emotes, and what two of them together mean ══════════
     One tap puts a face over your head for two seconds and tells the room.
     If two people show the same face inside that window, the closest pair of
     them stops being two people standing near each other and starts being a
     scene: hearts hug, skulls throw hands. Every client works out the pair
     from the same events, and each one only drives its own body — so the two
     halves meet in the middle without anybody being in charge. */

  const EMO = ["❤️", "😭", "😠", "💀"];
  const EMO_MS = 2000;
  const BODY = S * 1.1;                      // one critter, shoulder to shoulder
  const DUET_REACH = BODY * 3;               // three of those apart, and no further
  const duets = [];

  function emote(k) {
    walker.emo = { k, t: performance.now() };
    netEvent({ t: "e", k });
    pairUp();
  }

  function bodies() {
    const list = [{ id: net.id || "me", b: walker }];
    for (const [id, p] of net.peers) list.push({ id, b: p });
    return list;
  }

  /* Pairing measures the freshest position we have, not the one on screen. A
     peer is drawn where the interpolation has got to, which trails what they
     actually told us by a frame or two — near the three-body line that is the
     difference between us pairing and them pairing, and half a hug is worse
     than none. Both machines reading the reported number keeps them agreeing. */
  const atX = b => (b.remote && b.placed) ? b.tx : b.x;
  const atY = b => (b.remote && b.placed) ? b.ty : b.y;

  function emoLive(now) {
    if (walker.emo && now - walker.emo.t < EMO_MS) return true;
    for (const [, p] of net.peers) if (p.emo && now - p.emo.t < EMO_MS) return true;
    return false;
  }

  function pairUp() {
    const now = performance.now();
    for (const kind of ["❤️", "💀"]) {
      const set = bodies().filter(o =>
        o.b.emo && o.b.emo.k === kind && now - o.b.emo.t < EMO_MS
        && !o.b.duet && !o.b.jail && o.b.placed !== 0);
      if (set.length < 2) continue;
      let best = null, bd = DUET_REACH;
      for (let i = 0; i < set.length; i++) {
        for (let j = i + 1; j < set.length; j++) {
          const a = set[i].b, b = set[j].b;
          const d = Math.hypot(atX(a) - atX(b), atY(a) - atY(b));
          if (d < bd) { bd = d; best = [a, b]; }
        }
      }
      if (best) startDuet(kind, best[0], best[1], now);
    }
  }

  function startDuet(kind, a, b, now) {
    const ax = atX(a), ay = atY(a), bx = atX(b), by = atY(b);
    const dx = bx - ax, dy = by - ay;
    const d = Math.hypot(dx, dy) || 1;
    const D = {
      kind, a, b, t0: now,
      cx: (ax + bx) / 2, cy: (ay + by) / 2,            // frozen, so it can't drift apart
      ux: dx / d, uy: dy / d,
      dur: kind === "❤️" ? 2200 : 2400, jab: 0
    };
    a.duet = D; b.duet = D;
    a.emo = b.emo = null;                              // the scene replaces the face
    duets.push(D);
  }

  function endDuet(D) {
    const i = duets.indexOf(D);
    if (i >= 0) duets.splice(i, 1);
    if (D.a) D.a.duet = null;
    if (D.b) D.b.duet = null;
  }

  // A scene that runs its course pays off; one cut short by somebody closing
  // their laptop does not. Every client reaches this line off the same events
  // at the same moment, so the payoff needs no message of its own.
  function finishDuet(D, now) {
    endDuet(D);
    if (D.kind === "❤️") heartBurst(D, now);
    else startDuel(D, now);
  }

  const APPROACH = 620;

  function stepDuets(now, dt) {
    for (let i = duets.length - 1; i >= 0; i--) {
      const D = duets[i];
      const e = now - D.t0;
      if (e > D.dur) { finishDuet(D, now); continue; }

      const gap = D.kind === "❤️" ? S * 0.58 : S * 1.25;
      const ease = easeOut(Math.min(1, e / APPROACH));

      // where each of them belongs this instant: their half of the gap, plus
      // however far into the other one they're leaning
      const L = D.kind === "💀" ? lunges(e) : ZERO2;
      drive(D.a, D.cx - D.ux * (gap / 2 - L[0]), D.cy - D.uy * (gap / 2 - L[0]), ease, dt);
      drive(D.b, D.cx + D.ux * (gap / 2 - L[1]), D.cy + D.uy * (gap / 2 - L[1]), ease, dt);

      D.a.face = D.ux >= 0 ? 1 : -1;                   // look at each other
      D.b.face = D.ux >= 0 ? -1 : 1;

      if (D.kind === "❤️") {
        if (!reduced && e > APPROACH && Math.random() < dt * 14) {
          parts.push({
            x: D.cx + (Math.random() - 0.5) * S * 0.8, y: D.cy - S * 0.4,
            vx: (Math.random() - 0.5) * 0.6, vy: -1.1 - Math.random(),
            r: 2.4 + Math.random() * 2, life: 700 + Math.random() * 400,
            t: now, c: "#EE6B8B", heart: true
          });
        }
      } else {
        // three landed punches, one every 400ms once they're in range
        const beat = Math.floor((e - APPROACH) / 400);
        if (beat >= 0 && beat < 3 && beat >= D.jab) {
          D.jab = beat + 1;
          punchFx(D, now, beat);
        }
      }
    }
  }

  // Three punches, one every 400ms, taking turns. Returns how far each of
  // the two is leaning into the other right now.
  const ZERO2 = [0, 0];
  function lunges(e) {
    const t = e - APPROACH;
    if (t < 0) return ZERO2;
    const beat = Math.floor(t / 400), phase = t % 400;
    if (beat > 2 || phase > 200) return ZERO2;
    const amt = Math.sin(phase / 200 * Math.PI) * S * 0.5;
    return beat % 2 === 0 ? [amt, 0] : [0, amt];
  }

  // only bodies this client owns get pushed; the peer's own machine is doing
  // the same sum for the other half
  function drive(b, x, y, ease, dt) {
    if (b.remote) return;
    b.vx = 0; b.vy = 0; b.kx = 0; b.ky = 0;
    const e = Math.min(1, dt * (6 + 16 * ease));
    b.x += (x - b.x) * e;
    b.y += (y - b.y) * e;
    b.step += dt * 9;
  }

  function punchFx(D, now, beat) {
    const s = beat % 2 ? -1 : 1;                       // +1: a hits b, -1: b hits a
    const hx = D.cx + D.ux * S * 0.3 * s, hy = D.cy + D.uy * S * 0.3 * s;
    const target = beat % 2 ? D.a : D.b;
    if (!target.remote) {                              // their own machine rocks them back
      target.kx += D.ux * S * 5 * s;
      target.ky += D.uy * S * 5 * s;
      target.hopV = Math.min(target.hopV, -S * 1.4);
    }
    rings.push({ x: hx, y: hy, t: now, life: 300, stomp: true });
    if (!reduced) {
      shake = Math.max(shake, 0.55);
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * 6.2832, sp = 1 + Math.random() * 2.4;
        parts.push({
          x: hx, y: hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
          r: 1.4 + Math.random() * 2, life: 300 + Math.random() * 240,
          t: now, c: "#F0C24B"
        });
      }
    }
    boom((hx - cam.x) * k);
  }

  /* ══ what a hug leaves behind ════════════════════════════
     Two hearts don't just hug, they go off: a pink front travels out from the
     spot they were standing on and takes the sheet with it. Same shockfront the
     slap uses, so it lands on the same cells on every screen. */

  const HEART_C = "#EE6B8B";
  const HEART_R = BODY * 9, HEART_MS = 720;
  const waves = [];

  function heartBurst(D, now) {
    const cx = D.cx, cy = D.cy;
    const mine = !D.a.remote || !D.b.remote;         // one of them is me
    waves.push({ x: cx, y: cy, t0: now, R: HEART_R, ms: HEART_MS,
                 r: 0, ring: 0, n: 0, mine, tint: HEART_C });
    heartBloom((cx - cam.x) * k);
    flash = { x: cx, y: cy, t: now, c: HEART_C };
    if (!reduced) {
      shake = Math.max(shake, 1.2);
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * 6.2832, sp = 1.6 + Math.random() * 4.2;
        parts.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
          r: 2.4 + Math.random() * 2.4, life: 700 + Math.random() * 500,
          t: now, c: HEART_C, heart: true
        });
      }
    }
    // it knocks over everyone standing near — except the two it came out of
    for (const b of [walker, ...npcs, ...net.peers.values()]) {
      if (b === D.a || b === D.b) continue;
      const d = Math.hypot(b.x - cx, b.y - cy);
      const fall = Math.max(0, 1 - d / HEART_R);
      if (fall <= 0) continue;
      b.hopV = Math.min(b.hopV, -S * (2.2 + 3 * fall));
      b.kx += (b.x - cx) / (d || 1) * S * 4 * fall;
      b.ky += (b.y - cy) / (d || 1) * S * 2.4 * fall;
      if (fall > 0.35) b.stun = 0.5;
    }
  }

  function stepWaves(now) {
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      const p = Math.min(1, (now - w.t0) / w.ms);
      crossWave(w, w.R * easeOut(p), now, 3, w.tint);
      if (p < 1) continue;
      countEl.textContent = fmt(pops);                 // the quiet ones never touched it
      store.set("pops", pops); store.set("exp", exp);
      if (w.mine) { addXp(30); toast(w.n + " caught in it"); }
      waves.splice(i, 1);
    }
  }

  /* ══ what two skulls start ═══════════════════════════════
     Ten seconds from the moment they break apart, both of them popping as fast
     as they can. Whoever pops less is locked on the spot for ten more. Each
     side counts its own and says the number out loud four times a second;
     both machines then compare the same two numbers, so both agree on who goes
     in without anybody refereeing it. */

  const DUEL_MS = 10000, JAIL_MS = 10000, DUEL_GRACE = 500;
  let duel = null;

  function startDuel(D, now) {
    const pair = [D.a, D.b];
    for (const b of pair) b.duelPops = 0;
    duel = { t0: now, pair, me: pair.find(b => !b.remote) || null, sentAt: 0, told: 0 };
    if (duel.me) toast("Ten seconds — fewest pops gets locked up");
    boom((D.cx - cam.x) * k);
  }

  function stepDuel(now) {
    if (!duel) return;
    const e = now - duel.t0;

    if (e < DUEL_MS) {
      if (duel.me && now - duel.sentAt > 250) {        // say your number out loud
        duel.sentAt = now;
        netEvent({ t: "d", s: duel.me.duelPops | 0 });
      }
      return;
    }
    if (!duel.told) {                                  // time — one last honest number,
      duel.told = now;                                 // sent whether or not one is due
      if (duel.me) netEvent({ t: "d", s: duel.me.duelPops | 0 });
      return;
    }
    if (now - duel.told < DUEL_GRACE) return;          // …and time for theirs to land

    const [a, b] = duel.pair;
    const sa = a.duelPops | 0, sb = b.duelPops | 0;
    if (sa === sb) {
      if (duel.me) toast("Dead heat at " + sa + " — nobody goes in");
    } else {
      lockUp(sa < sb ? a : b, Math.abs(sa - sb), now, duel.me);
    }
    duel = null;
  }

  function lockUp(b, margin, now, mine) {
    b.jail = { t0: now, until: now + JAIL_MS };
    b.jx = b.x; b.jy = b.y;                            // the spot it closes around
    b.kx = b.ky = 0;
    rings.push({ x: b.x, y: b.y, t: now, life: 620, big: true });
    if (!reduced) shake = Math.max(shake, 0.8);
    clang((b.x - cam.x) * k);
    if (!b.remote) { buzz([25, 60, 25, 60, 25], 3); toast("Locked up — lost by " + margin); }
    else if (mine) toast("Won by " + margin + " — " + (b.name || "they") + " is in");

  }

  // a cage dropping onto stone
  function clang(x) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = ac.currentTime + 0.001;
      tone(t, { from: 92, to: 48, sweep: 0.18, gain: 0.7, a: 0.004, d: 0.4 });
      crack(t, { type: "bandpass", freq: 2400, q: 3, gain: 0.55, knee: 0.3, d: 0.09 });
      crack(t + 0.02, { type: "bandpass", freq: 3600, q: 5, gain: 0.3, knee: 0.2, d: 0.22 });
      burst(t + 0.04, { type: "lowpass", freq: 700, q: 1, gain: 0.3, d: 0.26 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  // over each duellist: what they're on, and how long they have
  function drawDuel(now) {
    if (!duel) return;
    const left = Math.max(0, DUEL_MS - (now - duel.t0));
    const fs = Math.max(10, Math.round(S * 0.28));
    g.font = `700 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const b of duel.pair) {
      if (b.x < cam.x - S * 2 || b.x > cam.x + viewW + S * 2) continue;
      const label = (b.duelPops | 0) + (b === duel.me ? "   " + Math.ceil(left / 1000) + "s" : "");
      const wide = g.measureText(label).width + fs * 1.3;
      const y = b.y + (b.hop || 0) - S * 1.95;
      rr(g, b.x - wide / 2, y - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#1B1B24" : "#FFFFFF", 0.88);
      g.fill();
      g.strokeStyle = rgba("#E5484D", 0.55);
      g.lineWidth = 1.2;
      g.stroke();
      g.fillStyle = darkNow ? "#FFD9DA" : "#B4242A";
      g.fillText(label, b.x, y);
    }
  }

  // two rails and five bars, slammed down over whoever lost
  function drawCages(now) {
    for (const b of [walker, ...net.peers.values()]) {
      if (!b.jail) continue;
      const left = b.jail.until - now;
      if (left <= 0) { b.jail = null; continue; }
      if (b.x < cam.x - S * 3 || b.x > cam.x + viewW + S * 3) continue;

      const u = S * 0.55 * (b.scale || 1);
      const halfW = u * 1.3, top = -u * 2.3, bot = u * 1.2;
      const drop = Math.min(1, (now - b.jail.t0) / 260);

      g.save();
      g.translate(b.x, b.y);
      g.fillStyle = rgba("#000000", darkNow ? 0.34 : 0.15);
      g.beginPath(); g.ellipse(0, bot, halfW * 1.05, u * 0.2, 0, 0, 6.2832); g.fill();

      g.save();
      g.translate(0, -(1 - drop) * VH * 0.6);          // comes down from off screen
      g.globalAlpha = 0.94;
      g.strokeStyle = darkNow ? "#A6A6BA" : "#494958";
      g.lineCap = "round";
      g.lineWidth = Math.max(1.6, S * 0.05);
      for (let i = 0; i <= 3; i++) {                   // four, so the face sits in a gap
        const bx = -halfW + halfW * 2 * (i / 3);
        g.beginPath(); g.moveTo(bx, top); g.lineTo(bx, bot); g.stroke();
      }
      g.lineWidth = Math.max(2.2, S * 0.075);
      for (const ry of [top, top + (bot - top) * 0.52, bot]) {
        g.beginPath(); g.moveTo(-halfW, ry); g.lineTo(halfW, ry); g.stroke();
      }
      g.restore();

      const fs = Math.max(9, Math.round(S * 0.26));    // the countdown, on the floor
      g.font = `700 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const t = Math.ceil(left / 1000) + "s";
      const wide = g.measureText(t).width + fs * 1.4;
      const ty = bot + u * 0.72;
      rr(g, -wide / 2, ty - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.88);
      g.fill();
      g.strokeStyle = rgba("#E5484D", 0.5);
      g.lineWidth = 1.2;
      g.stroke();
      g.fillStyle = "#E5484D";
      g.fillText(t, 0, ty);
      g.restore();
    }
  }

  // the face over your head, and the hearts over a hug
  function drawEmotes(now) {
    const list = [walker, ...net.peers.values()];
    const size = S * 0.66;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = size + `px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    for (const b of list) {
      if (!b.emo) continue;
      const e = now - b.emo.t;
      if (e > EMO_MS) { b.emo = null; continue; }
      if (b.x < cam.x - S * 2 || b.x > cam.x + viewW + S * 2) continue;
      const p = e / EMO_MS;
      const pop = p < 0.16 ? easeOut(p / 0.16) : 1;
      const y = b.y + b.hop - S * 1.62 - pop * S * 0.16;
      g.globalAlpha = p > 0.82 ? (1 - p) / 0.18 : 1;
      g.fillStyle = rgba(darkNow ? "#0C0C11" : "#FFFFFF", 0.55);
      g.beginPath();
      g.ellipse(b.x, y + size * 0.06, size * 0.62, size * 0.58, 0, 0, 6.2832);
      g.fill();
      g.fillText(b.emo.k, b.x, y);
      g.globalAlpha = 1;
    }
  }

  // ears or plates, drawn first so the body overlaps their base
  function drawPetTop(u, bw, bh, body) {
    if (pet === "cat") {
      g.fillStyle = body;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(s * bw * 0.28, -bh * 1.02);
        g.lineTo(s * bw * 0.92, -bh * 1.44);
        g.lineTo(s * bw * 0.88, -bh * 0.72);
        g.closePath(); g.fill();
      }
    } else if (pet === "dog") {
      g.fillStyle = mix(body, "#000000", 0.22);
      for (const s of [-1, 1]) {
        g.beginPath();
        g.ellipse(s * bw * 0.92, -bh * 0.42, u * 0.17, u * 0.36, s * 0.42, 0, 6.2832);
        g.fill();
      }
    } else {
      g.fillStyle = mix(body, "#000000", 0.18);
      for (let i = -1; i <= 1; i++) {
        const px = i * bw * 0.52;
        g.beginPath();
        g.moveTo(px - u * 0.14, -bh * (i ? 0.86 : 0.96));
        g.lineTo(px, -bh * (i ? 1.22 : 1.38));
        g.lineTo(px + u * 0.14, -bh * (i ? 0.86 : 0.96));
        g.closePath(); g.fill();
      }
    }
    g.fillStyle = body;
  }

  /* The hidden guest: her head does the walking. Feet and shadow stay the
     size feet are — only the head grows — so she stands on the ground like
     everybody else instead of scaling her shoes up into her own chin. */
  function drawGirl(w) {
    const u = S * 0.55 * w.scale;                    // the body she'd have had
    const big = u * (isGirl(w) ? GIRL_SCALE : 1);
    const spd = Math.min(1, Math.hypot(w.vx, w.vy) / (S * 3.1));
    const gait = Math.sin(w.step);
    g.save();
    g.translate(w.x, w.y);
    const air = Math.min(1, -w.hop / (S * 2.2));
    g.fillStyle = rgba("#000000", (darkNow ? 0.36 : 0.18) * (1 - air * 0.55));
    g.beginPath();
    g.ellipse(0, u * 1.1, u * (0.9 - air * 0.2), u * (0.2 - air * 0.05), 0, 0, 6.2832);
    g.fill();
    g.translate(0, w.hop);
    g.fillStyle = darkNow ? "#9C9AB0" : "#77758A";
    for (const s of [-1, 1]) {
      const lift = Math.max(0, gait * s) * u * 0.3 * spd;
      g.beginPath();
      g.ellipse(s * u * 0.38, u * 0.96 - lift, u * 0.26, u * 0.16, 0, 0, 6.2832);
      g.fill();
    }
    g.translate(0, gait * u * 0.07 * (0.4 + spd));
    g.rotate(gait * 0.05 * (0.3 + spd));
    const ih = big * 2.4, iw = ih * girlImg.naturalWidth / girlImg.naturalHeight;
    if (w.face < 0) g.scale(-1, 1);
    g.drawImage(girlImg, -iw / 2, u * 1.5 - ih, iw, ih);    // past the feet, so they're gone
    g.restore();
  }

  function drawCritter(w) {
    if (w.gone) {                                      // over the edge, falling away
      const p = Math.min(1, (performance.now() - w.gone.t0) / GONE_MS);
      // accelerating away rather than snapping out of existence
      const sc = Math.max(0.05, 1 - p * p * 0.92);
      g.save();
      g.translate(w.x, w.y);
      g.rotate(w.gone.spin * p * 1.6);
      g.scale(sc, sc);
      g.globalAlpha = 1 - p * p * p * 0.9;
      g.translate(-w.x, -w.y);
      if (isGirl(w)) drawGirl(w); else drawBody(w);
      g.globalAlpha = 1;
      g.restore();
      return;
    }
    if (isGirl(w)) { drawGirl(w); return; }
    drawBody(w);
  }

  function drawBody(w) {
    const L = w.look || look;          // remote players wear their own
    const u = S * 0.55 * w.scale;
    // the player is the opposite of the ground, so it separates from any
    // sheet; the wanderers sit in between and read as background life
    const dressed = w.belt && BODIES[L.body];
    const body = !w.belt ? (darkNow ? PETC[pet].dark : PETC[pet].lit)
      : dressed || (darkNow ? "#F2F1F8" : "#22222E");
    const face = dressed ? "#1B1B26"
      : (w.belt ? (darkNow ? "#22222E" : "#F2F1F8") : "#1C1C26");
    const spd = Math.min(1, Math.hypot(w.vx, w.vy) / (S * 3.1));
    const gait = Math.sin(w.step);
    const bob = gait * u * 0.07 * (0.4 + spd);
    const sq = 1 + Math.sin(w.step * 2) * 0.05 * spd;
    const bw = u * 0.76 / sq, bh = u * 0.84 * sq;

    g.save();
    g.translate(w.x, w.y);

    // the shadow stays on the ground and shrinks with altitude
    const air = Math.min(1, -w.hop / (S * 2.2));
    g.fillStyle = rgba("#000000", (darkNow ? 0.36 : 0.18) * (1 - air * 0.55));
    g.beginPath();
    g.ellipse(0, u * 1.1, u * (0.54 - air * 0.2), u * (0.13 - air * 0.05), 0, 0, 6.2832);
    g.fill();
    g.translate(0, w.hop);

    // mid-scene, lean into whoever you're hugging or hitting
    const D = w.duet;
    if (D) g.rotate((D.a === w ? 1 : -1) * (D.ux >= 0 ? 1 : -1) * (D.kind === "❤️" ? 0.17 : 0.1));

    g.fillStyle = body;
    for (const s of [-1, 1]) {                       // feet, tucked under the body
      const lift = Math.max(0, gait * s) * u * 0.3 * spd;
      g.beginPath();
      g.ellipse(s * u * 0.34, u * 0.96 + bob * 0.25 - lift, u * 0.22, u * 0.14, 0, 0, 6.2832);
      g.fill();
    }

    g.translate(0, bob);

    if (w.belt) {
      // arms swing against the legs — unless they're busy holding somebody
      const hugX = D && D.kind === "❤️" ? w.face * u * 0.32 : 0;
      for (const s of [-1, 1]) {
        const swing = Math.max(0, -gait * s) * u * 0.14 * spd;
        g.beginPath();
        g.ellipse(s * (bw + u * 0.04) + hugX, u * 0.16 - swing - (hugX ? u * 0.16 : 0),
          u * 0.125, u * 0.17, 0, 0, 6.2832);
        g.fill();
      }
    } else {
      drawPetTop(u, bw, bh, body);                   // the antenna became a species
    }

    rr(g, -bw, -bh, bw * 2, bh * 2, u * 0.52);
    g.fillStyle = body; g.fill();
    g.strokeStyle = rgba(face, 0.22); g.lineWidth = u * 0.07; g.stroke();

    if (w.belt) {                                    // a belt in the material's colour
      g.save();
      g.clip();
      g.fillStyle = rgba(pack.accent, 0.95);
      g.fillRect(-bw, u * 0.24, bw * 2, u * 0.17);
      g.restore();
    }

    if (w.belt && L.hat !== "none") drawHat(u, bw, bh, w.face, L);

    const ex = w.face * u * 0.1, open = w.blink < 0 ? 0.16 : 1;
    const eyes = w.belt ? L.eyes : "dots";
    g.fillStyle = face;
    g.strokeStyle = face;
    g.lineCap = "round";

    if (eyes === "happy" || eyes === "sleepy") {
      const up = eyes === "happy";
      g.lineWidth = u * 0.075;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.arc(ex + s * u * 0.26, -u * (up ? 0.15 : 0.27), u * 0.13,
          up ? Math.PI * 1.14 : Math.PI * 0.14, up ? Math.PI * 1.86 : Math.PI * 0.86);
        g.stroke();
      }
    } else {
      const big = eyes === "wide";
      const rx = u * (big ? 0.145 : 0.11), ry = u * (big ? 0.175 : 0.135) * open;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.ellipse(ex + s * u * (big ? 0.28 : 0.25), -u * 0.2, rx, ry, 0, 0, 6.2832);
        g.fill();
      }
      if (open === 1) {                              // catchlights
        g.fillStyle = dressed ? "#FFFFFF" : body;
        for (const s of [-1, 1]) {
          g.beginPath();
          g.arc(ex + s * u * (big ? 0.28 : 0.25) + u * 0.045, -u * 0.25, u * (big ? 0.045 : 0.035), 0, 6.2832);
          g.fill();
        }
      }
    }

    if (!w.belt) {                                   // the species, from the front
      if (pet === "cat") {
        g.fillStyle = "#E8849E";                     // inner ears, over the head
        for (const s of [-1, 1]) {
          g.beginPath();
          g.moveTo(s * bw * 0.48, -bh * 1.04);
          g.lineTo(s * bw * 0.78, -bh * 1.26);
          g.lineTo(s * bw * 0.76, -bh * 0.86);
          g.closePath(); g.fill();
        }
        g.beginPath();                               // nose
        g.moveTo(-u * 0.055, u * 0.04);
        g.lineTo(u * 0.055, u * 0.04);
        g.lineTo(0, u * 0.13);
        g.closePath(); g.fill();
        g.strokeStyle = rgba(face, 0.5);             // whiskers
        g.lineWidth = Math.max(1, u * 0.03);
        for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
          g.beginPath();
          g.moveTo(s * bw * 0.42, u * (0.02 + i * 0.07));
          g.lineTo(s * (bw + u * 0.26), u * (i * 0.11 - 0.06));
          g.stroke();
        }
      } else if (pet === "dog") {
        g.fillStyle = mix(body, "#FFFFFF", darkNow ? 0.18 : 0.4);   // muzzle
        g.beginPath(); g.ellipse(0, u * 0.16, u * 0.3, u * 0.2, 0, 0, 6.2832); g.fill();
        g.fillStyle = "#33261C";                     // nose
        g.beginPath(); g.ellipse(0, u * 0.05, u * 0.085, u * 0.06, 0, 0, 6.2832); g.fill();
        g.fillStyle = "#E8849E";                     // tongue
        rr(g, -u * 0.05, u * 0.24, u * 0.1, u * 0.12, u * 0.05);
        g.fill();
      } else {
        g.fillStyle = mix(body, "#FFFFFF", darkNow ? 0.2 : 0.42);   // belly
        g.beginPath(); g.ellipse(0, u * 0.42, bw * 0.5, u * 0.3, 0, 0, 6.2832); g.fill();
        g.fillStyle = face;                          // nostrils
        for (const s of [-1, 1]) {
          g.beginPath(); g.arc(s * u * 0.08, u * 0.02, u * 0.028, 0, 6.2832); g.fill();
        }
      }
    }

    g.restore();
  }

  // hats sit on the head, in the material's colour
  function drawHat(u, bw, bh, dir, L) {
    L = L || look;
    const A = pack.accent;
    g.fillStyle = A;
    g.strokeStyle = A;

    if (L.hat === "cap") {
      g.beginPath(); g.arc(0, -bh * 0.5, bw * 0.94, Math.PI, 0); g.fill();
      g.beginPath();
      g.ellipse((dir >= 0 ? 1 : -1) * bw * 0.72, -bh * 0.48, bw * 0.62, u * 0.1, 0, 0, 6.2832);
      g.fill();
    } else if (L.hat === "bow") {
      const bx = -bw * 0.5, by = -bh * 0.86;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(bx + s * u * 0.28, by - u * 0.17);
        g.lineTo(bx + s * u * 0.28, by + u * 0.17);
        g.closePath(); g.fill();
      }
      g.beginPath(); g.arc(bx, by, u * 0.085, 0, 6.2832); g.fill();
    } else if (L.hat === "crown") {
      const cy = -bh * 0.74, cw = bw * 0.72, ch = u * 0.46;   // points must clear the head
      g.beginPath();
      g.moveTo(-cw, cy);
      g.lineTo(-cw * 0.56, cy - ch);
      g.lineTo(-cw * 0.19, cy - ch * 0.34);
      g.lineTo(0, cy - ch * 1.18);
      g.lineTo(cw * 0.19, cy - ch * 0.34);
      g.lineTo(cw * 0.56, cy - ch);
      g.lineTo(cw, cy);
      g.closePath(); g.fill();
    } else if (L.hat === "phones") {
      g.lineWidth = u * 0.11;
      g.beginPath(); g.arc(0, -bh * 0.3, bw * 1.02, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      for (const s of [-1, 1]) {
        rr(g, s * bw * 1.02 - u * 0.12, -bh * 0.42, u * 0.24, u * 0.34, u * 0.1);
        g.fill();
      }
    }
  }

  /* ══ space ═══════════════════════════════════════════════
     The sheet floats in it. Stars live in a tile that repeats across the
     strip and drifts at a third of the camera's speed, which is what sells
     the distance — the ground slides past, the sky barely moves. Seeded, so
     they hold still instead of boiling from frame to frame. */

  const SKY_W = 1800;
  const stars = (() => {
    const rnd = mulberry32(0x5EED);
    const out = [];
    for (let i = 0; i < 190; i++) {
      const t = rnd();
      out.push({
        x: rnd() * SKY_W,
        y: rnd() * VH,
        r: (t < 0.82 ? 0.7 + rnd() * 1.1 : 1.6 + rnd() * 1.6),
        a: 0.3 + rnd() * 0.7,
        p: rnd() * 6.2832,
        c: t < 0.7 ? "#FFFFFF" : t < 0.85 ? "#BFD4FF" : t < 0.94 ? "#FFE2C0" : "#FFC7D8"
      });
    }
    return out;
  })();

  const NEBULAE = [
    { x: 0.16, y: 0.22, r: 0.62, c: "#5B3FA8" },
    { x: 0.68, y: 0.74, r: 0.55, c: "#1F6C8C" },
    { x: 1.32, y: 0.36, r: 0.5,  c: "#8C3A6B" }
  ];

  function drawSpace(now) {
    const x0 = cam.x - S, w = viewW + S * 2;
    g.fillStyle = "#07060F";
    g.fillRect(x0, 0, w, VH);

    const drift = cam.x * 0.32;                        // the sky lags the ground
    for (let base = x0 - ((drift % SKY_W) + SKY_W) % SKY_W - SKY_W;
         base < x0 + w; base += SKY_W) {

      for (const n of NEBULAE) {                       // clouds first, stars over them
        const nx = base + n.x * SKY_W, ny = n.y * VH, nr = n.r * VH;
        if (nx + nr < x0 || nx - nr > x0 + w) continue;
        const rg = g.createRadialGradient(nx, ny, 0, nx, ny, nr);
        rg.addColorStop(0, rgba(n.c, 0.3));
        rg.addColorStop(0.55, rgba(n.c, 0.1));
        rg.addColorStop(1, rgba(n.c, 0));
        g.fillStyle = rg;
        g.fillRect(nx - nr, ny - nr, nr * 2, nr * 2);
      }

      for (const st of stars) {
        const sx = base + st.x;
        if (sx < x0 || sx > x0 + w) continue;
        const tw = 0.62 + 0.38 * Math.sin(now / 900 + st.p);
        g.fillStyle = rgba(st.c, st.a * tw);
        g.beginPath();
        g.arc(sx, st.y, st.r, 0, 6.2832);
        g.fill();
        if (st.r > 1.6) {                              // the bright ones get a cross
          g.strokeStyle = rgba(st.c, st.a * tw * 0.5);
          g.lineWidth = 0.7;
          g.beginPath();
          g.moveTo(sx - st.r * 2.6, st.y); g.lineTo(sx + st.r * 2.6, st.y);
          g.moveTo(sx, st.y - st.r * 2.6); g.lineTo(sx, st.y + st.r * 2.6);
          g.stroke();
        }
      }
    }
  }

  /* ══ drawing the sky ═════════════════════════════════════ */

  function drawSky(now) {
    const x0 = cam.x - S, w = viewW + S * 2;
    const rain = sky.kind === "rain" || sky.kind === "thunder";

    // the light each sky leaves you standing in
    if (rain || sky.kind === "snow") {
      const tint = rain ? (darkNow ? "#0A0E18" : "#4E627E") : (darkNow ? "#0C1018" : "#B9CADC");
      g.fillStyle = rgba(tint, sky.kind === "thunder" ? 0.3 : rain ? 0.22 : 0.17);
      g.fillRect(x0, 0, w, VH);
    } else {
      const sun = g.createRadialGradient(x0 + w * 0.2, -VH * 0.25, 0, x0 + w * 0.2, -VH * 0.25, VH * 1.4);
      sun.addColorStop(0, rgba("#FFD49A", darkNow ? 0.05 : 0.11));
      sun.addColorStop(1, rgba("#FFD49A", 0));
      g.fillStyle = sun;
      g.fillRect(x0, 0, w, VH);
    }

    if (!reduced && drops.length) {
      if (rain) {
        // two passes: a wide soft streak with a bright thread down the middle,
        // because one thin line at this scale disappears into the bubbles
        g.lineCap = "round";
        g.beginPath();                          // every streak in one path
        for (const d of drops) {
          if (d.x < x0 || d.x > x0 + w) continue;
          g.moveTo(d.x, d.y);
          g.lineTo(d.x - d.vx * 0.6, d.y - d.len);
        }
        g.strokeStyle = rgba(darkNow ? "#BBD8F4" : "#2E5B8C", 0.34);
        g.lineWidth = Math.max(2, S * 0.075);
        g.stroke();
        g.strokeStyle = rgba(darkNow ? "#EAF4FF" : "#DCEBFA", 0.8);
        g.lineWidth = Math.max(1, S * 0.028);
        g.stroke();
      } else {
        g.fillStyle = rgba("#FFFFFF", darkNow ? 0.72 : 0.92);
        for (const d of drops) {
          if (d.x < x0 || d.x > x0 + w) continue;
          g.beginPath();
          g.arc(d.x, d.y, d.r, 0, 6.2832);
          g.fill();
        }
      }
    }

    if (sky.bolt) {                             // two strikes, close together
      const e = now - sky.bolt;
      if (e > 260) sky.bolt = 0;
      else if (e < 70 || (e > 130 && e < 190)) {
        g.fillStyle = rgba("#FFFFFF", darkNow ? 0.45 : 0.62);
        g.fillRect(x0, 0, w, VH);
      }
    }
  }

  // people, mid-fall: arms out, spinning, with the ground coming up at them
  function drawFallers() {
    if (!fallers.length) return;
    const skin = darkNow ? "#F2F1F8" : "#22222E";
    const face = darkNow ? "#22222E" : "#F2F1F8";
    for (const f of fallers) {
      if (f.x < cam.x - S * 2 || f.x > cam.x + viewW + S * 2) continue;
      const u = S * 0.55 * f.scale;

      const close = Math.max(0, Math.min(1, 1 - (f.gy - f.y) / (VH * 0.6)));
      g.fillStyle = rgba("#000000", (darkNow ? 0.34 : 0.17) * close);
      g.beginPath();
      g.ellipse(f.x, f.gy, u * (0.3 + close * 0.36), u * (0.08 + close * 0.09), 0, 0, 6.2832);
      g.fill();

      g.save();
      g.translate(f.x, f.y);
      g.rotate(f.spin);
      drawPetTop(u, u * 0.72, u * 0.8, skin);   // whatever falls matches whatever wanders
      for (const s of [-1, 1]) {                // arms and legs, thrown out
        g.beginPath();
        g.ellipse(s * u * 0.86, -u * 0.1 + Math.sin(f.spin * 2 + s) * u * 0.2,
          u * 0.13, u * 0.2, s * 0.5, 0, 6.2832);
        g.fill();
        g.beginPath();
        g.ellipse(s * u * 0.34, u * 0.95, u * 0.2, u * 0.13, 0, 0, 6.2832);
        g.fill();
      }
      rr(g, -u * 0.72, -u * 0.8, u * 1.44, u * 1.6, u * 0.5);
      g.fill();
      g.fillStyle = face;                       // wide eyes, understandably
      for (const s of [-1, 1]) {
        g.beginPath();
        g.ellipse(s * u * 0.26, -u * 0.18, u * 0.13, u * 0.16, 0, 0, 6.2832);
        g.fill();
      }
      g.restore();
    }
  }

  /* ══ bridges ═════════════════════════════════════════════ */

  // Wood palette shared by both passes
  const wood = () => ({
    deckTop: darkNow ? "#3B3125" : "#CBAE85",
    deckMid: darkNow ? "#2E261C" : "#B8975F",
    deckLow: darkNow ? "#221B14" : "#9A7C54",
    beam:    darkNow ? "#6C5B47" : "#7C6242",
    beamLit: darkNow ? "#8A7660" : "#A2825A",
    dark:    darkNow ? "#0B0908" : "#6B5334"
  });

  function eachBridge(fn) {
    const b = BAND(), y0 = VH / 2 - b, y1 = VH / 2 + b;
    const vx0 = cam.x - S, vx1 = cam.x + viewW + S;
    for (let i = 1; i < PACKS.length; i++) {
      const x0 = zoneEnd(i - 1), x1 = zoneStart(i);
      if (x1 < vx0 || x0 > vx1) continue;
      fn(i, x0, x1, y0, y1);
    }
  }

  // A railing: top beam, posts, a mid rail, and cross-bracing below the beam.
  // `dir` is -1 for the far side (bracing hangs down into the deck) and +1 for
  // the near side, so both read as standing on the deck.
  function railing(x0, x1, y, dir) {
    const W_ = wood();
    const post = S * 0.7 * dir;                  // far rail rises up, near rail drops toward you
    const step = S * 1.5;

    g.strokeStyle = rgba(W_.dark, 0.5);          // bracing
    g.lineWidth = Math.max(1, S * 0.028);
    for (let x = x0; x < x1 - step; x += step) {
      g.beginPath();
      g.moveTo(x, y); g.lineTo(Math.min(x + step, x1), y + post);
      g.moveTo(Math.min(x + step, x1), y); g.lineTo(x, y + post);
      g.stroke();
    }

    g.strokeStyle = rgba(W_.beam, 0.9);          // mid rail
    g.lineWidth = Math.max(1.5, S * 0.04);
    g.beginPath(); g.moveTo(x0, y + post * 0.52); g.lineTo(x1, y + post * 0.52); g.stroke();

    g.fillStyle = W_.beam;                       // posts
    const pw = Math.max(2, S * 0.075);
    for (let x = x0; x <= x1 + 1; x += step) {
      const px = Math.min(x, x1);
      g.fillRect(px - pw / 2, Math.min(y, y + post), pw, Math.abs(post));
    }

    g.strokeStyle = W_.beamLit;                  // top beam
    g.lineWidth = Math.max(2.5, S * 0.085);
    g.lineCap = "round";
    g.beginPath(); g.moveTo(x0, y + post); g.lineTo(x1, y + post); g.stroke();
    g.lineCap = "butt";

    g.strokeStyle = rgba(W_.dark, 0.85);         // deck edge
    g.lineWidth = Math.max(2, S * 0.06);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  }

  // Behind the critters: deck, planks, far railing, the barrier itself
  function drawBridgeBack() {
    eachBridge((i, x0, x1, y0, y1) => {
      const W_ = wood();

      const deck = g.createLinearGradient(0, y0, 0, y1);
      deck.addColorStop(0, W_.deckTop);
      deck.addColorStop(0.5, W_.deckMid);
      deck.addColorStop(1, W_.deckLow);
      g.fillStyle = deck;
      g.fillRect(x0, y0, x1 - x0, y1 - y0);

      g.strokeStyle = rgba(W_.dark, 0.4);                       // planks
      g.lineWidth = 1;
      for (let x = x0 + S * 0.3; x < x1; x += S * 0.52) {
        g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
      }

      const sh = g.createLinearGradient(0, y1, 0, y1 + S * 0.8);  // shadow into the void
      sh.addColorStop(0, rgba("#000000", darkNow ? 0.5 : 0.22));
      sh.addColorStop(1, rgba("#000000", 0));
      g.fillStyle = sh;
      g.fillRect(x0, y1, x1 - x0, S * 0.8);

      railing(x0, x1, y0, -1);                                  // far side

      if (!locked(i)) return;
      const gx = gateX(i), A = PACKS[i].accent;
      g.strokeStyle = rgba(A, 0.95);
      g.lineWidth = Math.max(3, S * 0.11);
      g.setLineDash([S * 0.2, S * 0.15]);
      g.beginPath(); g.moveTo(gx, y0 - S * 0.8); g.lineTo(gx, y1 + S * 0.8); g.stroke();
      g.setLineDash([]);
    });
  }

  // In front of the critters: near railing, then the gate sign on top of all
  function drawBridgeFront() {
    eachBridge((i, x0, x1, y0, y1) => {
      railing(x0, x1, y1, 1);

      if (!locked(i)) return;
      const gx = gateX(i), A = PACKS[i].accent;
      g.fillStyle = rgba(darkNow ? "#E8E6F0" : "#22222E", 0.92);
      for (const py of [y0 - S * 0.8, y1 + S * 0.8]) {
        g.beginPath(); g.arc(gx, py, S * 0.09, 0, 6.2832); g.fill();
      }

      const line1 = PACKS[i].name.toUpperCase();
      const line2 = "LV " + PACKS[i].unlock + " TO UNLOCK";
      const fs = Math.max(9, Math.round(S * 0.23));
      g.font = `600 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const wide = Math.max(g.measureText(line1).width, g.measureText(line2).width) + fs * 2.4;
      const ty = y0 - S * 2;
      rr(g, gx - wide / 2, ty - fs * 1.9, wide, fs * 3.8, fs * 1.9);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.92);
      g.fill();
      g.strokeStyle = rgba(A, 0.55);
      g.lineWidth = 1.5;
      g.stroke();
      g.fillStyle = rgba(A, 1);
      g.fillText(line1, gx, ty - fs * 0.62);
      g.fillStyle = rgba(darkNow ? "#ECECF4" : "#1A1A24", 0.8);
      g.fillText(line2, gx, ty + fs * 0.68);
    });
  }

  /* ══ draw ════════════════════════════════════════════════ */

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  let prevT = performance.now();

  function frame() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - prevT) / 1000);
    prevT = now;

    const hosting = isHost();
    // whoever inherits the room inherits the wanderers: pull them into the
    // zone you're actually standing in, or they'd stay where the last host left
    if (hosting !== net.wasHost) { net.wasHost = hosting; if (hosting) fitNpcs(); }

    if (walker.on) stepWalker(now, dt);
    if (hosting) { for (const n of npcs) stepNpc(n, now, dt); }
    else { for (const n of npcs) stepNpcRemote(n, now, dt); }
    stepPeers(now, dt);
    // a pair can come together a beat after the second face goes up — positions
    // land twelve times a second, so keep looking while the faces are still up
    if (emoLive(now)) pairUp();
    stepDuets(now, dt);
    if (walker.on) collide(now, hosting);
    stepSlap(now);
    stepWaves(now);
    stepDuel(now);
    stepSky(now, dt);
    netSend(false);
    if (hosting) netNpcs();

    // the camera trails the walker down the strip
    const focus = walker.on ? walker.x : cam.x + viewW / 2;
    const target = Math.min(Math.max(focus - viewW / 2, 0), Math.max(0, worldW - viewW));
    cam.x += (target - cam.x) * Math.min(1, dt * 7);

    g.clearRect(0, 0, W, H);
    g.save();
    g.scale(k, k);                            // world units from here down
    let ox = -cam.x, oy = 0;
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 4.5);
      const m = S * 0.17 * shake * shake;
      ox += (Math.random() - 0.5) * m;
      oy += (Math.random() - 0.5) * m;
    }
    g.translate(ox, oy);

    drawSpace(now);                           // everything else floats in it
    drawBridgeBack();

    const half = S * sprScale / 2;
    const vx0 = cam.x - S, vx1 = cam.x + viewW + S;

    for (const c of cells) {
      // The whole sheet keeps its clock, on screen or not. A cell somebody
      // popped three zones away has to be as far along when you walk up to it
      // as it is on their screen — if it only started counting once you looked,
      // the two of you would be standing in different worlds.
      let e = now - c.t;
      if (c.st === 1 && e > POP_MS) { c.st = 2; c.t = now; e = 0; }
      else if (c.st === 2 && e > c.wait) { c.st = 3; c.t = now; e = 0; }
      else if (c.st === 3 && e > INFLATE_MS) { c.st = 0; c.t = now; e = 0; }

      if (c.x < vx0 || c.x > vx1) continue;   // clocked everywhere, drawn only in shot

      if (c.st !== 0) g.drawImage(sockets[c.z], c.x - half, c.y - half, S * sprScale, S * sprScale);

      let sc = 1, al = 1;
      if (c.st === 1) {
        const p = Math.min(1, e / POP_MS);
        sc = 1 + easeOut(p) * (PACKS[c.z].shape === "cap" ? -0.22 : 0.42);
        al = 1 - p * p;
      } else if (c.st === 2) {
        continue;
      } else if (c.st === 3) {
        const p = Math.min(1, e / INFLATE_MS);
        const el = reduced ? p : 1 - Math.pow(2, -9 * p) * Math.cos(p * 11);
        sc = 0.24 + el * 0.76;
        al = Math.min(1, p * 3);
      }

      const d = S * sprScale * sc;
      g.globalAlpha = al;
      g.drawImage(sprites[c.z], c.x - d / 2, c.y - d / 2, d, d);
      g.globalAlpha = 1;
    }

    // the dent a stomp leaves, fading out of the ground
    for (let i = dents.length - 1; i >= 0; i--) {
      const q = dents[i], p = (now - q.t) / q.life;
      if (p >= 1) { dents.splice(i, 1); continue; }
      const rad = S * (0.45 + p * 0.5);
      const dg = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, rad);
      dg.addColorStop(0, rgba("#000000", (1 - p) * (darkNow ? 0.34 : 0.16)));
      dg.addColorStop(1, rgba("#000000", 0));
      g.fillStyle = dg;
      g.fillRect(q.x - rad, q.y - rad, rad * 2, rad * 2);
    }

    // everything past the barrier fades out — visible enough to want, dim
    // enough to read as not yours yet
    for (let i = 1; i < PACKS.length; i++) {
      if (!locked(i)) continue;
      const x0 = gateX(i);
      if (x0 > vx1) break;
      const gc = darkNow ? "#0C0C11" : "#E2E1E9";
      const fade = bridgeW * 1.1;
      const vg = g.createLinearGradient(x0, 0, x0 + fade, 0);
      vg.addColorStop(0, rgba(gc, 0));
      vg.addColorStop(1, rgba(gc, 0.7));
      g.fillStyle = vg;
      g.fillRect(x0, 0, fade, VH);
      g.fillStyle = rgba(gc, 0.7);
      g.fillRect(x0 + fade, 0, Math.max(0, worldW - x0 - fade), VH);
      break;
    }

    for (const n of npcs) if (n.placed) drawCritter(n);
    for (const [, p] of net.peers) drawCritter(p);
    if (walker.on) drawCritter(walker);
    drawCages(now);                           // bars go in front of whoever is behind them
    drawPeerTags();
    drawEmotes(now);
    drawDuel(now);
    drawBridgeFront();

    // rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i], p = (now - r.t) / r.life;
      if (p >= 1) { rings.splice(i, 1); continue; }
      if (p < 0) continue;                                  // staggered blast ring, not due yet
      // a wave ring is already out at the front of the shock and only widens
      // a little; the rest grow from nothing
      const rad = r.wave ? r.wave + easeOut(p) * S * 1.1
        : S * (r.big ? 0.3 + easeOut(p) * 2.5
          : r.stomp ? 0.28 + easeOut(p) * 1.45
          : 0.34 + easeOut(p) * 0.8);
      g.beginPath();
      g.arc(r.x, r.y, rad, 0, 6.2832);
      g.strokeStyle = rgba(r.c || PACKS[nearestZone(r.x)].accent,
        (1 - p) * (r.wave ? 0.55 : r.big ? 0.8 : r.stomp ? 0.9 : 0.5));
      g.lineWidth = (r.wave ? 6 : r.big ? 4 : r.stomp ? 5 : 2) * (1 - p) + 0.4;
      g.stroke();
    }

    if (flash) {
      const p = (now - flash.t) / 300;
      if (p >= 1) flash = null;
      else {
        const rad = S * 2.8, fc = flash.c || pack.accent;
        const fg = g.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, rad);
        fg.addColorStop(0, rgba(fc, (1 - p) * 0.42));
        fg.addColorStop(1, rgba(fc, 0));
        g.fillStyle = fg;
        g.fillRect(flash.x - rad, flash.y - rad, rad * 2, rad * 2);
      }
    }

    // shards
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i], p = (now - q.t) / q.life;
      if (p >= 1) { parts.splice(i, 1); continue; }
      if (p < 0) continue;                               // smoke that isn't due yet
      q.x += q.vx; q.y += q.vy;
      q.vy += q.heart ? -0.012 : q.smoke ? -0.005 : q.soft ? 0.02 : q.spark ? 0.14 : q.chunk ? 0.1 : 0.08;
      const drag = q.soft || q.smoke ? 0.94 : 0.985;
      q.vx *= drag;
      q.vy *= drag;
      if (q.spark) {                                     // a streak, not a dot
        g.strokeStyle = rgba(q.c, (1 - p) * 0.9);
        g.lineWidth = Math.max(1, q.r * (1 - p * 0.4));
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(q.x - q.vx * 2.6, q.y - q.vy * 2.6);
        g.lineTo(q.x, q.y);
        g.stroke();
        continue;
      }
      if (q.chunk) {                                     // debris tumbles
        q.rot += q.vr;
        g.save();
        g.translate(q.x, q.y);
        g.rotate(q.rot);
        g.fillStyle = rgba(q.c, (1 - p) * 0.85);
        g.fillRect(-q.r, -q.r * 0.7, q.r * 2, q.r * 1.4);
        g.restore();
        continue;
      }
      const rad = q.r * (q.smoke ? 1 + p * 1.8 : q.soft ? 1 + p * 0.9 : 1 - p * 0.6);
      g.fillStyle = rgba(q.c, (1 - p) * (q.heart ? 0.9 : q.smoke ? 0.24 : q.soft ? 0.3 : 0.72));
      if (q.heart) {
        const s = rad * 1.5;
        g.beginPath();
        g.moveTo(q.x, q.y + s * 0.9);
        g.bezierCurveTo(q.x - s * 1.6, q.y - s * 0.35, q.x - s * 0.5, q.y - s * 1.25, q.x, q.y - s * 0.35);
        g.bezierCurveTo(q.x + s * 0.5, q.y - s * 1.25, q.x + s * 1.6, q.y - s * 0.35, q.x, q.y + s * 0.9);
        g.fill();
      } else {
        g.beginPath();
        g.arc(q.x, q.y, rad, 0, 6.2832);
        g.fill();
      }
    }

    drawSky(now);                             // weather sits in front of the world
    drawFallers();

    // last, so it covers everything: you don't see the shockwave through a hand
    drawSlap(now);

    g.restore();
    requestAnimationFrame(frame);
  }

  /* ══ input ═══════════════════════════════════════════════ */

  /* The stick drives, and anywhere else on the sheet is a blade: drag across
     the bubbles and they burst under your finger. Two jobs, two places, so
     neither has to guess what the other meant. */

  let hinted = false;
  const down = new Set();

  cvs.addEventListener("pointerdown", e => {
    audio();
    if (ac.state === "suspended") ac.resume();
    down.add(e.pointerId);
    // pop first: capture is a nicety and it can throw if the finger is already
    // gone, and losing the tap you actually made is the worse failure
    hit(e.clientX, e.clientY);
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });

  cvs.addEventListener("pointermove", e => {
    if (!down.has(e.pointerId)) return;
    // every point the finger passed through, not just where it ended up — a
    // fast swipe should leave a clean cut, not a dotted line. The list comes
    // back empty for events that didn't come from a real finger, so fall back
    // to the event itself rather than cutting nothing.
    let pts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (!pts || !pts.length) pts = [e];
    for (const p of pts) hit(p.clientX, p.clientY);
  });

  const release = e => { down.delete(e.pointerId); };
  cvs.addEventListener("pointerup", release);
  cvs.addEventListener("pointercancel", release);
  cvs.addEventListener("contextmenu", e => e.preventDefault());

  /* joystick */
  const stickEl = document.getElementById("stick");
  const knobEl = document.getElementById("knob");

  function aim(e) {
    const b = stickEl.getBoundingClientRect();
    const reach = b.width / 2 - 22;
    let dx = (e.clientX - (b.left + b.width / 2)) / reach;
    let dy = (e.clientY - (b.top + b.height / 2)) / reach;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    if (m < 0.14) { dx = dy = 0; }                     // dead zone
    stick.dx = dx; stick.dy = dy;
    knobEl.style.transform = `translate(${dx * reach}px, ${dy * reach}px)`;
  }

  stickEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    audio();
    stick.id = e.pointerId;
    try { stickEl.setPointerCapture(e.pointerId); } catch (err) {}
    stickEl.classList.add("gripped");
    aim(e);
  });
  stickEl.addEventListener("pointermove", e => { if (stick.id === e.pointerId) aim(e); });
  const drop = e => {
    if (stick.id !== e.pointerId) return;
    stick.id = null; stick.dx = stick.dy = 0;
    stickEl.classList.remove("gripped");
    knobEl.style.transform = "translate(0px, 0px)";
  };
  stickEl.addEventListener("pointerup", drop);
  stickEl.addEventListener("pointercancel", drop);

  /* keys: arrows and WASD steer, everything else pops —
     which is the whole joke of the switch packs */
  const STEER = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };
  const held = new Set();

  function steer() {
    let x = 0, y = 0;
    for (const k of held) { x += STEER[k][0]; y += STEER[k][1]; }
    const m = Math.hypot(x, y);
    keyVec.x = m ? x / m : 0;
    keyVec.y = m ? y / m : 0;
  }

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.key === "Tab") return;
    if (e.target.closest && e.target.closest("#vol, #panel, #controls, #emo, #slap")) return;
    // Shift must return before the pop-a-random-cell fallback below, or simply
    // holding it to run would machine-gun the sheet
    if (e.key === "Shift") { running = true; return; }
    const k = e.key.toLowerCase();
    if (walker.on && STEER[k]) {
      e.preventDefault();
      if (!held.has(k)) { held.add(k); steer(); }
      audio();
      return;
    }
    if (k === "f") { audio(); fireSlap(); return; }
    if (e.key === " ") e.preventDefault();
    audio();
    const live = cells.filter(c => c.st === 0);
    if (!live.length) return;
    const c = live[(Math.random() * live.length) | 0];
    popCell(c, performance.now());
    netEvent({ t: "p", i: c.idx });
  });

  addEventListener("keyup", e => {
    if (e.key === "Shift") { running = false; return; }
    const k = e.key.toLowerCase();
    if (held.delete(k)) steer();
  });
  addEventListener("blur", () => { held.clear(); steer(); running = false; });

  /* ══ chrome ══════════════════════════════════════════════ */

  const mapEl = document.getElementById("map");
  const tagEl = document.getElementById("tag");
  const nameEl = document.getElementById("packname");

  // You change material by walking into it, so the tray is a map now: it
  // shows where you are, what's open, and what the next one costs.
  function paintMap() {
    mapEl.textContent = "";
    for (let i = 0; i < PACKS.length; i++) {
      if (i) {
        const l = document.createElement("s");
        l.className = "link" + (locked(i) ? "" : " open");
        l.style.setProperty("--c", PACKS[i].accent);
        mapEl.appendChild(l);
      }
      // unlocked zones are buttons you can travel to; locked ones are inert
      const shut = locked(i);
      const n = document.createElement(shut ? "i" : "button");
      n.className = "node" + (shut ? "" : " open") + (i === zone ? " here" : "");
      n.style.setProperty("--c", PACKS[i].accent);
      n.textContent = shut ? String(PACKS[i].unlock) : "";
      n.title = shut ? PACKS[i].name + " — LV " + PACKS[i].unlock : "Travel to " + PACKS[i].name;
      if (!shut) {
        n.type = "button";
        n.setAttribute("aria-label", "Travel to " + PACKS[i].name);
        n.addEventListener("click", () => { audio(); teleport(i); });
      }
      mapEl.appendChild(n);
    }
  }

  // step through the map instead of walking it
  function teleport(i) {
    const w = walker;
    if (w.duet) endDuet(w.duet);
    w.x = zoneStart(i) + zoneW / 2;
    w.y = VH / 2;
    w.vx = w.vy = w.kx = w.ky = 0;
    w.hop = w.hopV = 0;
    cam.x = Math.min(Math.max(w.x - viewW / 2, 0), Math.max(0, worldW - viewW));   // snap, don't scroll the world
    enterZone(i);
    rings.push({ x: w.x, y: w.y, t: performance.now(), life: 520, big: true });
  }

  function enterZone(z) {
    zone = z;
    pack = PACKS[z];
    store.set("pack", pack.id);
    document.documentElement.style.setProperty("--accent", pack.accent);
    nameEl.textContent = pack.name.toLowerCase();
    const label = pack.name + " · " + pack.tag;
    if (tagEl.textContent === label) {                 // same zone: no pointless flicker
      tagEl.style.opacity = "1";
    } else {
      tagEl.style.opacity = "0";
      setTimeout(() => { tagEl.textContent = label; tagEl.style.opacity = "1"; }, 180);
    }
    droneTune();                             // the pad follows the material
    fitNpcs();
    paintMap();
  }

  /* ── setup panel ────────────────────────────────────── */

  const slapEl = document.getElementById("slap");

  function paintSlap() {
    const p = slapCharge / SLAP_AT;
    slapEl.style.setProperty("--p", p.toFixed(3));
    slapEl.classList.toggle("ready", slapCharge >= SLAP_AT);
    slapEl.setAttribute("aria-disabled", String(slapCharge < SLAP_AT));
    slapEl.title = slapCharge >= SLAP_AT
      ? "Slap the whole screen (F)"
      : "Slap charges at " + SLAP_AT + " pops — " + slapCharge + "/" + SLAP_AT;
  }
  slapEl.addEventListener("click", () => { audio(); fireSlap(); });
  slapEl.addEventListener("pointerdown", e => e.stopPropagation());
  paintSlap();

  const walkEl = document.getElementById("walk");
  const gearEl = document.getElementById("gear");
  const panelEl = document.getElementById("panel");
  const musicEl = document.getElementById("music");

  function setWalker(on) {
    walker.on = on;
    store.set("walk", on ? "1" : "0");
    walkEl.setAttribute("aria-pressed", String(on));
    walkEl.textContent = on ? "On" : "Off";
    stickEl.hidden = !on;                    // nothing to steer, nothing to steer it with
    if (!on) { held.clear(); steer(); stick.dx = stick.dy = 0; }
  }
  walkEl.addEventListener("click", () => { audio(); setWalker(!walker.on); });
  setWalker(walker.on);

  function openPanel(on) {
    panelEl.hidden = !on;
    gearEl.setAttribute("aria-expanded", String(on));
  }
  gearEl.addEventListener("click", () => { audio(); openPanel(panelEl.hidden); });
  gearEl.addEventListener("pointerdown", e => e.stopPropagation());
  panelEl.addEventListener("pointerdown", e => e.stopPropagation());
  addEventListener("pointerdown", () => { if (!panelEl.hidden) openPanel(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !panelEl.hidden) openPanel(false); });

  /* ── emotes ─────────────────────────────────────────── */

  const emoEl = document.getElementById("emo");
  for (const e of EMO) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = e;
    b.setAttribute("aria-label", "Say " + e);
    b.addEventListener("click", () => { audio(); emote(e); });
    b.addEventListener("pointerdown", ev => ev.stopPropagation());
    emoEl.appendChild(b);
  }

  function setMusic(on) {
    musicOn = on;
    store.set("music", on ? "1" : "0");
    musicEl.setAttribute("aria-pressed", String(on));
    musicEl.textContent = on ? "On" : "Off";
    if (on) musicStart(); else musicStop();
  }
  musicEl.addEventListener("click", () => setMusic(!musicOn));
  musicEl.setAttribute("aria-pressed", String(musicOn));
  musicEl.textContent = musicOn ? "On" : "Off";
  // the browser needs a gesture before it will make a sound, so a remembered
  // "on" waits for the first touch rather than failing silently
  if (musicOn) addEventListener("pointerdown", () => { if (musicOn && !mus) musicStart(); }, { once: true });

  function optionRow(host, items, current, onPick, swatch) {
    host.textContent = "";
    for (const it of items) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = swatch ? "opt sw" : "opt";
      b.dataset.v = it.v;
      if (swatch) {
        b.style.background = it.c || "linear-gradient(135deg, #F2F1F8 50%, #22222E 50%)";
        b.setAttribute("aria-label", it.t);
        b.title = it.t;
      } else {
        b.textContent = it.t;
      }
      b.setAttribute("aria-pressed", String(it.v === current()));
      b.addEventListener("click", () => {
        audio();
        onPick(it.v);
        for (const s of host.children) s.setAttribute("aria-pressed", String(s.dataset.v === current()));
      });
      host.appendChild(b);
    }
  }

  optionRow(document.getElementById("petOpts"),
    [{ v: "cat", t: "Cat" }, { v: "dog", t: "Dog" }, { v: "dino", t: "Dino" }],
    () => pet,
    v => {
      pet = v;
      store.set("pet", v);
      cry(W / 2);                              // let it introduce itself
    });

  optionRow(document.getElementById("styleOpts"),
    [{ v: "fat", t: "Fat" }, { v: "crisp", t: "Crisp" }, { v: "crunch", t: "Crunch" }],
    () => popStyle,
    v => {                                   // audition it without leaving the current material
      popStyle = v;
      store.set("popstyle", v);
      if (!ac) return;
      try { out = master; WRAP[v](ac.currentTime + 0.02, 1); } catch (e) {}
      out = master;
    });

  optionRow(document.getElementById("bodyOpts"),
    Object.keys(BODIES).map(k => ({ v: k, c: BODIES[k], t: k === "auto" ? "Default" : k })),
    () => look.body,
    v => { look.body = v; store.set("body", v); }, true);

  optionRow(document.getElementById("hatOpts"),
    [{ v: "none", t: "None" }, { v: "cap", t: "Cap" }, { v: "bow", t: "Bow" },
     { v: "crown", t: "Crown" }, { v: "phones", t: "Phones" }],
    () => look.hat,
    v => { look.hat = v; store.set("hat", v); });

  optionRow(document.getElementById("eyeOpts"),
    [{ v: "dots", t: "Dots" }, { v: "happy", t: "Happy" },
     { v: "sleepy", t: "Sleepy" }, { v: "wide", t: "Wide" }],
    () => look.eyes,
    v => { look.eyes = v; store.set("eyes", v); });

  const volEl = document.getElementById("volume");
  volEl.value = String(Math.round(vol * 100));
  volEl.addEventListener("input", () => {
    vol = volEl.value / 100;
    store.set("vol", vol);
    if (master) master.gain.setTargetAtTime(vol, ac.currentTime, 0.01);
  });

  // the world is in space now, so the interface lives at night too
  document.documentElement.setAttribute("data-theme", "dark");

  addEventListener("resize", () => layout());
  addEventListener("beforeunload", () => { store.set("pops", pops); store.set("exp", exp); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", buildSprites);
  new MutationObserver(buildSprites).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ── join ───────────────────────────────────────────── */

  const joinEl = document.getElementById("join");
  const whoEl = document.getElementById("who");
  const noteEl = document.getElementById("joinnote");

  whoEl.value = store.get("name", "");
  if (!RELAY) noteEl.textContent = "No relay configured — you'll play on your own.";

  document.getElementById("joinform").addEventListener("submit", e => {
    e.preventDefault();
    const name = whoEl.value.trim().slice(0, 14) || "anon";
    store.set("name", name);
    audio();                                 // the tap that buys us sound
    joinEl.classList.add("gone");
    setTimeout(() => { joinEl.hidden = true; }, 360);
    netConnect(name);
  });

  addEventListener("beforeunload", () => { try { net.ws && net.ws.close(); } catch (e) {} });

  countEl.textContent = fmt(pops);
  paintXp();
  paintOnline();
  tagEl.textContent = PACKS[0].name + " · " + PACKS[0].tag;
  layout();                                  // builds the world and dresses the UI for wherever you are
  requestAnimationFrame(frame);
})();
</script>
