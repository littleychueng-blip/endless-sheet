<title>Endless Sheet</title>

<style>
  :root {
    --ground:      #EDECF1;
    --ground-2:    #E2E1E9;
    --surface:     rgba(255,255,255,0.72);
    --surface-2:   rgba(255,255,255,0.92);
    --hairline:    rgba(24,22,38,0.13);
    --ink:         #1A1A24;
    --muted:       #6C6B7C;
    --accent:      #57C9A8;
    --shadow:      0 1px 2px rgba(24,22,38,.10), 0 8px 24px rgba(24,22,38,.09);
    --dark: 0;
    --halo: rgba(255,255,255,.62);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:    #131319;
      --ground-2:  #0C0C11;
      --surface:   rgba(30,30,40,0.62);
      --surface-2: rgba(36,36,48,0.90);
      --hairline:  rgba(255,255,255,0.10);
      --ink:       #ECECF4;
      --muted:     #8B8A9E;
      --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
      --dark: 1;
    --halo: rgba(0,0,0,.55);
    }
  }

  :root[data-theme="dark"] {
    --ground:    #131319;
    --ground-2:  #0C0C11;
    --surface:   rgba(30,30,40,0.62);
    --surface-2: rgba(36,36,48,0.90);
    --hairline:  rgba(255,255,255,0.10);
    --ink:       #ECECF4;
    --muted:     #8B8A9E;
    --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
    --dark: 1;
    --halo: rgba(0,0,0,.55);
  }

  :root[data-theme="light"] {
    --ground:    #EDECF1;
    --ground-2:  #E2E1E9;
    --surface:   rgba(255,255,255,0.72);
    --surface-2: rgba(255,255,255,0.92);
    --hairline:  rgba(24,22,38,0.13);
    --ink:       #1A1A24;
    --muted:     #6C6B7C;
    --shadow:    0 1px 2px rgba(24,22,38,.10), 0 8px 24px rgba(24,22,38,.09);
    --dark: 0;
    --halo: rgba(255,255,255,.62);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  /* accent-tinted ground — retints when the material changes */
  /* deep space, behind everything — the canvas paints its own stars on top */
  #wash {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(100% 70% at 20% 0%, #1B1740, transparent 60%),
      radial-gradient(90% 70% at 85% 100%, #0D2A3A, transparent 62%),
      linear-gradient(#07060F, #05040A);
    z-index: 0;
  }

  #sheet {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* ── instrument readout ───────────────────────────────── */
  .mono {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  /* keeps the readout and tray legible over a full-bleed sheet */
  #scrim {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(44% 30% at -3% -5%, color-mix(in oklab, var(--ground) 92%, transparent), transparent 76%),
      linear-gradient(to top, color-mix(in oklab, var(--ground) 62%, transparent), transparent 14%);
  }

  #hud {
    text-shadow: 0 1px 3px var(--halo), 0 0 10px var(--halo);
    position: fixed;
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    left: 22px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: none;
  }

  #mark {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #count {
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Varela Round", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 9vw, 60px);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -.03em;
    color: var(--ink);
    transition: transform 90ms cubic-bezier(.2,1.6,.4,1);
  }
  #count.tick { transform: scale(1.045); }

  #sub {
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #sub b { color: var(--accent); font-weight: 600; transition: color 500ms ease; }

  #lvl { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
  #lvlN {
    font-size: 10px; letter-spacing: .14em; font-weight: 600;
    color: var(--accent);
    transition: color 500ms ease, transform 240ms cubic-bezier(.2,1.7,.4,1);
  }
  #lvlN.up { transform: scale(1.4); }
  #bar {
    width: 82px; height: 3px; border-radius: 2px; overflow: hidden;
    background: color-mix(in oklab, var(--ink) 16%, transparent);
  }
  #bar i {
    display: block; height: 100%; width: 0%;
    background: var(--accent);
    transition: width 340ms ease, background 500ms ease;
  }
  #xp { font-size: 9px; letter-spacing: .1em; color: var(--muted); }

  /* ── volume ───────────────────────────────────────────── */
  #controls {
    position: fixed;
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    right: 22px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #vol {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  #gear {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px 9px 11px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--muted);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
  }
  #gear svg { width: 14px; height: 14px; fill: currentColor; }
  #gear:hover { color: var(--ink); }
  #gear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #gear[aria-expanded="true"] {
    color: var(--ink);
    border-color: color-mix(in oklab, var(--accent) 55%, transparent);
    background: color-mix(in oklab, var(--accent) 14%, var(--surface-2));
  }

  /* ── setup panel ──────────────────────────────────────── */
  #panel {
    position: fixed;
    top: calc(max(24px, env(safe-area-inset-top) + 12px) + 48px);
    right: 22px;
    z-index: 4;
    width: 272px;
    max-height: min(72vh, 580px);
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    border: 1px solid var(--hairline);
    border-radius: 18px;
    background: var(--surface-2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
  }
  #panel[hidden] { display: none; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .lbl { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }

  .opt {
    padding: 6px 9px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .opt:hover { color: var(--ink); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt[aria-pressed="true"] {
    color: var(--ink);
    border-color: color-mix(in oklab, var(--accent) 60%, transparent);
    background: color-mix(in oklab, var(--accent) 16%, transparent);
  }

  .sw {
    width: 25px; height: 25px; padding: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px var(--hairline);
  }
  .sw[aria-pressed="true"] { border-color: var(--accent); }
  .tog { min-width: 54px; text-align: center; }

  .step {
    display: flex; align-items: center; gap: 1px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 2px;
  }
  .step button {
    width: 24px; height: 24px; padding: 0;
    border: 0; border-radius: 50%;
    background: none;
    color: var(--muted);
    font-size: 15px; line-height: 1;
    cursor: pointer;
  }
  .step button:hover:not(:disabled) { color: var(--ink); background: color-mix(in oklab, var(--accent) 18%, transparent); }
  .step button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .step button:disabled { opacity: .3; cursor: not-allowed; }
  .step output {
    min-width: 22px; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .sep { height: 1px; margin: 1px 0; border: 0; background: var(--hairline); }

  /* ── who's here ───────────────────────────────────────── */
  #online {
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #online .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
  }
  #online.live .dot { background: #4ED07E; }
  #online.live b { color: var(--ink); font-weight: 600; }
  #online.bad .dot { background: #E0704F; }

  /* ── join screen ──────────────────────────────────────── */
  #join {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: grid;
    place-items: center;
    padding: 24px;
    background: color-mix(in oklab, var(--ground) 88%, transparent);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transition: opacity 340ms ease;
  }
  #join.gone { opacity: 0; pointer-events: none; }
  #join[hidden] { display: none; }

  #joinform {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(320px, 100%);
    padding: 26px 24px;
    border: 1px solid var(--hairline);
    border-radius: 20px;
    background: var(--surface-2);
    box-shadow: var(--shadow);
  }
  #joinform h1 {
    margin: 0 0 2px;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--ink);
  }
  #joinform label {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #who {
    padding: 11px 14px;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    background: var(--surface);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-size: 16px;              /* 16px stops iOS zooming the page on focus */
  }
  #who:focus { outline: 2px solid color-mix(in oklab, var(--accent) 60%, transparent); outline-offset: 1px; }
  #go {
    padding: 12px 16px;
    border: 1px solid color-mix(in oklab, var(--accent) 55%, transparent);
    border-radius: 12px;
    background: color-mix(in oklab, var(--accent) 24%, var(--surface-2));
    color: var(--ink);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #go:hover { background: color-mix(in oklab, var(--accent) 34%, var(--surface-2)); }
  #joinnote { margin: 0; font-size: 10px; line-height: 1.5; color: var(--muted); }

  /* ── level-up toast ───────────────────────────────────── */
  #toast {
    position: fixed;
    left: 50%; top: 21%;
    transform: translate(-50%, -4px);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--accent) 55%, transparent);
    background: color-mix(in oklab, var(--accent) 24%, var(--surface-2));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    transition: opacity 280ms ease, transform 280ms cubic-bezier(.2,1.5,.4,1);
  }
  #toast.show { opacity: 1; transform: translate(-50%, -16px); }

  /* ── the stick ────────────────────────────────────────── */
  #stick {
    position: fixed;
    left: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 108px);
    z-index: 3;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: grid;
    place-items: center;
    touch-action: none;
    cursor: grab;
    transition: border-color 180ms ease;
  }
  #stick[hidden] { display: none; }
  #stick.gripped { cursor: grabbing; border-color: color-mix(in oklab, var(--accent) 50%, transparent); }
  #stick::after {
    content: "";
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    border: 1px dashed color-mix(in oklab, var(--ink) 14%, transparent);
  }

  #knob {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: color-mix(in oklab, var(--accent) 82%, var(--surface-2));
    border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
    box-shadow: var(--shadow);
    transition: transform 200ms cubic-bezier(.2,1.5,.4,1), background 500ms ease;
    will-change: transform;
  }
  #stick.gripped #knob { transition: background 500ms ease; }

  /* The haptic switch has to stay rendered to keep ticking — display:none or
     visibility:hidden and Safari stops making it buzz. So it's parked in a
     1px corner instead, out of the way of everything including the pointer. */
  #hap {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  /* ── emote rail ───────────────────────────────────────── */
  #emo {
    position: fixed;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 196px);
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #emo button {
    width: 46px;
    height: 46px;
    padding: 0;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 160ms cubic-bezier(.2,1.5,.4,1), border-color 180ms ease;
  }
  #emo button:hover { border-color: color-mix(in oklab, var(--accent) 50%, transparent); }
  #emo button:active { transform: scale(.88); }
  #emo button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ── the slap ─────────────────────────────────────────── */
  #slap {
    position: fixed;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom) + 108px);
    z-index: 3;
    width: 72px;
    height: 72px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: not-allowed;
    /* the ring is the charge meter: --p runs 0 to 1 */
    background:
      conic-gradient(var(--accent) calc(var(--p, 0) * 360deg), transparent 0),
      var(--surface);
    box-shadow: inset 0 0 0 3px var(--surface-2), var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform 200ms cubic-bezier(.2,1.5,.4,1), filter 250ms ease;
    filter: saturate(.25);
  }
  #slap svg { width: 30px; height: 30px; fill: var(--muted); transition: fill 250ms ease; }
  #slap[hidden] { display: none; }
  #slap.ready {
    cursor: pointer;
    filter: none;
    animation: pulse 1.8s ease-in-out infinite;
  }
  #slap.ready svg { fill: var(--ink); }
  #slap.ready:hover { transform: scale(1.06); }
  #slap.ready:active { transform: scale(.94); }
  #slap:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @keyframes pulse {
    0%, 100% { box-shadow: inset 0 0 0 3px var(--surface-2), var(--shadow); }
    50%      { box-shadow: inset 0 0 0 3px var(--surface-2), 0 0 0 7px color-mix(in oklab, var(--accent) 22%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) {
    #slap.ready { animation: none; }
  }

  #vol label {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #vol input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 84px;
    height: 3px;
    border-radius: 2px;
    background: var(--hairline);
    outline: none;
  }
  #vol input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    transition: background 500ms ease;
  }
  #vol input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  #vol input[type="range"]:focus-visible { box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 45%, transparent); }

  /* ── world map ────────────────────────────────────────── */
  #tray-wrap {
    position: fixed;
    left: 0; right: 0;
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }

  #tag {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    padding: 5px 14px;
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity 220ms ease;
  }

  /* 口—口—口—口—口—口 : the strip you walk, and how far you've earned */
  #map {
    display: flex;
    align-items: center;
    padding: 8px 20px;
    max-width: 100vw;
  }
  #map .node {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    display: grid; place-items: center;
    font-size: 8px; font-style: normal; line-height: 1;
    color: var(--muted);
    transition: background 300ms ease, border-color 300ms ease, transform 300ms cubic-bezier(.2,1.5,.4,1);
  }
  #map button.node {
    padding: 0;
    font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  #map button.node:hover { border-color: var(--c); }
  #map button.node:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
  #map .node.open { border-color: color-mix(in oklab, var(--c) 65%, transparent); color: transparent; }
  #map .node.here {
    border-color: var(--c);
    background: color-mix(in oklab, var(--c) 62%, transparent);
    transform: scale(1.22);
  }
  #map .link { width: 15px; height: 2px; background: var(--hairline); }
  #map .link.open { background: color-mix(in oklab, var(--c) 55%, transparent); }

  /* ── first-run hint ───────────────────────────────────── */
  #hint {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    pointer-events: none;
    transition: opacity 600ms ease;
  }
  #hint span {
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    font-size: clamp(14px, 3.2vw, 19px);
    font-weight: 500;
    letter-spacing: .01em;
    text-align: center;
    text-wrap: balance;
    max-width: calc(100vw - 48px);
    color: var(--muted);
    padding: 12px 22px;
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.025); }
  }
  #hint.gone { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    #hint span { animation: none; }
    #count, #map .node, #wash { transition: none; }
  }

  @media (max-width: 560px) {
    #hud { left: 16px; }
    #controls { right: 14px; gap: 6px; }
    #vol { padding: 8px 12px; }
    #vol input[type="range"] { width: 58px; }
    #vol label { display: none; }
    #gear { padding: 9px 11px; font-size: 0; letter-spacing: 0; gap: 0; }

<script>
(() => {
  "use strict";

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ══ audio ═══════════════════════════════════════════════
     Every sound is synthesised — no samples, nothing to load. */

  let ac = null, master = null, noiseBuf = null, lastVoice = 0, out = null;
  const pans = [];

  function audio() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = vol;
    out = master;
    /* Light hand on the master. The old settings (-14dB, 8:1, 2ms) were a
       limiter in all but name: it clamped down on every transient, and a pop
       is *all* transient, so everything came out flattened and processed
       rather than snapped. Now it only catches the loudest moments, and it
       takes long enough to grab that the attack of each pop passes through
       untouched — which is the part that sounds real. */
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -9;
    comp.ratio.value = 3;
    comp.knee.value = 22;
    comp.attack.value = 0.008;
    comp.release.value = 0.25;
    master.connect(comp).connect(ac.destination);

    const n = ac.sampleRate * 0.6;
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    // a fixed rack of panners, so a pop sounds where it happened
    if (ac.createStereoPanner) {
      for (let i = 0; i < 9; i++) {
        const p = ac.createStereoPanner();
        p.pan.value = (i / 8 * 2 - 1) * 0.62;
        p.connect(master);
        pans.push(p);
      }
    }
    return ac;
  }

  const noise = () => { const s = ac.createBufferSource(); s.buffer = noiseBuf; return s; };
  const filt = (type, freq, q) => { const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q; return f; };

  // amplitude envelope: instant-ish attack, exponential tail
  function env(t, peak, attack, decay) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    return g;
  }

  function burst(t, cfg) {          // filtered noise transient
    const a = cfg.a || 0.001;       // attack is optional — never let it reach stop() as undefined
    const s = noise(), f = filt(cfg.type, cfg.freq, cfg.q), g = env(t, cfg.gain, a, cfg.d);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + a + cfg.d + 0.02);
  }

  // no attack ramp at all — the first sample is full scale. This is what
  // separates a crack from a blip.
  function crack(t, cfg) {
    const s = noise(), f = filt(cfg.type, cfg.freq, cfg.q), g = ac.createGain();
    if (cfg.to) {
      f.frequency.setValueAtTime(cfg.freq, t);   // anchor, or the sweep starts early
      f.frequency.exponentialRampToValueAtTime(cfg.to, t + cfg.sweep);
    }
    g.gain.setValueAtTime(cfg.gain, t);
    if (cfg.knee) g.gain.exponentialRampToValueAtTime(cfg.gain * cfg.knee, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0006, t + cfg.d);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + cfg.d + 0.03);
  }

  function tone(t, cfg) {           // pitched body
    const o = ac.createOscillator();
    o.type = cfg.wave || "sine";
    o.frequency.setValueAtTime(cfg.from, t);
    if (cfg.to) o.frequency.exponentialRampToValueAtTime(cfg.to, t + cfg.sweep);
    const g = env(t, cfg.gain, cfg.a || 0.003, cfg.d);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + (cfg.a || 0.003) + cfg.d + 0.02);
  }

  /* Three readings of the same event. A pop is the film splitting, the
     plastic edge snapping past itself, and air leaving the cell — what
     changes between these is how much of each you hear and how close the
     mic is. Every pop rolls its own brightness and Q, so no two match. */
  const WRAP = {
    /* The satisfying part of bubble wrap is not the hiss, it's the cavity:
       a sealed pocket of air fails all at once, and you hear the film tear
       (fast and bright) and the pocket collapse (low, pitched, and gone in a
       twentieth of a second) as one event. These three all carry that pair —
       what changes is how close the mic is. */

    // dry and thin, heard across a room
    crisp(t, r) {
      const bright = 0.78 + Math.random() * 0.6;
      const dull = Math.random() < 0.22;
      crack(t, {
        type: "bandpass", freq: 3300 * r * bright, to: 660 * r, sweep: 0.03,
        q: 3.5 + Math.random() * 5, gain: dull ? 0.66 : 1.15, knee: 0.26, d: dull ? 0.035 : 0.055
      });
      if (!dull) crack(t + 0.0005, { type: "highpass", freq: 5400 * bright, q: 0.7, gain: 0.42 * bright, d: 0.007 });
      tone(t, { from: 205 * r, to: 106 * r, sweep: 0.028, gain: dull ? 0.22 : 0.38, a: 0.0015, d: 0.042 });
      // the pocket letting go, right under the tear
      burst(t, { type: "lowpass", freq: 520 * r, q: 1.4, gain: dull ? 0.16 : 0.3, a: 0.0012, d: 0.03 });
      if (Math.random() < 0.17) {
        crack(t + 0.018 + Math.random() * 0.035, {
          type: "bandpass", freq: 2500 * r, to: 850 * r, sweep: 0.02, q: 6, gain: 0.4, knee: 0.3, d: 0.03
        });
      }
    },

    // close-mic'd ASMR: the resonance sits lower and rings longer, and the
    // air thump underneath carries real weight
    fat(t, r) {
      const bright = 0.85 + Math.random() * 0.45;
      const soft = Math.random() < 0.18;
      crack(t, {
        type: "bandpass", freq: 2150 * r * bright, to: 400 * r, sweep: 0.05,
        q: 2.4 + Math.random() * 3.4, gain: soft ? 0.62 : 1.05, knee: 0.4, d: soft ? 0.06 : 0.095
      });
      crack(t + 0.0005, { type: "highpass", freq: 3800 * bright, q: 0.7, gain: 0.2 * bright, d: 0.01 });
      tone(t, { from: 172 * r, to: 72 * r, sweep: 0.065, gain: soft ? 0.4 : 0.66, a: 0.0018, d: 0.125 });
      tone(t + 0.004, { from: 340 * r, to: 232 * r, sweep: 0.05, gain: 0.17, a: 0.003, d: 0.085 });
      burst(t, { type: "lowpass", freq: 430 * r, q: 1.6, gain: soft ? 0.24 : 0.42, a: 0.0015, d: 0.055 });
      if (Math.random() < 0.14) {
        crack(t + 0.03 + Math.random() * 0.04, {
          type: "bandpass", freq: 1700 * r, to: 560 * r, sweep: 0.03, q: 4, gain: 0.36, knee: 0.35, d: 0.05
        });
      }
    },

    // a fistful at once: several cells giving way in a scatter
    crunch(t, r) {
      const n = 2 + (Math.random() * 3 | 0);
      for (let i = 0; i < n; i++) {
        crack(t + i * (0.007 + Math.random() * 0.022), {
          type: "bandpass", freq: (1700 + Math.random() * 2700) * r, to: 700 * r, sweep: 0.022,
          q: 4 + Math.random() * 7, gain: 0.45 + Math.random() * 0.5, knee: 0.3, d: 0.028 + Math.random() * 0.025
        });
      }
      crack(t, { type: "highpass", freq: 6000, q: 0.7, gain: 0.26, d: 0.008 });
      tone(t, { from: 195 * r, to: 92 * r, sweep: 0.035, gain: 0.36, a: 0.0015, d: 0.065 });
      burst(t, { type: "lowpass", freq: 480 * r, q: 1.5, gain: 0.3, a: 0.0012, d: 0.038 });
    }
  };

  const VOICES = {
    wrap(t, r) { WRAP[popStyle] ? WRAP[popStyle](t, r) : WRAP.fat(t, r); },
    /* MX Blue is two sounds, not one: the click jacket snapping free at the
       actuation point — high, and over almost before it starts — and then the
       stem bottoming out on plastic a few milliseconds later, which is lower
       and duller. Crisp means the gap between them is tight and neither one
       rings on. */
    clicky(t, r) {
      const gap = 0.009 + Math.random() * 0.004;
      // 1. the jacket, all edge — two layers, not three; it was a pile-up
      crack(t, { type: "highpass", freq: 4200 * r, q: 0.7, gain: 0.72, knee: 0.22, d: 0.006 });
      crack(t + 0.0004, { type: "bandpass", freq: 6100 * r, q: 7, gain: 0.44, knee: 0.25, d: 0.012 });
      // 2. plastic meeting plastic
      burst(t + gap, { type: "lowpass", freq: 900 * r, q: 1.1, gain: 0.4, a: 0.0012, d: 0.03 });
      tone(t + gap, { from: 330 * r, to: 176 * r, sweep: 0.02, gain: 0.32, a: 0.0015, d: 0.045 });
      tone(t + gap, { from: 1250 * r, to: 900 * r, sweep: 0.012, gain: 0.1, a: 0.0015, d: 0.022 });
    },
    /* The mahjong sound: a POM stem bottoming out in a nylon housing, which
       people reach for because it lands like a tile on a wooden table. Deep,
       dense, and pure — the lube is there to kill the high end, so almost
       nothing above 2k survives, and the body is a low fundamental with one
       hard partial over it that reads as the tile's face. */
    thock(t, r) {
      burst(t, { type: "lowpass", freq: 700 * r, q: 1.1, gain: 0.5, a: 0.0012, d: 0.038 });
      tone(t, { from: 168 * r, to: 122 * r, sweep: 0.03, gain: 0.62, a: 0.0018, d: 0.105 });
      tone(t + 0.001, { from: 452 * r, to: 330 * r, sweep: 0.03, gain: 0.2, a: 0.0018, d: 0.06 });
      // the face of the tile clacking, brief and mid — never bright
      burst(t, { type: "bandpass", freq: 1150 * r, q: 3.2, gain: 0.22, a: 0.001, d: 0.016 });
    },
    /* A drip is not a splash. What you hear is a bubble of air pulled under
       the surface and ringing as it shrinks, which is why the pitch *rises* —
       the tiny impact tick first, then the rise, and nothing else. */
    drop(t, r) {
      burst(t, { type: "bandpass", freq: 2400 * r, q: 2, gain: 0.22, a: 0.001, d: 0.007 });
      tone(t + 0.002, { from: 520 * r, to: 1950 * r, sweep: 0.042, gain: 0.5, a: 0.003, d: 0.085 });
      tone(t + 0.002, { from: 1040 * r, to: 3900 * r, sweep: 0.042, gain: 0.07, a: 0.003, d: 0.05 });
      burst(t, { type: "lowpass", freq: 300 * r, q: 1.2, gain: 0.16, a: 0.0015, d: 0.032 });
    },
    // wet, rude, deeply satisfying — the suction is the sweep, the punch is
    // the slap of it letting go at the front
    slime(t, r) {
      const s = noise(), f = filt("lowpass", 300, 7), g = env(t, 0.7, 0.014, 0.2);
      f.frequency.setValueAtTime(320 * r, t);
      f.frequency.exponentialRampToValueAtTime(2400 * r, t + 0.085);
      f.frequency.exponentialRampToValueAtTime(360 * r, t + 0.22);
      s.connect(f); f.connect(g); g.connect(out);
      s.start(t); s.stop(t + 0.3);
      burst(t, { type: "lowpass", freq: 800 * r, q: 1.2, gain: 0.4, a: 0.0015, d: 0.028 });
      tone(t + 0.015, { from: 260 * r, to: 140 * r, sweep: 0.16, gain: 0.32, a: 0.012, d: 0.17 });
    },
    // dry temple knock — hard mallet, hollow body
    wood(t, r) {
      crack(t, { type: "bandpass", freq: 1500 * r, q: 6, gain: 0.62, knee: 0.3, d: 0.03 });
      tone(t, { from: 820 * r, to: 700 * r, sweep: 0.05, gain: 0.52, a: 0.0015, d: 0.08 });
      tone(t, { from: 1950 * r, gain: 0.2, a: 0.0015, d: 0.04 });
      burst(t, { type: "lowpass", freq: 420 * r, q: 1.3, gain: 0.22, a: 0.0012, d: 0.032 });
    }
  };

  const panTo = x => (pans.length && x >= 0) ? pans[Math.round(Math.min(1, x / W) * 8)] : master;

  // the weight of a foot, laid under the pop. `w` runs 0 to 1 with speed.
  function crush(t, r, w) {
    tone(t, { from: 96 * r, to: 52 * r, sweep: 0.07, gain: 0.16 + 0.2 * w, a: 0.002, d: 0.08 + 0.05 * w });
    burst(t, { type: "lowpass", freq: 240 + 300 * w, q: 1.2, gain: 0.1 + 0.16 * w, d: 0.05 + 0.04 * w });
    // grit, only when you're really moving
    if (w > 0.5) burst(t + 0.006, { type: "bandpass", freq: 3200 * r, q: 2, gain: 0.06 * w, d: 0.02 });
  }

  /* Every cell used to sound like every other cell, because the only thing
     that varied was one random number per hit. Two things fix that. A cell's
     pitch is now a property of the cell — the same bubble always answers the
     same way, and the one beside it answers slightly differently, which is
     what makes walking across a patch sound like walking across a patch
     rather than a loop. And a foot is not a fingertip: a stomp adds weight
     under the pop that scales with how fast you were going. */

  function play(x, id, cell, heavy) {
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    // queue rapid hits a few ms apart so a fast drag reads as a roll, not mush
    const t = Math.max(ac.currentTime + 0.001, lastVoice + 0.014);
    lastVoice = t;
    // the cell's own pitch, with a little jitter so it never sounds sampled
    const own = cell ? ((cell.idx * 2654435761 >>> 0) % 1000) / 1000 : Math.random();
    const r = 0.9 + own * 0.2 + (Math.random() - 0.5) * 0.03;

    // pops fire from inside the draw loop — a bad voice must never stop the frame
    try {
      out = panTo(x);
      VOICES[id || pack.id](t, r);
      if (heavy) crush(t, r, heavy);
    } catch (e) {
      if (!play.warned) { play.warned = true; console.error("voice failed", e); }
    }
    out = master;
  }

  // an open palm the size of the sky, landing flat
  function slapSound() {
    if (!ac) return;
    try {
      out = master;
      const t = ac.currentTime + 0.001;
      crack(t, { type: "lowpass", freq: 900, q: 0.9, gain: 1.2, knee: 0.4, d: 0.16 });   // the meat
      tone(t, { from: 72, to: 30, sweep: 0.28, gain: 0.95, a: 0.004, d: 0.55 });         // the room
      crack(t, { type: "bandpass", freq: 3000, q: 1.6, gain: 0.5, knee: 0.3, d: 0.05 }); // skin snap
      burst(t + 0.03, { type: "lowpass", freq: 500, q: 1, gain: 0.35, d: 0.3 });         // rumble after
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  // a hug letting go: a soft thump under a major chord that blooms upward
  function heartBloom(x) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = ac.currentTime + 0.001;
      burst(t, { type: "lowpass", freq: 420, q: 1, gain: 0.5, d: 0.22 });
      tone(t, { from: 110, to: 66, sweep: 0.3, gain: 0.6, a: 0.006, d: 0.5 });
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {   // C E G C, spread out
        tone(t + 0.02 + i * 0.045, { wave: "triangle", from: f, gain: 0.22, a: 0.01, d: 0.45 });
      });
      tone(t + 0.24, { wave: "sine", from: 1567.98, gain: 0.1, a: 0.02, d: 0.7 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  // the shove when two of them collide — no pack of its own, just weight
  function boom(x) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = ac.currentTime + 0.001;
      tone(t, { from: 165, to: 40, sweep: 0.2, gain: 0.8, a: 0.005, d: 0.34 });
      burst(t, { type: "lowpass", freq: 800, q: 1, gain: 0.55, d: 0.13 });
      burst(t, { type: "bandpass", freq: 2600, q: 2, gain: 0.3, d: 0.05 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  /* What a bumped pet says about it. These have to live above the bang that
     causes them: a collision is a low boom plus a dozen pops, so anything
     down where the boom is gets swallowed whole. Every voice here sits in the
     mid and top of the band, and the caller delays it past the transient — you
     hear the crash, then the complaint. */
  const CRIES = {
    cat(t) {          // mee, then ow
      tone(t, { wave: "triangle", from: 660, to: 1020, sweep: 0.11, gain: 0.55, a: 0.018, d: 0.16 });
      tone(t + 0.13, { wave: "triangle", from: 980, to: 470, sweep: 0.2, gain: 0.5, a: 0.012, d: 0.24 });
      tone(t + 0.005, { wave: "sine", from: 1320, to: 2040, sweep: 0.11, gain: 0.12, a: 0.02, d: 0.14 });
      burst(t, { type: "bandpass", freq: 2600, q: 3, gain: 0.08, d: 0.2 });
    },
    dog(t) {          // one round woof
      burst(t, { type: "bandpass", freq: 900, q: 1.2, gain: 0.5, d: 0.08 });
      tone(t, { wave: "sawtooth", from: 340, to: 165, sweep: 0.1, gain: 0.6, a: 0.004, d: 0.14 });
      tone(t + 0.012, { wave: "triangle", from: 680, to: 300, sweep: 0.08, gain: 0.34, a: 0.004, d: 0.11 });
      burst(t + 0.004, { type: "bandpass", freq: 2700, q: 2.4, gain: 0.12, d: 0.05 });
    },
    dino(t) {         // a small monster doing its best
      tone(t, { wave: "sawtooth", from: 420, to: 175, sweep: 0.28, gain: 0.5, a: 0.012, d: 0.34 });
      tone(t + 0.02, { wave: "sawtooth", from: 230, to: 105, sweep: 0.28, gain: 0.3, a: 0.012, d: 0.3 });
      burst(t, { type: "bandpass", freq: 1100, q: 2, gain: 0.22, d: 0.3 });
      tone(t + 0.3, { wave: "triangle", from: 600, to: 980, sweep: 0.09, gain: 0.28, a: 0.012, d: 0.12 });
    }
  };

  /* `wait` buys distance from whatever caused the cry. A collision doesn't
     make one sound, it queues a train of them — thirty cells at fourteen
     milliseconds apart is the better part of half a second of popping — so a
     fixed delay lands the cry in the middle of the train and the train eats
     it. Riding lastVoice puts it just after whatever is already queued,
     however big the bang was. */
  function cry(x, wait) {
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    const t = Math.min(Math.max(ac.currentTime + (wait || 0.001), lastVoice + 0.05),
                       ac.currentTime + 0.6);      // …but never so late it reads as unrelated
    lastVoice = t;
    try { out = panTo(x); CRIES[pet](t); } catch (e) {}
    out = master;
  }

  // going over the edge: their voice, falling away from you
  function wail(x) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = ac.currentTime + 0.001;
      CRIES[pet](t);
      tone(t + 0.05, { wave: "triangle", from: 520, to: 90, sweep: 0.9, gain: 0.3, a: 0.03, d: 1.0 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  /* ══ the sound of weather ════════════════════════════════
     A bed that runs under everything while the sky is busy, plus two one-shot
     bangs. The bed is filtered noise on a loop — rain is the top end of it,
     snow is the bottom, which is most of what tells them apart with your eyes
     shut. */

  let bed = null, bedKind = null;

  function stopBed() {
    if (!bed) return;
    const dead = bed;
    bed = null;
    try {
      dead.g.gain.setTargetAtTime(0, ac.currentTime, 0.35);
      setTimeout(() => { try { dead.src.stop(); } catch (e) {} }, 1800);
    } catch (e) {}
  }

  function weatherBed() {
    if (!ac || bedKind === sky.kind) return;
    bedKind = sky.kind;
    stopBed();
    const level = sky.kind === "thunder" ? 0.15
      : sky.kind === "rain" ? 0.11
      : sky.kind === "snow" ? 0.05 : 0;
    if (!level) return;
    try {
      const src = noise();
      src.loop = true;
      const wet = sky.kind === "snow";
      const f = filt(wet ? "lowpass" : "highpass", wet ? 380 : 850, 0.7);
      const g2 = ac.createGain();
      g2.gain.value = 0;
      src.connect(f); f.connect(g2); g2.connect(master);
      src.start();
      g2.gain.setTargetAtTime(level, ac.currentTime, 1.4);   // it arrives, it doesn't cut in
      bed = { src, g: g2 };
    } catch (e) { bed = null; }
  }

  function thunder() {
    if (!ac) return;
    try {
      out = master;
      const t = ac.currentTime + 0.001;
      crack(t, { type: "lowpass", freq: 320, q: 0.8, gain: 1.05, knee: 0.5, d: 0.5 });
      tone(t, { from: 58, to: 26, sweep: 0.9, gain: 0.8, a: 0.01, d: 1.6 });
      burst(t + 0.12, { type: "lowpass", freq: 520, q: 1, gain: 0.5, d: 1.2 });
      burst(t + 0.55, { type: "lowpass", freq: 300, q: 1, gain: 0.3, d: 1.4 });   // the roll after
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  // a body meeting the floor. Smaller ones land higher.
  function thud(x, scale) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = Math.max(ac.currentTime + 0.001, lastVoice + 0.01);
      lastVoice = t;
      const r = 0.8 + (1 - scale) * 0.55;
      tone(t, { from: 132 * r, to: 44 * r, sweep: 0.09, gain: 0.5, a: 0.002, d: 0.17 });
      burst(t, { type: "lowpass", freq: 430, q: 1, gain: 0.3, d: 0.09 });
      burst(t + 0.01, { type: "bandpass", freq: 1800 * r, q: 2, gain: 0.12, d: 0.03 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  /* ══ ambient ═════════════════════════════════════════════
     A slow generative pad, keyed to whatever material you're on.
     It never repeats: notes are drawn from a minor pentatonic and
     fade in and out over several seconds, through a long delay. */

  const ROOTS = { wrap: 110, clicky: 73.42, thock: 87.31, drop: 130.81, slime: 98, wood: 82.41 };
  const SCALE = [0, 3, 5, 7, 10, 12, 15, 19];
  let mus = null;

  function padNote() {
    const root = ROOTS[pack.id] || 110;
    const semi = SCALE[(Math.random() * SCALE.length) | 0] + 12 * (1 + (Math.random() * 2 | 0));
    const f = root * Math.pow(2, semi / 12);
    const t = ac.currentTime, dur = 3.4 + Math.random() * 3.2;
    for (const v of [[1, "sine", 0.17], [2.004, "sine", 0.045], [3, "triangle", 0.016]]) {
      const o = ac.createOscillator();
      o.type = v[1];
      o.frequency.value = f * v[0];
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v[2], t + dur * 0.45);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(mus.bus);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }

  function schedule() {
    if (!mus) return;
    mus.timer = setTimeout(() => { if (mus) { try { padNote(); } catch (e) {} schedule(); } }, 1700 + Math.random() * 3400);
  }

  function droneTune() {
    if (!mus) return;
    const root = ROOTS[pack.id] || 110;
    for (const d of mus.drone) d.o.frequency.setTargetAtTime(root * d.m, ac.currentTime, 1.4);
  }

  function musicStart() {
    audio();
    if (ac.state === "suspended") ac.resume();
    if (mus) return;
    const bus = ac.createGain(); bus.gain.value = 0.0001;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 0.5;
    const dl = ac.createDelay(2); dl.delayTime.value = 0.66;
    const fb = ac.createGain(); fb.gain.value = 0.4;
    const wet = ac.createGain(); wet.gain.value = 0.4;
    bus.connect(lp); lp.connect(master);
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);

    const lfo = ac.createOscillator(); lfo.frequency.value = 0.035;   // the pad breathes
    const lfoAmt = ac.createGain(); lfoAmt.gain.value = 420;
    lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency); lfo.start();

    mus = { bus, lp, dl, fb, wet, lfo, drone: [], timer: 0 };
    const root = ROOTS[pack.id] || 110;
    for (const v of [[1, "sine", 0.1], [1.5, "sine", 0.05], [2, "triangle", 0.028]]) {
      const o = ac.createOscillator();
      o.type = v[1];
      o.frequency.value = root * v[0];
      const g = ac.createGain(); g.gain.value = v[2];
      o.connect(g); g.connect(bus); o.start();
      mus.drone.push({ o, m: v[0] });
    }
    bus.gain.setTargetAtTime(0.55, ac.currentTime, 2.2);
    try { padNote(); } catch (e) {}
    schedule();
  }

  function musicStop() {
    if (!mus) return;
    const m = mus;
    mus = null;
    clearTimeout(m.timer);
    m.bus.gain.setTargetAtTime(0.0001, ac.currentTime, 0.5);
    setTimeout(() => {
      try {
        m.lfo.stop();
        for (const d of m.drone) d.o.stop();
        m.bus.disconnect(); m.lp.disconnect(); m.dl.disconnect(); m.fb.disconnect(); m.wet.disconnect();
      } catch (e) {}
    }, 2200);
  }

  /* ══ materials ═══════════════════════════════════════════ */

  // Six zones laid end to end, joined by bridges. Each one costs ten more
  // levels than the last, so the world opens up as you play rather than
  // sitting behind a row of buttons.
  const PACKS = [
    { id: "wrap",   name: "Bubble wrap",   tag: "Cheap plastic, sharp snap",        accent: "#57C9A8", shape: "bubble", lattice: "hex",  unlock: 0  },
    { id: "clicky", name: "Clicky switch", tag: "MX blue — bright and toothy",      accent: "#5B77E5", shape: "cap",    lattice: "grid", unlock: 10 },
    { id: "thock",  name: "Thock",         tag: "Lubed linear, deep and creamy",    accent: "#8C9A5A", shape: "cap",    lattice: "grid", unlock: 20 },
    { id: "drop",   name: "Water drop",    tag: "Cave ceiling, one drip at a time", accent: "#3FA3D9", shape: "drop",   lattice: "hex",  unlock: 30 },
    { id: "slime",  name: "Slime",         tag: "Wet, rude, deeply satisfying",     accent: "#E0609B", shape: "blob",   lattice: "hex",  unlock: 40 },
    { id: "wood",   name: "Wood block",    tag: "Dry knock, temple-quiet",          accent: "#D08A3E", shape: "peg",    lattice: "grid", unlock: 50 }
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem("es." + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("es." + k, v); } catch (e) {} }
  };

  let pack = PACKS.find(p => p.id === store.get("pack", "wrap")) || PACKS[0];
  let vol = Math.min(1, Math.max(0, parseFloat(store.get("vol", "0.75"))));
  let pops = parseInt(store.get("pops", "0"), 10) || 0;
  let popStyle = store.get("popstyle", "fat");
  let musicOn = store.get("music", "0") === "1";

  // every 1000 XP is a level: LV2 at 1000, LV3 at 2000, and so on
  const PER_LEVEL = 1000;
  let exp = parseInt(store.get("exp", "0"), 10) || 0;
  let level = Math.floor(exp / PER_LEVEL) + 1;

  const look = {
    body: store.get("body", "auto"),
    hat: store.get("hat", "none"),
    eyes: store.get("eyes", "dots")
  };
  const BODIES = {
    auto: null, coral: "#E8674F", butter: "#EFC050", grass: "#5FAE5F",
    sky: "#4FA3E3", grape: "#9B6BD6", gum: "#EE7EB0"
  };

  /* the wanderers are pets now — pick one in Setup; they cry when bumped */
  const PETC = {

  const GIRL_SCALE = 3;

        grad.addColorStop(1, rgba(hole, 0));
        x.fillStyle = grad;
        x.beginPath(); x.arc(0, 0, r * 0.94, 0, 6.2832); x.fill();
        x.strokeStyle = rgba(dark ? "#ffffff" : "#000000", dark ? 0.07 : 0.06);
        x.lineWidth = 1;
        x.beginPath(); x.arc(0, r * 0.06, r * 0.7, 0.5, 2.64); x.stroke();
      }
    }));
  }

  // The grid never changes shape, so it is built once and survives every
  // resize — which also means a cell keeps its index for the whole session.
  function buildCells() {
    cells = [];
    for (let i = 0; i < PACKS.length; i++) {
      const P = PACKS[i];
      const hex = P.lattice === "hex";
      const pitch = hex ? 1.03 : (P.shape === "cap" ? 1.06 : 1.12);   // caps sit close, like a board
      const stepX = S * pitch;
      const stepY = S * (hex ? 0.9 : pitch);
      const x0 = zoneStart(i), x1 = zoneEnd(i);
      const cols = Math.ceil((x1 - x0) / stepX);
      const rows = Math.ceil(VH / stepY) + 2;
      const offY = (VH - (rows - 1) * stepY) / 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = x0 + stepX * 0.5 + c * stepX + (hex && r % 2 ? stepX / 2 : 0);
          const y = offY + r * stepY;
          if (x > x1 - stepX * 0.2 || y < -S || y > VH + S) continue;
          const idx = cells.length;
          // how long this cell stays flat is a property of the cell, not a
          // coin flip — otherwise two screens would refill at different times
          cells.push({ x, y, z: i, st: 0, t: 0, idx, wait: 1500 + (idx * 2654435761 >>> 0) % 2800 });
        }
      }
    }
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    cvs.style.width = W + "px"; cvs.style.height = H + "px";
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    k = H / VH;                              // the world always fills the height exactly
    viewW = W / k;

    if (!cells.length) buildCells();

    if (!walker.x) { walker.x = zoneStart(0) + zoneW / 2; walker.y = VH * 0.5; }
    walker.x = Math.min(Math.max(walker.x, S * 0.44), worldW - S * 0.44);
    walker.y = Math.min(Math.max(walker.y, S * 0.44), VH - S * 0.44);
    cam.x = Math.min(Math.max(walker.x - viewW / 2, 0), Math.max(0, worldW - viewW));

    buildSprites();
    enterZone(nearestZone(walker.x));        // keeps the readout honest after a resize
  }

  /* ══ haptics ═════════════════════════════════════════════
     Android answers navigator.vibrate and always has. iPhones mostly do not —
     Safari never shipped the Vibration API, so every buzz in this file was
     quietly doing nothing on iOS. What Safari does have is the switch control
     added in 17.4, which ticks the phone's haptic engine when it toggles;
     clicking a hidden <label> for one is the only way a page can reach that
     engine. It's a side effect rather than an API — it works from iOS 17.4 to
     26.4 and Apple closed it in 26.5 — so this asks for both and takes
     whatever the phone is willing to give. */

  const SWITCHY = (() => {
    try { return "switch" in document.createElement("input"); } catch (e) { return false; }
  })();
  let hapEl = null, hapAt = 0;

  function tickHaptic() {
    if (!SWITCHY) return;
    if (!hapEl) {
      const box = document.createElement("input");
      box.type = "checkbox";
      box.setAttribute("switch", "");
      box.id = "hapbox";
      box.tabIndex = -1;
      const lab = document.createElement("label");
      lab.htmlFor = "hapbox";
      const host = document.createElement("div");
      host.id = "hap";
      host.setAttribute("aria-hidden", "true");
      host.append(box, lab);
      document.body.appendChild(host);
      hapEl = lab;
    }
    // the toggle is the buzz, and it only counts through the label
    try { hapEl.click(); } catch (e) {}
  }

  // A buzz answers something you did. The wanderers pop about three cells a
  // second between them just by walking around, and a phone that ticks three
  // times a second forever while you stand still reads as broken — so their
  // pops score and sound, they just don't reach your hand.
  let handsOn = true;

  // every buzz in the game comes through here. `beats` is how many ticks it's
  // worth on a phone that can only do one strength.
  function buzz(pattern, beats) {
    const now = performance.now();
    if (now - hapAt < 70) return;            // a slap pops hundreds of cells at once
    hapAt = now;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
    tickHaptic();
    for (let i = 1; i < (beats || 1); i++) setTimeout(tickHaptic, i * 70);
  }

  /* ══ pops ════════════════════════════════════════════════ */

  const POP_MS = reduced ? 90 : 170;
  const INFLATE_MS = reduced ? 140 : 420;
  const parts = [];
  const rings = [];
  const dents = [];

  function burstFx(x, y, P) {
    P = P || pack;
    const A = P.accent;
    rings.push({ x, y, t: performance.now(), life: reduced ? 220 : 420 });
    if (reduced || parts.length > 260) return;
    const n = P.shape === "cap" ? 4 : 8;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, sp = (0.7 + Math.random() * 2.2) * (S / 56);
      parts.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.4,
        r: 1 + Math.random() * 2.4,
        life: 300 + Math.random() * 320, t: performance.now(), c: A
      });
    }
  }

  const fmt = n => n.toLocaleString("en-US");
  const countEl = document.getElementById("count");
  const npcEl = document.getElementById("npcN");
  const lvlEl = document.getElementById("lvlN");
  const barEl = document.getElementById("barfill");
  const xpEl = document.getElementById("xp");
  const toastEl = document.getElementById("toast");
  let toastT = 0;

  function paintXp() {
    const floor = (level - 1) * PER_LEVEL;
    lvlEl.textContent = "LV " + level;
    barEl.style.width = ((exp - floor) / PER_LEVEL * 100).toFixed(1) + "%";
    xpEl.textContent = fmt(exp - floor) + " / " + fmt(PER_LEVEL);
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  function fanfare() {
    if (!ac) return;
    try {
      out = master;
      const t0 = ac.currentTime + 0.01;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        tone(t0 + i * 0.08, { wave: "triangle", from: f, gain: 0.3, a: 0.008, d: 0.3 });
      });
      tone(t0 + 0.33, { wave: "sine", from: 1567.98, gain: 0.13, a: 0.012, d: 0.6 });
    } catch (e) { /* a failed fanfare must not cost a level */ }
    out = master;
  }

  function levelUp() {
    // crossing a zone's requirement is the real event — say so
    const opened = PACKS.find(P => P.unlock === level);
    toast(opened ? opened.name + " unlocked" : "Level " + level);
    paintMap();
    fanfare();
    lvlEl.classList.add("up");
    setTimeout(() => lvlEl.classList.remove("up"), 260);
    const cx = walker.on ? walker.x : cam.x + viewW / 2, cy = walker.on ? walker.y : VH / 2;
    rings.push({ x: cx, y: cy, t: performance.now(), life: 700, big: true });
    if (!reduced) {
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * 6.2832, sp = (1.4 + Math.random() * 3) * (S / 56);
        parts.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2,
          r: 1.4 + Math.random() * 2.6, life: 620 + Math.random() * 400,
          t: performance.now(), c: pack.accent
        });
      }
    }
    store.set("exp", exp);
  }

  function addXp(n) {
    exp += n;
    const lv = Math.floor(exp / PER_LEVEL) + 1;
    if (lv > level) { level = lv; levelUp(); }
    paintXp();
  }

  // `mine` false means somebody else caused this pop: it still sounds and
  // still clears the cell, it just doesn't go on your tab.
  function popCell(c, now, mine) {
    if (c.st !== 0) return;                   // events can arrive twice; a popped cell stays popped
    const P = PACKS[c.z];                     // a cell sounds like the zone it belongs to
    c.st = 1; c.t = now;
    burstFx(c.x, c.y, P);
    play((c.x - cam.x) * k, P.id, c, stompW);   // panned by where it is, weighted by what hit it
    if (mine === false) return;
    pops++;
    if (duel && duel.me) duel.me.duelPops++;  // ten seconds, and this is the score
    countEl.textContent = fmt(pops);
    countEl.classList.add("tick");
    setTimeout(() => countEl.classList.remove("tick"), 90);
    addXp(1);
    if (!slapFx) slapCharge = Math.min(SLAP_AT, slapCharge + 1);   // the slap can't refill itself
    if (pops % 10 === 0) {
      store.set("pops", pops); store.set("exp", exp); store.set("slap", slapCharge);
      paintSlap();
    }
    if (handsOn) buzz(P.shape === "cap" ? 6 : 10);
    if (!hinted) { hinted = true; document.getElementById("hint").classList.add("gone"); }
  }

  function popQuiet(c, now, mine) {
    if (c.st !== 0) return;
    c.st = 1; c.t = now;
    if (mine === false) return;
    pops++;
    if (duel && duel.me) duel.me.duelPops++;
    addXp(1);
  }

  function hit(px, py) {
    const now = performance.now();
    const wx = px / k + cam.x, wy = py / k;   // screen to world
    let best = null, bd = (S * 1.05) ** 2;
    for (const c of cells) {
      if (c.st !== 0) continue;
      const d = (c.x - wx) ** 2 + (c.y - wy) ** 2;
      if (d < bd) { bd = d; best = c; }
    }
    if (best) { popCell(best, now); netEvent({ t: "p", i: best.idx }); }
    else rings.push({ x: wx, y: wy, t: now, life: 300 });   // nothing left there — still answer the touch
    if (!hinted) { hinted = true; document.getElementById("hint").classList.add("gone"); }
  }

  /* ══ weather ═════════════════════════════════════════════
     One minute per turn, and nobody has to be told which turn it is: the sky
     is a pure function of the wall clock. Everybody hashes the same minute
     number and gets the same answer, which means it also comes out right for
     somebody who joins halfway through, and it survives the host leaving.
     Clocks drift by a second or two between phones — all that costs is
     starting the rain a moment apart, which nobody can see.

     Rain, snow and the falling crowd are drawn per screen and never sent.
     They're weather, not world: nothing they do changes a cell. */

  const SPELL_MS = 60000;
  const SKIES = ["clear", "rain", "thunder", "snow"];
  const FALL_CHANCE = 0.10;

  // one number in, one number out, same on every machine
  function hash32(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) >>> 0;
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d) >>> 0;
    return (n ^ (n >>> 15)) >>> 0;
  }

  // a seeded stream of them, for when one number has to become many
  const mulberry32 = seed => {
    let a = (seed >>> 0) || 1;
    return () => {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  };

  function spellAt(minute) {
    const h = hash32(minute);
    // the falling crowd takes the whole minute when it comes up
    if ((hash32(minute ^ 0x9e37) % 1000) / 1000 < FALL_CHANCE) return { sky: "clear", fall: true };
    return { sky: SKIES[h % SKIES.length], fall: false };
  }

  const sky = { kind: "clear", fall: false, minute: -1, bolt: 0, nextBolt: 0, nextDrop: 0, seq: 0 };
  const drops = [];                          // rain streaks or snowflakes
  const fallers = [];                        // people, briefly

  function stepSky(now, dt) {
    const minute = Math.floor(Date.now() / SPELL_MS);
    if (minute !== sky.minute) {
      const s = spellAt(minute);
      const first = sky.minute < 0;
      sky.minute = minute;
      sky.kind = s.sky;
      sky.fall = s.fall;
      sky.seq = 0;
      sky.nextBolt = now + 1500 + Math.random() * 6000;
      sky.nextDrop = now;
      drops.length = 0;
      fallers.length = 0;
      // The falling minute is scripted, not rolled: one seed, and every client
      // unrolls the same bodies landing in the same places — which is what
      // lets a landing pop cells without the worlds coming apart.
      sky.plan = null; sky.idx = 0;
      if (s.fall) {
        const rnd = mulberry32(hash32(minute ^ 0x51ed));
        sky.plan = [];
        let at = 900;
        while (at < 57000) {
          sky.plan.push({
            at,
            x: S * 0.6 + rnd() * (worldW - S * 1.2),
            gy: VH * (0.12 + rnd() * 0.83),
            v: S * (3 + rnd() * 3),
            spin: (rnd() - 0.5) * 6,
            turn: (rnd() - 0.5) * 9,
            scale: 0.62 + rnd() * 0.3
          });
          at += 26 + rnd() * 22;
        }
        // joining mid-minute: whoever already landed stays landed and unseen
        const wall = Date.now() - minute * SPELL_MS;
        while (sky.idx < sky.plan.length && sky.plan[sky.idx].at <= wall - 1300) sky.idx++;
      }
      weatherBed();
      if (!first) toast(s.fall ? "It's raining people" : {
        clear: "The sky clears", rain: "Rain", thunder: "Thunder", snow: "Snow"
      }[s.sky]);
    }

    const rain = sky.kind === "rain" || sky.kind === "thunder";
    const snow = sky.kind === "snow";

    if (!reduced && (rain || snow)) {
      const want = rain ? (sky.kind === "thunder" ? 150 : 110) : 90;
      while (drops.length < want) drops.push(newDrop(rain, true));
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.x += d.vx; d.y += d.vy;
      if (d.snow) d.x += Math.sin((now + d.seed) / 700) * 0.6;
      if (d.y > VH + S) {
        if (rain || snow) drops[i] = newDrop(rain, false);
        else drops.splice(i, 1);
        if (rain && !reduced && Math.random() < 0.5) {   // a splash where it lands
          rings.push({ x: d.x, y: VH - Math.random() * 4, t: now, life: 260, c: "#8FB6D8" });
        }
      }
    }

    if (sky.kind === "thunder" && now > sky.nextBolt) {
      sky.nextBolt = now + 3000 + Math.random() * 9000;
      sky.bolt = now;
      thunder();
      if (!reduced) shake = Math.max(shake, 0.5);
    }

    if (sky.fall) stepFallers(now, dt);
    else if (fallers.length) fallers.length = 0;
  }

  function newDrop(rain, anywhere) {
    const x = cam.x - S * 2 + Math.random() * (viewW + S * 6);
    return rain
      ? { x, y: anywhere ? Math.random() * VH : -S * (1 + Math.random() * 3),
          vx: 4.5, vy: 34 + Math.random() * 16, len: S * (0.5 + Math.random() * 0.4), snow: 0 }
      : { x, y: anywhere ? Math.random() * VH : -S * (1 + Math.random() * 2),
          vx: 0.5, vy: 2.4 + Math.random() * 2.6, r: S * (0.035 + Math.random() * 0.05),
          seed: Math.random() * 6000, snow: 1 };
  }

  /* The crowd falls where you're looking, hits the floor, and is gone. It
     leaves a dent and a bang and nothing else — no cell is popped and nothing
     is sent, so two players watching the same minute see the same downpour
     without either of them having to agree on where a single body landed. */
  function stepFallers(now, dt) {
    const plan = sky.plan;
    if (plan) {
      const wall = Date.now() - sky.minute * SPELL_MS;
      while (sky.idx < plan.length && plan[sky.idx].at <= wall) {
        const q = plan[sky.idx++];
        if (q.at <= wall - 1300) continue;             // a stalled tab catching up
        fallers.push({ x: q.x, y: -S * (2 + q.scale * 4), gy: q.gy, v: q.v,
                       spin: q.spin, turn: q.turn, scale: q.scale });
      }
    }
    const step = Math.min(dt || 0.016, 0.05);
    for (let i = fallers.length - 1; i >= 0; i--) {
      const f = fallers[i];
      f.v += S * 26 * step;
      f.y += f.v * step;
      f.spin += f.turn * step;
      if (f.y < f.gy) continue;
      fallers.splice(i, 1);
      splat(f, now);
    }
  }

  /* The landing is part of the world now: the same body flattens the same
     cells on every screen, because the minute is scripted from the shared
     seed. Nobody scores off the sky — mine stays false throughout. */
  function splat(f, now) {
    const R = S * 1.5, near = [];
    for (const c of cells) {
      if (c.st !== 0) continue;
      const d2 = (c.x - f.x) ** 2 + (c.y - f.gy) ** 2;
      if (d2 < R * R) near.push([d2, c]);
    }
    near.sort((a, b) => a[0] - b[0]);
    const seen = f.x > cam.x - S * 2 && f.x < cam.x + viewW + S * 2;
    for (let i = 0; i < near.length; i++) {
      if (seen && i < 2) popCell(near[i][1], now, false);
      else popQuiet(near[i][1], now, false);
    }
    if (!seen) return;                       // the bang is only for whoever is looking
    explosionFx(f.x, f.gy, PACKS[nearestZone(f.x)].accent, now, f.scale);
    dents.push({ x: f.x, y: f.gy, t: now, life: 620 });
    if (dents.length > 40) dents.shift();
    thud((f.x - cam.x) * k, f.scale);
    if (!reduced) shake = Math.max(shake, 0.3);
  }

  const npcs = [];
  let shake = 0, flash = null;

  // Fixed, and deliberately so: online everyone has to see the same crowd,
  // so the count is no longer yours to set.
  const NPC_N = 5;

  function makeNpc() {
    return {
      x: 0, y: 0, z: -1,
      vx: 0, vy: 0, kx: 0, ky: 0, hop: 0, hopV: 0,
      hx: 0, hy: 0, tx: 0, ty: 0, turn: 0, cool: 0, stun: 0, gone: null,
      rx: 0, ry: 0, rhop: 0, rface: 1, moving: 0, placed: 0,
      step: Math.random() * 6, face: 1, blink: 0, nextBlink: 1200 + Math.random() * 3400,
      scale: 0.8, belt: false
    };
  }

  function fitNpcs() {
    while (npcs.length > NPC_N) npcs.pop();
    while (npcs.length < NPC_N) npcs.push(makeNpc());
    if (npcEl) npcEl.textContent = String(NPC_N);
    if (!isHost()) return;                             // the host says where they are

    // they live in whichever zone the host is standing in, so the world is
    // inhabited where the action is without simulating five empty zones
    const pad = S * 0.5;
    for (const n of npcs) {
      if (n.gone) continue;                            // mid-fall; leave it alone
      if (n.z !== zone) {
        n.z = zone;
        n.x = zoneStart(zone) + pad + Math.random() * Math.max(1, zoneW - pad * 2);
        n.y = pad + Math.random() * Math.max(1, VH - pad * 2);
        n.placed = 1;
      }
      n.x = Math.min(Math.max(n.x, zoneStart(n.z) + pad), zoneEnd(n.z) - pad);
      n.y = Math.min(Math.max(n.y, pad), VH - pad);
    }
  }

  function tick(c, dt, mag) {
    c.step += dt * (3 + 13 * mag);
    c.blink += dt * 1000;
    if (c.blink > c.nextBlink) { c.blink = -110; c.nextBlink = 2000 + Math.random() * 3800; }
    // a stunned body keeps what it was given for much longer — that's the
    // difference between being nudged and being launched off the edge
    const damp = Math.exp(-dt * (c.stun > 0 ? 1.6 : 7));
    c.kx *= damp; c.ky *= damp;
    if (c.stun > 0) c.stun -= dt;
    if (c.cool > 0) c.cool -= dt;
    if (c.hop < 0 || c.hopV) {                 // airborne: negative hop is up
      c.hopV += S * 26 * dt;
      c.hop += c.hopV * dt;
      if (c.hop >= 0) { c.hop = 0; c.hopV = 0; }
    }
  }

  // how hard the pop being played right now is being stood on: 0 is a fingertip
  let stompW = 0;

  function trample(c, now, reach, heavy, mine) {
    const r2 = reach * reach;
    stompW = heavy ? Math.min(1, Math.hypot(c.vx, c.vy) / (S * 4)) : 0;
    for (const cell of cells) {
      if (cell.st !== 0) continue;
      if ((cell.x - c.x) ** 2 + (cell.y - c.y) ** 2 >= r2) continue;
      popCell(cell, now, mine);
      if (heavy) stompFx(cell, c);
    }
    stompW = 0;
  }

  // A stomp should land harder than a tap: the cell throws its shards along
  // the direction of travel, a tight ring snaps outward, and the ground takes
  // a brief dent. Tapping stays quiet by comparison — that contrast is the point.
  function stompFx(cell, w) {
    if (reduced) return;
    const A = PACKS[cell.z].accent;
    rings.push({ x: cell.x, y: cell.y, t: performance.now(), life: 300, stomp: true });
    dents.push({ x: cell.x, y: cell.y, t: performance.now(), life: 520 });
    if (dents.length > 40) dents.shift();

    const sp = Math.hypot(w.vx, w.vy) || 1;
    const ux = w.vx / sp, uy = w.vy / sp;
    const n = parts.length > 220 ? 4 : 10;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832;
      const kick = (1.1 + Math.random() * 3.4) * (S / 56);
      parts.push({
        x: cell.x, y: cell.y,
        vx: Math.cos(a) * kick + ux * 2.4,           // thrown the way you're heading
        vy: Math.sin(a) * kick + uy * 2.4 - 1,
        r: 1.2 + Math.random() * 2.8,
        life: 380 + Math.random() * 420,
        t: performance.now(), c: A
      });
    }
  }

  // dust under the foot each time a step lands
  function footfall(w) {
    if (reduced) return;
    const u = S * 0.55 * w.scale;
    const side = Math.sin(w.step) > 0 ? 1 : -1;
    for (let i = 0; i < 5; i++) {
      const a = Math.PI + (Math.random() - 0.5) * 2.2;
      const sp = (0.4 + Math.random() * 1.1) * (S / 56);
      parts.push({
        x: w.x + side * u * 0.34, y: w.y + u * 0.98,
        vx: Math.cos(a) * sp - w.vx * 0.004,
        vy: Math.sin(a) * sp * 0.5 - 0.5,
        r: 1 + Math.random() * 2.2,
        life: 260 + Math.random() * 240,
        t: performance.now(), c: darkNow ? "#8E8CA0" : "#9C9AAE", soft: true
      });
    }
  }

  const BAND = () => S * 1.7;                 // half-height of the bridge deck

  function stepWalker(now, dt) {
    const w = walker;
    let ix = stick.dx + keyVec.x, iy = stick.dy + keyVec.y;
    if (w.duet) ix = iy = 0;                    // a hug drives you; you don't

    // Behind bars you can lean on them and you can still pop whatever is in
    // reach — you just aren't going anywhere for ten seconds.
    if (w.jail) {
      if (now >= w.jail.until) w.jail = null;
      else {
        const lean = S * 0.15;
        w.x = w.jx + Math.max(-1, Math.min(1, ix)) * lean;
        w.y = w.jy + Math.max(-1, Math.min(1, iy)) * lean;
        w.vx = w.vy = w.kx = w.ky = 0;
        if (Math.abs(ix) > 0.06) w.face += ((ix > 0 ? 1 : -1) - w.face) * Math.min(1, dt * 9);
        tick(w, dt, Math.hypot(ix, iy) * 0.5);
        return;
      }
    }

    let mag = Math.hypot(ix, iy);
    if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }

    // Shift on a keyboard, or the drag pushed past the rim on a phone
    const runMul = (running || Math.hypot(stick.dx, stick.dy) > 0.85) ? 2 : 1;
    const speed = S * 3.1 * runMul;
    w.vx = ix * speed + w.kx; w.vy = iy * speed + w.ky;
    w.x += w.vx * dt; w.y += w.vy * dt;

    const pad = S * 0.44;
    w.x = Math.min(Math.max(w.x, pad), worldW - pad);
    w.y = Math.min(Math.max(w.y, pad), VH - pad);

    // the hidden handshake: pin yourself to the bottom of the world and keep
    // pushing for five seconds, and the wanderers stop being wanderers
    if (iy > 0.55 && w.y >= VH - pad - 1) {
      edgeHold += dt;
      if (edgeHold >= 5) {
        edgeHold = 0;
        girlMode = !girlMode;
        fanfare();
        toast(girlMode ? "Oh — hello!" : "The wanderers are themselves again");
      }
    } else edgeHold = 0;

    // a locked bridge stops you at the barrier
    for (let i = 1; i < PACKS.length; i++) {
      if (!locked(i)) continue;
      const gx = gateX(i) - S * 0.5;
      if (w.x > gx && w.x < zoneStart(i) + zoneW * 0.5) {
        w.x = gx;
        if (w.kx > 0) w.kx = 0;
      }
    }

    // on a bridge you walk the deck, not the void
    if (zoneAt(w.x) < 0) {
      const b = BAND();
      w.y = Math.min(Math.max(w.y, VH / 2 - b), VH / 2 + b);
    }

    if (Math.abs(ix) > 0.06) w.face += ((ix > 0 ? 1 : -1) - w.face) * Math.min(1, dt * 9);

    const before = Math.sin(w.step);
    tick(w, dt, Math.min(1.6, mag * runMul));   // legs keep up with the speed
    // a footfall is the moment the gait crosses zero — that's when it lands
    if (mag > 0.15 && before * Math.sin(w.step) <= 0) footfall(w);

    // trample what it walks over — only while actually moving, so standing
    // still doesn't turn into a machine gun as the cells refill underneath
    if (mag > 0.02 || Math.hypot(w.kx, w.ky) > S) trample(w, now, S * 0.56, true, true);

    const z = zoneAt(w.x);
    if (z >= 0 && z !== zone) enterZone(z);
  }

  /* Hit one hard enough at the rim and it goes over. The clamps that keep a
     wanderer inside its zone stop applying once it has real momentum behind
     it, so a shove can carry it past the edge — after which it just falls,
     tumbling and shrinking, and a new one wanders in a moment later. The
     host's y travels in the snapshot exactly as before, so everyone watches
     the same body leave; only the tumble is drawn locally. */
  /* The world is exactly one screen tall, so a body that keeps falling past
     the bottom is gone before you can see it go. It tips over the rim
     instead, and the fall reads as distance: it shrinks and spins away into
     the space underneath while staying at the edge of the picture. */
  const OFF = S * 0.1;
  const GONE_MS = 1300;

  function shoved(n) { return n.stun > 0 || Math.hypot(n.kx, n.ky) > S * 2.2; }

  // no steering while stunned: it goes where it was sent
  function drift(n, now, dt) {
    n.vx = n.kx; n.vy = n.ky;
    n.x += n.vx * dt; n.y += n.vy * dt;
    n.x = Math.min(Math.max(n.x, -S * 0.2), worldW + S * 0.2);
    n.z = nearestZone(n.x);
    n.moving = 1;
    if (Math.abs(n.vx) > S * 0.2) n.face += ((n.vx > 0 ? 1 : -1) - n.face) * Math.min(1, dt * 7);
    tick(n, dt, 0.5);
  }

  // over the rim: the bottom, the top, or either end of the strip
  /* "Off the map" is not four hardcoded edges — it's anywhere there is no
     floor. A zone is solid from top to bottom; the gap between two zones is
     empty except the width of the bridge deck. So the void either side of a
     bridge, above and below the planks, counts exactly like the top and the
     bottom of the world does, and asking the world where its ground is gets
     all of them at once. `m` is how far inside the edge still counts, so the
     tumble starts while you can still see it. */
  function onGround(x, y, m) {
    if (x < m || x > worldW - m) return false;
    if (y < m || y > VH - m) return false;
    if (zoneAt(x) >= 0) return true;                   // a zone is floor all the way down
    const b = BAND() - m;                              // a bridge is only its deck
    return y > VH / 2 - b && y < VH / 2 + b;
  }

  function overboard(n, now) {
    if (n.gone || !shoved(n) || onGround(n.x, n.y, S * 1.1)) return false;
    // in a gap or off an end it keeps drifting the way it was thrown; over the
    // top or bottom of a zone there's nowhere sideways to go
    const loose = zoneAt(n.x) < 0 || n.x < S || n.x > worldW - S;
    n.gone = {
      t0: now,
      dir: n.y < VH / 2 ? -1 : 1,                      // whichever way it left
      side: loose ? (n.kx >= 0 ? 1 : -1) : 0,
      spin: (Math.random() - 0.5) * 9
    };
    n.moving = 0;
    if (Math.abs(n.x - (cam.x + viewW / 2)) < viewW) wail((n.x - cam.x) * k);
    return true;
  }

  function stepGone(n, now, dt) {
    const p = (now - n.gone.t0) / GONE_MS;
    if (p >= 1) {                                      // and a new one wanders in
      n.gone = null;
      n.kx = n.ky = 0; n.hop = n.hopV = 0; n.stun = 0; n.z = -1;
      fitNpcs();
      return;
    }
    // it leaves the picture, but only just: the rest of the fall is scale
    n.y += (n.gone.side ? S * 1.4 : n.gone.dir * S * 2.4) * dt;   // sideways still sinks
    n.x += n.gone.side * S * 1.2 * dt + n.kx * dt * 0.4;
    n.y = Math.min(Math.max(n.y, -S * 0.15), VH + S * 0.15);      // stays in shot
    n.x = Math.min(Math.max(n.x, -S * 0.15), worldW + S * 0.15);
  }

  // she keeps her distance, but she keeps up
  function stepGirl(n, now, dt) {
    const w = walker;
    const dx = w.x - n.x, dy = w.y - n.y;
    const d = Math.hypot(dx, dy) || 1;
    const want = S * 2.2;                              // how close she likes to stand
    const pull = Math.max(-0.4, Math.min(1, (d - want) / (S * 3)));
    const speed = S * 3.4 * pull;
    n.vx = dx / d * speed + n.kx;
    n.vy = dy / d * speed + n.ky;
    n.x += n.vx * dt; n.y += n.vy * dt;
    if (!shoved(n)) {
      n.x = Math.min(Math.max(n.x, S * 0.44), worldW - S * 0.44);
      n.y = Math.min(Math.max(n.y, S * 0.44), VH - S * 0.44);
    }
    n.z = nearestZone(n.x);
    n.moving = Math.abs(pull) > 0.06 ? 1 : 0;
    if (Math.abs(n.vx) > S * 0.2) n.face += ((n.vx > 0 ? 1 : -1) - n.face) * Math.min(1, dt * 7);
    tick(n, dt, Math.min(1, Math.abs(pull)));
  }

  function stepNpc(n, now, dt) {
    if (n.gone) return stepGone(n, now, dt);
    if (overboard(n, now)) return;
    if (n.stun > 0) return drift(n, now, dt);
    if (isGirl(n)) return stepGirl(n, now, dt);
    n.turn -= dt;
    if (n.turn <= 0) {                                  // pick somewhere new to amble
      n.turn = 0.9 + Math.random() * 2.4;
      const a = Math.random() * 6.2832;
      const pace = Math.random() < 0.22 ? 0 : 0.42 + Math.random() * 0.5;   // sometimes just stand there
      n.tx = Math.cos(a) * pace; n.ty = Math.sin(a) * pace;
    }
    const ease = Math.min(1, dt * 2.4);
    n.hx += (n.tx - n.hx) * ease;
    n.hy += (n.ty - n.hy) * ease;

    const speed = S * 1.6;
    n.vx = n.hx * speed + n.kx; n.vy = n.hy * speed + n.ky;
    n.x += n.vx * dt; n.y += n.vy * dt;

    // Wanderers keep to their own zone under their own steam — but a hard
    // shove overrides every one of these walls, sideways included, or you
    // could never push one into the gap beside a bridge.
    const pad = S * 0.5;
    if (!shoved(n)) {
      const lo = zoneStart(n.z) + pad, hi = zoneEnd(n.z) - pad;
      if (n.x < lo) { n.x = lo; n.tx = n.hx = Math.abs(n.hx) + 0.2; }
      if (n.x > hi) { n.x = hi; n.tx = n.hx = -Math.abs(n.hx) - 0.2; }
      if (n.y < pad) { n.y = pad; n.ty = n.hy = Math.abs(n.hy) + 0.2; }
      if (n.y > VH - pad) { n.y = VH - pad; n.ty = n.hy = -Math.abs(n.hy) - 0.2; }
    }

    const mag = Math.min(1, Math.hypot(n.hx, n.hy));
    n.moving = mag > 0.05 ? 1 : 0;
    if (Math.abs(n.vx) > S * 0.2) n.face += ((n.vx > 0 ? 1 : -1) - n.face) * Math.min(1, dt * 7);
    tick(n, dt, mag);

    if (mag > 0.05 || Math.hypot(n.kx, n.ky) > S) {
      handsOn = false; trample(n, now, S * 0.46, false, true); handsOn = true;
    }
  }

  // Everyone but the host is watching a recording: slide the wanderer toward
  // the position the host last reported and let the rest of the code treat it
  // exactly like a local one — including trampling, so the sheet matches.
  function stepNpcRemote(n, now, dt) {
    if (n.gone) return stepGone(n, now, dt);
    if (n.stun > 0) return drift(n, now, dt);
    if (isGirl(n)) return stepGirl(n, now, dt);        // yours to follow, host or not
    if (!n.placed) return;
    // the host says it left the world; snap there and let it fall here too
    if (n.ry > VH + OFF || n.ry < -OFF) { n.y = n.ry; n.x = n.rx; overboard(n, now); return; }
    const e = Math.min(1, dt * 12);
    const ox = n.x, oy = n.y;
    n.x += (n.rx - n.x) * e;
    n.y += (n.ry - n.y) * e;
    n.hop += (n.rhop - n.hop) * e;
    n.vx = dt > 0 ? (n.x - ox) / dt : 0;
    n.vy = dt > 0 ? (n.y - oy) / dt : 0;
    n.face += (n.rface - n.face) * Math.min(1, dt * 7);
    n.z = nearestZone(n.x);
    tick(n, dt, n.moving ? 0.6 : 0);
    if (n.moving) { handsOn = false; trample(n, now, S * 0.46, false, true); handsOn = true; }
  }

  /* An explosion in layers, because one flash and two rings reads as an icon:
     a hot core, sparks that streak and die fast, chunks of the thing that
     burst tumbling out in its own colour, and smoke that arrives late and
     rises. Each layer moves at its own speed — that difference is what makes
     it read as a blast instead of a decal. */
  function explosionFx(x, y, A, now, big) {
    flash = { x, y, t: now, c: A };
    rings.push({ x, y, t: now, life: 460, big: true });
    rings.push({ x, y, t: now + 80, life: 560, big: true });
    rings.push({ x, y, t: now + 30, life: 220, stomp: true });
    if (reduced) return;
    const budget = parts.length > 300 ? 0.4 : 1;
    for (let i = 0; i < 12 * budget * big; i++) {          // sparks, hot and brief
      const a = Math.random() * 6.2832, sp = 2.2 + Math.random() * 4.5;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2,
        r: 1 + Math.random() * 1.3, life: 240 + Math.random() * 280, t: now,
        c: Math.random() < 0.5 ? "#FFD98A" : "#FFB35C", spark: true });
    }
    for (let i = 0; i < 9 * budget * big; i++) {           // chunks of whatever that was
      const a = Math.random() * 6.2832, sp = 1 + Math.random() * 2.6;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.6,
        r: 1.6 + Math.random() * 2.4, life: 420 + Math.random() * 380, t: now,
        c: mix(A, Math.random() < 0.5 ? "#FFFFFF" : "#22222E", 0.3),
        chunk: true, rot: Math.random() * 6.2832, vr: (Math.random() - 0.5) * 0.4 });
    }
    for (let i = 0; i < 6 * budget * big; i++) {           // smoke, late and slow
      const a = Math.random() * 6.2832;
      parts.push({ x: x + Math.cos(a) * S * 0.3, y: y + Math.sin(a) * S * 0.2,
        vx: (Math.random() - 0.5) * 0.5, vy: -0.4 - Math.random() * 0.5,
        r: 3 + Math.random() * 3.4, life: 640 + Math.random() * 520,
        t: now + 90 + Math.random() * 150,
        c: darkNow ? "#5A5870" : "#8E8CA0", smoke: true });
    }
  }

  // a collision is a small event: shove them two bodies apart, then blow
  // the surrounding cells outward from the point of contact
  function blast(x, y, now, mine) {
    explosionFx(x, y, PACKS[nearestZone(x)].accent, now, 1);
    if (!reduced) shake = 1;

    const R = S * 2.15, near = [];
    for (const c of cells) {
      if (c.st !== 0) continue;
      const d2 = (c.x - x) ** 2 + (c.y - y) ** 2;
