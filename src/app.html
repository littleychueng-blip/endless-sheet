    net.npcAt = now;
    netEvent({
      t: "n",
      a: npcs.map(n => [Math.round(n.x), Math.round(n.y), n.face >= 0 ? 1 : -1,
                        n.moving ? 1 : 0, Math.round(n.hop || 0)])
    });
  }

  // remote players are critters somebody else is steering
  function stepPeers(now, dt) {
    for (const [id, p] of net.peers) {
      if (now - p.seen > 12000) {
        if (p.duet) endDuet(p.duet);
        net.peers.delete(id); net.ids.delete(id); paintOnline();
        continue;
      }
      if (p.jail && now >= p.jail.until) p.jail = null;   // their sentence ends off screen too

      const e = Math.min(1, dt * 12);
      const ox = p.x, oy = p.y;
      p.x += (p.tx - p.x) * e;
      p.y += (p.ty - p.y) * e;
      p.hop += (p.thop - p.hop) * e;
      p.vx = dt > 0 ? (p.x - ox) / dt : 0;
      p.vy = dt > 0 ? (p.y - oy) / dt : 0;
      tick(p, dt, p.moving ? 1 : 0);
      // their feet flatten your sheet too — same footsteps, same cells
      if (p.moving) trample(p, now, S * 0.56, true, false);
    }
  }

  function drawPeerTags() {
    if (!net.peers.size) return;
    const fs = Math.max(9, Math.round(S * 0.2));
    g.font = `600 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const [, p] of net.peers) {
      if (!p.name || p.x < cam.x - S * 2 || p.x > cam.x + viewW + S * 2) continue;
      const y = p.y + p.hop - S * 1.05;
      const wide = g.measureText(p.name).width + fs * 1.5;
      rr(g, p.x - wide / 2, y - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.74);
      g.fill();
      g.fillStyle = rgba(darkNow ? "#ECECF4" : "#1A1A24", 0.92);
      g.fillText(p.name, p.x, y);
    }
  }

  function collide(now, hosting) {
    const w = walker;
    if (w.duet || w.jail) return;                      // hugging and caged are not colliding

    // bumping into a friend does the same thing as bumping into a wanderer.
    // The lower of the two ids owns the pair, so the bang happens once and
    // both of you see the same one.
    for (const [id, p] of net.peers) {
      if (p.duet || p.jail) continue;                  // a cage takes the hit for them
      const dx = p.x - w.x, dy = p.y - w.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const sep = S * 1.65;
      if (d > sep) continue;
      const ux = dx / d, uy = dy / d;
      w.x -= ux * ((sep - d) / 2 + S * 0.3);
      w.y -= uy * ((sep - d) / 2 + S * 0.3);
      w.kx -= ux * S * 7; w.ky -= uy * S * 7;
      if (p.cool > 0) continue;
      p.cool = 0.9;
      if (idNum(net.id) < idNum(id)) {
        const bx = (p.x + w.x) / 2, by = (p.y + w.y) / 2;
        blast(bx, by, now, true);
        netEvent({ t: "b", x: Math.round(bx), y: Math.round(by) });
      }
    }

    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (!n.placed) continue;
      const dx = n.x - w.x, dy = n.y - w.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const sep = S * 0.55 * (w.scale + n.scale) * 1.5;   // about two people apart
      if (d > sep) continue;

      const ux = dx / d, uy = dy / d;
      const push = (sep - d) / 2 + S * 0.3;
      n.x += ux * push; n.y += uy * push;
      w.x -= ux * push; w.y -= uy * push;

      const kick = S * 7;
      n.kx += ux * kick; n.ky += uy * kick;
      w.kx -= ux * kick; w.ky -= uy * kick;
      n.turn = 0.15;

      if (n.cool <= 0) {
        n.cool = 0.9;
        const bx = (n.x + w.x) / 2, by = (n.y + w.y) / 2;
        blast(bx, by, now, true);
        // the index rides along so the host can shove the same wanderer
        netEvent({ t: "b", x: Math.round(bx), y: Math.round(by), i });
      }
    }

    if (!hosting) return;
    for (let i = 0; i < npcs.length; i++) {             // wanderers just step around each other
      for (let j = i + 1; j < npcs.length; j++) {
        const a = npcs[i], b = npcs[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const sep = S * 0.9;
        if (d > sep) continue;
        const p = (sep - d) / 2, ux = dx / d, uy = dy / d;
        b.x += ux * p; b.y += uy * p;
        a.x -= ux * p; a.y -= uy * p;
      }
    }
  }

  /* ══ emotes, and what two of them together mean ══════════
     One tap puts a face over your head for two seconds and tells the room.
     If two people show the same face inside that window, the closest pair of
     them stops being two people standing near each other and starts being a
     scene: hearts hug, skulls throw hands. Every client works out the pair
     from the same events, and each one only drives its own body — so the two
     halves meet in the middle without anybody being in charge. */

  const EMO = ["❤️", "😭", "😠", "💀"];
  const EMO_MS = 2000;
  const BODY = S * 1.1;                      // one critter, shoulder to shoulder
  const DUET_REACH = BODY * 3;               // three of those apart, and no further
  const duets = [];

  function emote(k) {
    walker.emo = { k, t: performance.now() };
    netEvent({ t: "e", k });
    pairUp();
  }

  function bodies() {
    const list = [{ id: net.id || "me", b: walker }];
    for (const [id, p] of net.peers) list.push({ id, b: p });
    return list;
  }

  /* Pairing measures the freshest position we have, not the one on screen. A
     peer is drawn where the interpolation has got to, which trails what they
     actually told us by a frame or two — near the three-body line that is the
     difference between us pairing and them pairing, and half a hug is worse
     than none. Both machines reading the reported number keeps them agreeing. */
  const atX = b => (b.remote && b.placed) ? b.tx : b.x;
  const atY = b => (b.remote && b.placed) ? b.ty : b.y;

  function emoLive(now) {
    if (walker.emo && now - walker.emo.t < EMO_MS) return true;
    for (const [, p] of net.peers) if (p.emo && now - p.emo.t < EMO_MS) return true;
    return false;
  }

  function pairUp() {
    const now = performance.now();
    for (const kind of ["❤️", "💀"]) {
      const set = bodies().filter(o =>
        o.b.emo && o.b.emo.k === kind && now - o.b.emo.t < EMO_MS
        && !o.b.duet && !o.b.jail && o.b.placed !== 0);
      if (set.length < 2) continue;
      let best = null, bd = DUET_REACH;
      for (let i = 0; i < set.length; i++) {
        for (let j = i + 1; j < set.length; j++) {
          const a = set[i].b, b = set[j].b;
          const d = Math.hypot(atX(a) - atX(b), atY(a) - atY(b));
          if (d < bd) { bd = d; best = [a, b]; }
        }
      }
      if (best) startDuet(kind, best[0], best[1], now);
    }
  }

  function startDuet(kind, a, b, now) {
    const ax = atX(a), ay = atY(a), bx = atX(b), by = atY(b);
    const dx = bx - ax, dy = by - ay;
    const d = Math.hypot(dx, dy) || 1;
    const D = {
      kind, a, b, t0: now,
      cx: (ax + bx) / 2, cy: (ay + by) / 2,            // frozen, so it can't drift apart
      ux: dx / d, uy: dy / d,
      dur: kind === "❤️" ? 2200 : 2400, jab: 0
    };
    a.duet = D; b.duet = D;
    a.emo = b.emo = null;                              // the scene replaces the face
    duets.push(D);
  }

  function endDuet(D) {
    const i = duets.indexOf(D);
    if (i >= 0) duets.splice(i, 1);
    if (D.a) D.a.duet = null;
    if (D.b) D.b.duet = null;
  }

  // A scene that runs its course pays off; one cut short by somebody closing
  // their laptop does not. Every client reaches this line off the same events
  // at the same moment, so the payoff needs no message of its own.
  function finishDuet(D, now) {
    endDuet(D);
    if (D.kind === "❤️") heartBurst(D, now);
    else startDuel(D, now);
  }

  const APPROACH = 620;

  function stepDuets(now, dt) {
    for (let i = duets.length - 1; i >= 0; i--) {
      const D = duets[i];
      const e = now - D.t0;
      if (e > D.dur) { finishDuet(D, now); continue; }

      const gap = D.kind === "❤️" ? S * 0.58 : S * 1.25;
      const ease = easeOut(Math.min(1, e / APPROACH));

      // where each of them belongs this instant: their half of the gap, plus
      // however far into the other one they're leaning
      const L = D.kind === "💀" ? lunges(e) : ZERO2;
      drive(D.a, D.cx - D.ux * (gap / 2 - L[0]), D.cy - D.uy * (gap / 2 - L[0]), ease, dt);
      drive(D.b, D.cx + D.ux * (gap / 2 - L[1]), D.cy + D.uy * (gap / 2 - L[1]), ease, dt);

      D.a.face = D.ux >= 0 ? 1 : -1;                   // look at each other
      D.b.face = D.ux >= 0 ? -1 : 1;

      if (D.kind === "❤️") {
        if (!reduced && e > APPROACH && Math.random() < dt * 14) {
          parts.push({
            x: D.cx + (Math.random() - 0.5) * S * 0.8, y: D.cy - S * 0.4,
            vx: (Math.random() - 0.5) * 0.6, vy: -1.1 - Math.random(),
            r: 2.4 + Math.random() * 2, life: 700 + Math.random() * 400,
            t: now, c: "#EE6B8B", heart: true
          });
        }
      } else {
        // three landed punches, one every 400ms once they're in range
        const beat = Math.floor((e - APPROACH) / 400);
        if (beat >= 0 && beat < 3 && beat >= D.jab) {
          D.jab = beat + 1;
          punchFx(D, now, beat);
        }
      }
    }
  }

  // Three punches, one every 400ms, taking turns. Returns how far each of
  // the two is leaning into the other right now.
  const ZERO2 = [0, 0];
  function lunges(e) {
    const t = e - APPROACH;
    if (t < 0) return ZERO2;
    const beat = Math.floor(t / 400), phase = t % 400;
    if (beat > 2 || phase > 200) return ZERO2;
    const amt = Math.sin(phase / 200 * Math.PI) * S * 0.5;
    return beat % 2 === 0 ? [amt, 0] : [0, amt];
  }

  // only bodies this client owns get pushed; the peer's own machine is doing
  // the same sum for the other half
  function drive(b, x, y, ease, dt) {
    if (b.remote) return;
    b.vx = 0; b.vy = 0; b.kx = 0; b.ky = 0;
    const e = Math.min(1, dt * (6 + 16 * ease));
    b.x += (x - b.x) * e;
    b.y += (y - b.y) * e;
    b.step += dt * 9;
  }

  function punchFx(D, now, beat) {
    const s = beat % 2 ? -1 : 1;                       // +1: a hits b, -1: b hits a
    const hx = D.cx + D.ux * S * 0.3 * s, hy = D.cy + D.uy * S * 0.3 * s;
    const target = beat % 2 ? D.a : D.b;
    if (!target.remote) {                              // their own machine rocks them back
      target.kx += D.ux * S * 5 * s;
      target.ky += D.uy * S * 5 * s;
      target.hopV = Math.min(target.hopV, -S * 1.4);
    }
    rings.push({ x: hx, y: hy, t: now, life: 300, stomp: true });
    if (!reduced) {
      shake = Math.max(shake, 0.55);
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * 6.2832, sp = 1 + Math.random() * 2.4;
        parts.push({
          x: hx, y: hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
          r: 1.4 + Math.random() * 2, life: 300 + Math.random() * 240,
          t: now, c: "#F0C24B"
        });
      }
    }
    boom((hx - cam.x) * k);
  }

  /* ══ what a hug leaves behind ════════════════════════════
     Two hearts don't just hug, they go off: a pink front travels out from the
     spot they were standing on and takes the sheet with it. Same shockfront the
     slap uses, so it lands on the same cells on every screen. */

  const HEART_C = "#EE6B8B";
  const HEART_R = BODY * 9, HEART_MS = 720;
  const waves = [];

  function heartBurst(D, now) {
    const cx = D.cx, cy = D.cy;
    const mine = !D.a.remote || !D.b.remote;         // one of them is me
    waves.push({ x: cx, y: cy, t0: now, R: HEART_R, ms: HEART_MS,
                 r: 0, ring: 0, n: 0, mine, tint: HEART_C });
    heartBloom((cx - cam.x) * k);
    flash = { x: cx, y: cy, t: now, c: HEART_C };
    if (!reduced) {
      shake = Math.max(shake, 1.2);
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * 6.2832, sp = 1.6 + Math.random() * 4.2;
        parts.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
          r: 2.4 + Math.random() * 2.4, life: 700 + Math.random() * 500,
          t: now, c: HEART_C, heart: true
        });
      }
    }
    // it knocks over everyone standing near — except the two it came out of
    for (const b of [walker, ...npcs, ...net.peers.values()]) {
      if (b === D.a || b === D.b) continue;
      const d = Math.hypot(b.x - cx, b.y - cy);
      const fall = Math.max(0, 1 - d / HEART_R);
      if (fall <= 0) continue;
      b.hopV = Math.min(b.hopV, -S * (2.2 + 3 * fall));
      b.kx += (b.x - cx) / (d || 1) * S * 4 * fall;
      b.ky += (b.y - cy) / (d || 1) * S * 2.4 * fall;
    }
  }

  function stepWaves(now) {
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      const p = Math.min(1, (now - w.t0) / w.ms);
      crossWave(w, w.R * easeOut(p), now, 3, w.tint);
      if (p < 1) continue;
      countEl.textContent = fmt(pops);                 // the quiet ones never touched it
      store.set("pops", pops); store.set("exp", exp);
      if (w.mine) { addXp(30); toast(w.n + " caught in it"); }
      waves.splice(i, 1);
    }
  }

  /* ══ what two skulls start ═══════════════════════════════
     Ten seconds from the moment they break apart, both of them popping as fast
     as they can. Whoever pops less is locked on the spot for ten more. Each
     side counts its own and says the number out loud four times a second;
     both machines then compare the same two numbers, so both agree on who goes
     in without anybody refereeing it. */

  const DUEL_MS = 10000, JAIL_MS = 10000, DUEL_GRACE = 500;
  let duel = null;

  function startDuel(D, now) {
    const pair = [D.a, D.b];
    for (const b of pair) b.duelPops = 0;
    duel = { t0: now, pair, me: pair.find(b => !b.remote) || null, sentAt: 0, told: 0 };
    if (duel.me) toast("Ten seconds — fewest pops gets locked up");
    boom((D.cx - cam.x) * k);
  }

  function stepDuel(now) {
    if (!duel) return;
    const e = now - duel.t0;

    if (e < DUEL_MS) {
      if (duel.me && now - duel.sentAt > 250) {        // say your number out loud
        duel.sentAt = now;
        netEvent({ t: "d", s: duel.me.duelPops | 0 });
      }
      return;
    }
    if (!duel.told) {                                  // time — one last honest number,
      duel.told = now;                                 // sent whether or not one is due
      if (duel.me) netEvent({ t: "d", s: duel.me.duelPops | 0 });
      return;
    }
    if (now - duel.told < DUEL_GRACE) return;          // …and time for theirs to land

    const [a, b] = duel.pair;
    const sa = a.duelPops | 0, sb = b.duelPops | 0;
    if (sa === sb) {
      if (duel.me) toast("Dead heat at " + sa + " — nobody goes in");
    } else {
      lockUp(sa < sb ? a : b, Math.abs(sa - sb), now, duel.me);
    }
    duel = null;
  }

  function lockUp(b, margin, now, mine) {
    b.jail = { t0: now, until: now + JAIL_MS };
    b.jx = b.x; b.jy = b.y;                            // the spot it closes around
    b.kx = b.ky = 0;
    rings.push({ x: b.x, y: b.y, t: now, life: 620, big: true });
    if (!reduced) shake = Math.max(shake, 0.8);
    clang((b.x - cam.x) * k);
    if (!b.remote) toast("Locked up — lost by " + margin);
    else if (mine) toast("Won by " + margin + " — " + (b.name || "they") + " is in");
  }

  // a cage dropping onto stone
  function clang(x) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = ac.currentTime + 0.001;
      tone(t, { from: 92, to: 48, sweep: 0.18, gain: 0.7, a: 0.004, d: 0.4 });
      crack(t, { type: "bandpass", freq: 2400, q: 3, gain: 0.55, knee: 0.3, d: 0.09 });
      crack(t + 0.02, { type: "bandpass", freq: 3600, q: 5, gain: 0.3, knee: 0.2, d: 0.22 });
      burst(t + 0.04, { type: "lowpass", freq: 700, q: 1, gain: 0.3, d: 0.26 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  // over each duellist: what they're on, and how long they have
  function drawDuel(now) {
    if (!duel) return;
    const left = Math.max(0, DUEL_MS - (now - duel.t0));
    const fs = Math.max(10, Math.round(S * 0.28));
    g.font = `700 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const b of duel.pair) {
      if (b.x < cam.x - S * 2 || b.x > cam.x + viewW + S * 2) continue;
      const label = (b.duelPops | 0) + (b === duel.me ? "   " + Math.ceil(left / 1000) + "s" : "");
      const wide = g.measureText(label).width + fs * 1.3;
      const y = b.y + (b.hop || 0) - S * 1.95;
      rr(g, b.x - wide / 2, y - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#1B1B24" : "#FFFFFF", 0.88);
      g.fill();
      g.strokeStyle = rgba("#E5484D", 0.55);
      g.lineWidth = 1.2;
      g.stroke();
      g.fillStyle = darkNow ? "#FFD9DA" : "#B4242A";
      g.fillText(label, b.x, y);
    }
  }

  // two rails and five bars, slammed down over whoever lost
  function drawCages(now) {
    for (const b of [walker, ...net.peers.values()]) {
      if (!b.jail) continue;
      const left = b.jail.until - now;
      if (left <= 0) { b.jail = null; continue; }
      if (b.x < cam.x - S * 3 || b.x > cam.x + viewW + S * 3) continue;

      const u = S * 0.55 * (b.scale || 1);
      const halfW = u * 1.3, top = -u * 2.3, bot = u * 1.2;
      const drop = Math.min(1, (now - b.jail.t0) / 260);

      g.save();
      g.translate(b.x, b.y);
      g.fillStyle = rgba("#000000", darkNow ? 0.34 : 0.15);
      g.beginPath(); g.ellipse(0, bot, halfW * 1.05, u * 0.2, 0, 0, 6.2832); g.fill();

      g.save();
      g.translate(0, -(1 - drop) * VH * 0.6);          // comes down from off screen
      g.globalAlpha = 0.94;
      g.strokeStyle = darkNow ? "#A6A6BA" : "#494958";
      g.lineCap = "round";
      g.lineWidth = Math.max(1.6, S * 0.05);
      for (let i = 0; i <= 3; i++) {                   // four, so the face sits in a gap
        const bx = -halfW + halfW * 2 * (i / 3);
        g.beginPath(); g.moveTo(bx, top); g.lineTo(bx, bot); g.stroke();
      }
      g.lineWidth = Math.max(2.2, S * 0.075);
      for (const ry of [top, top + (bot - top) * 0.52, bot]) {
        g.beginPath(); g.moveTo(-halfW, ry); g.lineTo(halfW, ry); g.stroke();
      }
      g.restore();

      const fs = Math.max(9, Math.round(S * 0.26));    // the countdown, on the floor
      g.font = `700 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const t = Math.ceil(left / 1000) + "s";
      const wide = g.measureText(t).width + fs * 1.4;
      const ty = bot + u * 0.72;
      rr(g, -wide / 2, ty - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.88);
      g.fill();
      g.strokeStyle = rgba("#E5484D", 0.5);
      g.lineWidth = 1.2;
      g.stroke();
      g.fillStyle = "#E5484D";
      g.fillText(t, 0, ty);
      g.restore();
    }
  }

  // the face over your head, and the hearts over a hug
  function drawEmotes(now) {
    const list = [walker, ...net.peers.values()];
    const size = S * 0.66;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = size + `px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    for (const b of list) {
      if (!b.emo) continue;
      const e = now - b.emo.t;
      if (e > EMO_MS) { b.emo = null; continue; }
      if (b.x < cam.x - S * 2 || b.x > cam.x + viewW + S * 2) continue;
      const p = e / EMO_MS;
      const pop = p < 0.16 ? easeOut(p / 0.16) : 1;
      const y = b.y + b.hop - S * 1.62 - pop * S * 0.16;
      g.globalAlpha = p > 0.82 ? (1 - p) / 0.18 : 1;
      g.fillStyle = rgba(darkNow ? "#0C0C11" : "#FFFFFF", 0.55);
      g.beginPath();
      g.ellipse(b.x, y + size * 0.06, size * 0.62, size * 0.58, 0, 0, 6.2832);
      g.fill();
      g.fillText(b.emo.k, b.x, y);
      g.globalAlpha = 1;
    }
  }

  function drawCritter(w) {
    const L = w.look || look;          // remote players wear their own
    const u = S * 0.55 * w.scale;
    // the player is the opposite of the ground, so it separates from any
    // sheet; the wanderers sit in between and read as background life
    const dressed = w.belt && BODIES[L.body];
    const body = !w.belt ? (darkNow ? "#9C9AB0" : "#77758A")
      : dressed || (darkNow ? "#F2F1F8" : "#22222E");
    const face = dressed ? "#1B1B26"
      : (w.belt ? (darkNow ? "#22222E" : "#F2F1F8") : "#1C1C26");
    const spd = Math.min(1, Math.hypot(w.vx, w.vy) / (S * 3.1));
    const gait = Math.sin(w.step);
    const bob = gait * u * 0.07 * (0.4 + spd);
    const sq = 1 + Math.sin(w.step * 2) * 0.05 * spd;
    const bw = u * 0.76 / sq, bh = u * 0.84 * sq;

    g.save();
    g.translate(w.x, w.y);

    // the shadow stays on the ground and shrinks with altitude
    const air = Math.min(1, -w.hop / (S * 2.2));
    g.fillStyle = rgba("#000000", (darkNow ? 0.36 : 0.18) * (1 - air * 0.55));
    g.beginPath();
    g.ellipse(0, u * 1.1, u * (0.54 - air * 0.2), u * (0.13 - air * 0.05), 0, 0, 6.2832);
    g.fill();
    g.translate(0, w.hop);

    // mid-scene, lean into whoever you're hugging or hitting
    const D = w.duet;
    if (D) g.rotate((D.a === w ? 1 : -1) * (D.ux >= 0 ? 1 : -1) * (D.kind === "❤️" ? 0.17 : 0.1));

    g.fillStyle = body;
    for (const s of [-1, 1]) {                       // feet, tucked under the body
      const lift = Math.max(0, gait * s) * u * 0.3 * spd;
      g.beginPath();
      g.ellipse(s * u * 0.34, u * 0.96 + bob * 0.25 - lift, u * 0.22, u * 0.14, 0, 0, 6.2832);
      g.fill();
    }

    g.translate(0, bob);

    if (w.belt) {
      // arms swing against the legs — unless they're busy holding somebody
      const hugX = D && D.kind === "❤️" ? w.face * u * 0.32 : 0;
      for (const s of [-1, 1]) {
        const swing = Math.max(0, -gait * s) * u * 0.14 * spd;
        g.beginPath();
        g.ellipse(s * (bw + u * 0.04) + hugX, u * 0.16 - swing - (hugX ? u * 0.16 : 0),
          u * 0.125, u * 0.17, 0, 0, 6.2832);
        g.fill();
      }
    } else {
      g.strokeStyle = body; g.lineWidth = u * 0.07;  // wanderers get an antenna instead
      g.beginPath(); g.moveTo(0, -bh * 0.9); g.lineTo(0, -bh - u * 0.2); g.stroke();
      g.fillStyle = rgba(pack.accent, 0.9);
      g.beginPath(); g.arc(0, -bh - u * 0.29, u * 0.11, 0, 6.2832); g.fill();
      g.fillStyle = body;
    }

    rr(g, -bw, -bh, bw * 2, bh * 2, u * 0.52);
    g.fillStyle = body; g.fill();
    g.strokeStyle = rgba(face, 0.22); g.lineWidth = u * 0.07; g.stroke();

    if (w.belt) {                                    // a belt in the material's colour
      g.save();
      g.clip();
      g.fillStyle = rgba(pack.accent, 0.95);
      g.fillRect(-bw, u * 0.24, bw * 2, u * 0.17);
      g.restore();
    }

    if (w.belt && L.hat !== "none") drawHat(u, bw, bh, w.face, L);

    const ex = w.face * u * 0.1, open = w.blink < 0 ? 0.16 : 1;
    const eyes = w.belt ? L.eyes : "dots";
    g.fillStyle = face;
    g.strokeStyle = face;
    g.lineCap = "round";

    if (eyes === "happy" || eyes === "sleepy") {
      const up = eyes === "happy";
      g.lineWidth = u * 0.075;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.arc(ex + s * u * 0.26, -u * (up ? 0.15 : 0.27), u * 0.13,
          up ? Math.PI * 1.14 : Math.PI * 0.14, up ? Math.PI * 1.86 : Math.PI * 0.86);
        g.stroke();
      }
    } else {
      const big = eyes === "wide";
      const rx = u * (big ? 0.145 : 0.11), ry = u * (big ? 0.175 : 0.135) * open;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.ellipse(ex + s * u * (big ? 0.28 : 0.25), -u * 0.2, rx, ry, 0, 0, 6.2832);
        g.fill();
      }
      if (open === 1) {                              // catchlights
        g.fillStyle = dressed ? "#FFFFFF" : body;
        for (const s of [-1, 1]) {
          g.beginPath();
          g.arc(ex + s * u * (big ? 0.28 : 0.25) + u * 0.045, -u * 0.25, u * (big ? 0.045 : 0.035), 0, 6.2832);
          g.fill();
        }
      }
    }

    g.restore();
  }

  // hats sit on the head, in the material's colour
  function drawHat(u, bw, bh, dir, L) {
    L = L || look;
    const A = pack.accent;
    g.fillStyle = A;
    g.strokeStyle = A;

    if (L.hat === "cap") {
      g.beginPath(); g.arc(0, -bh * 0.5, bw * 0.94, Math.PI, 0); g.fill();
      g.beginPath();
      g.ellipse((dir >= 0 ? 1 : -1) * bw * 0.72, -bh * 0.48, bw * 0.62, u * 0.1, 0, 0, 6.2832);
      g.fill();
    } else if (L.hat === "bow") {
      const bx = -bw * 0.5, by = -bh * 0.86;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(bx + s * u * 0.28, by - u * 0.17);
        g.lineTo(bx + s * u * 0.28, by + u * 0.17);
        g.closePath(); g.fill();
      }
      g.beginPath(); g.arc(bx, by, u * 0.085, 0, 6.2832); g.fill();
    } else if (L.hat === "crown") {
      const cy = -bh * 0.74, cw = bw * 0.72, ch = u * 0.46;   // points must clear the head
      g.beginPath();
      g.moveTo(-cw, cy);
      g.lineTo(-cw * 0.56, cy - ch);
      g.lineTo(-cw * 0.19, cy - ch * 0.34);
      g.lineTo(0, cy - ch * 1.18);
      g.lineTo(cw * 0.19, cy - ch * 0.34);
      g.lineTo(cw * 0.56, cy - ch);
      g.lineTo(cw, cy);
      g.closePath(); g.fill();
    } else if (L.hat === "phones") {
      g.lineWidth = u * 0.11;
      g.beginPath(); g.arc(0, -bh * 0.3, bw * 1.02, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      for (const s of [-1, 1]) {
        rr(g, s * bw * 1.02 - u * 0.12, -bh * 0.42, u * 0.24, u * 0.34, u * 0.1);
        g.fill();
      }
    }
  }

  /* ══ bridges ═════════════════════════════════════════════ */

  // Wood palette shared by both passes
  const wood = () => ({
    deckTop: darkNow ? "#3B3125" : "#CBAE85",
    deckMid: darkNow ? "#2E261C" : "#B8975F",
    deckLow: darkNow ? "#221B14" : "#9A7C54",
    beam:    darkNow ? "#6C5B47" : "#7C6242",
    beamLit: darkNow ? "#8A7660" : "#A2825A",
    dark:    darkNow ? "#0B0908" : "#6B5334"
  });

  function eachBridge(fn) {
    const b = BAND(), y0 = VH / 2 - b, y1 = VH / 2 + b;
    const vx0 = cam.x - S, vx1 = cam.x + viewW + S;
    for (let i = 1; i < PACKS.length; i++) {
      const x0 = zoneEnd(i - 1), x1 = zoneStart(i);
      if (x1 < vx0 || x0 > vx1) continue;
      fn(i, x0, x1, y0, y1);
    }
  }

  // A railing: top beam, posts, a mid rail, and cross-bracing below the beam.
  // `dir` is -1 for the far side (bracing hangs down into the deck) and +1 for
  // the near side, so both read as standing on the deck.
  function railing(x0, x1, y, dir) {
    const W_ = wood();
    const post = S * 0.7 * dir;                  // far rail rises up, near rail drops toward you
    const step = S * 1.5;

    g.strokeStyle = rgba(W_.dark, 0.5);          // bracing
    g.lineWidth = Math.max(1, S * 0.028);
    for (let x = x0; x < x1 - step; x += step) {
      g.beginPath();
      g.moveTo(x, y); g.lineTo(Math.min(x + step, x1), y + post);
      g.moveTo(Math.min(x + step, x1), y); g.lineTo(x, y + post);
      g.stroke();
    }

    g.strokeStyle = rgba(W_.beam, 0.9);          // mid rail
    g.lineWidth = Math.max(1.5, S * 0.04);
    g.beginPath(); g.moveTo(x0, y + post * 0.52); g.lineTo(x1, y + post * 0.52); g.stroke();

    g.fillStyle = W_.beam;                       // posts
    const pw = Math.max(2, S * 0.075);
    for (let x = x0; x <= x1 + 1; x += step) {
      const px = Math.min(x, x1);
      g.fillRect(px - pw / 2, Math.min(y, y + post), pw, Math.abs(post));
    }

    g.strokeStyle = W_.beamLit;                  // top beam
    g.lineWidth = Math.max(2.5, S * 0.085);
    g.lineCap = "round";
    g.beginPath(); g.moveTo(x0, y + post); g.lineTo(x1, y + post); g.stroke();
    g.lineCap = "butt";

    g.strokeStyle = rgba(W_.dark, 0.85);         // deck edge
    g.lineWidth = Math.max(2, S * 0.06);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  }

  // Behind the critters: deck, planks, far railing, the barrier itself
  function drawBridgeBack() {
    eachBridge((i, x0, x1, y0, y1) => {
      const W_ = wood();

      const deck = g.createLinearGradient(0, y0, 0, y1);
      deck.addColorStop(0, W_.deckTop);
      deck.addColorStop(0.5, W_.deckMid);
      deck.addColorStop(1, W_.deckLow);
      g.fillStyle = deck;
      g.fillRect(x0, y0, x1 - x0, y1 - y0);

      g.strokeStyle = rgba(W_.dark, 0.4);                       // planks
      g.lineWidth = 1;
      for (let x = x0 + S * 0.3; x < x1; x += S * 0.52) {
        g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
      }

      const sh = g.createLinearGradient(0, y1, 0, y1 + S * 0.8);  // shadow into the void
      sh.addColorStop(0, rgba("#000000", darkNow ? 0.5 : 0.22));
      sh.addColorStop(1, rgba("#000000", 0));
      g.fillStyle = sh;
      g.fillRect(x0, y1, x1 - x0, S * 0.8);

      railing(x0, x1, y0, -1);                                  // far side

      if (!locked(i)) return;
      const gx = gateX(i), A = PACKS[i].accent;
      g.strokeStyle = rgba(A, 0.95);
      g.lineWidth = Math.max(3, S * 0.11);
      g.setLineDash([S * 0.2, S * 0.15]);
      g.beginPath(); g.moveTo(gx, y0 - S * 0.8); g.lineTo(gx, y1 + S * 0.8); g.stroke();
      g.setLineDash([]);
    });
  }

  // In front of the critters: near railing, then the gate sign on top of all
  function drawBridgeFront() {
    eachBridge((i, x0, x1, y0, y1) => {
      railing(x0, x1, y1, 1);

      if (!locked(i)) return;
      const gx = gateX(i), A = PACKS[i].accent;
      g.fillStyle = rgba(darkNow ? "#E8E6F0" : "#22222E", 0.92);
      for (const py of [y0 - S * 0.8, y1 + S * 0.8]) {
        g.beginPath(); g.arc(gx, py, S * 0.09, 0, 6.2832); g.fill();
      }

      const line1 = PACKS[i].name.toUpperCase();
      const line2 = "LV " + PACKS[i].unlock + " TO UNLOCK";
      const fs = Math.max(9, Math.round(S * 0.23));
      g.font = `600 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const wide = Math.max(g.measureText(line1).width, g.measureText(line2).width) + fs * 2.4;
      const ty = y0 - S * 2;
      rr(g, gx - wide / 2, ty - fs * 1.9, wide, fs * 3.8, fs * 1.9);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.92);
      g.fill();
      g.strokeStyle = rgba(A, 0.55);
      g.lineWidth = 1.5;
      g.stroke();
      g.fillStyle = rgba(A, 1);
      g.fillText(line1, gx, ty - fs * 0.62);
      g.fillStyle = rgba(darkNow ? "#ECECF4" : "#1A1A24", 0.8);
      g.fillText(line2, gx, ty + fs * 0.68);
    });
  }

  /* ══ draw ════════════════════════════════════════════════ */

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  let prevT = performance.now();

  function frame() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - prevT) / 1000);
    prevT = now;

    const hosting = isHost();
    // whoever inherits the room inherits the wanderers: pull them into the
    // zone you're actually standing in, or they'd stay where the last host left
    if (hosting !== net.wasHost) { net.wasHost = hosting; if (hosting) fitNpcs(); }

    if (walker.on) stepWalker(now, dt);
    if (hosting) { for (const n of npcs) stepNpc(n, now, dt); }
    else { for (const n of npcs) stepNpcRemote(n, now, dt); }
    stepPeers(now, dt);
    // a pair can come together a beat after the second face goes up — positions
    // land twelve times a second, so keep looking while the faces are still up
    if (emoLive(now)) pairUp();
    stepDuets(now, dt);
    if (walker.on) collide(now, hosting);
    stepSlap(now);
    stepWaves(now);
    stepDuel(now);
    netSend(false);
    if (hosting) netNpcs();

    // the camera trails the walker down the strip
    const focus = walker.on ? walker.x : cam.x + viewW / 2;
    const target = Math.min(Math.max(focus - viewW / 2, 0), Math.max(0, worldW - viewW));
    cam.x += (target - cam.x) * Math.min(1, dt * 7);

    g.clearRect(0, 0, W, H);
    g.save();
    g.scale(k, k);                            // world units from here down
    let ox = -cam.x, oy = 0;
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 4.5);
      const m = S * 0.17 * shake * shake;
      ox += (Math.random() - 0.5) * m;
      oy += (Math.random() - 0.5) * m;
    }
    g.translate(ox, oy);

    drawBridgeBack();

    const half = S * sprScale / 2;
    const vx0 = cam.x - S, vx1 = cam.x + viewW + S;

    for (const c of cells) {
      // The whole sheet keeps its clock, on screen or not. A cell somebody
      // popped three zones away has to be as far along when you walk up to it
      // as it is on their screen — if it only started counting once you looked,
      // the two of you would be standing in different worlds.
      let e = now - c.t;
      if (c.st === 1 && e > POP_MS) { c.st = 2; c.t = now; e = 0; }
      else if (c.st === 2 && e > c.wait) { c.st = 3; c.t = now; e = 0; }
      else if (c.st === 3 && e > INFLATE_MS) { c.st = 0; c.t = now; e = 0; }

      if (c.x < vx0 || c.x > vx1) continue;   // clocked everywhere, drawn only in shot

      if (c.st !== 0) g.drawImage(sockets[c.z], c.x - half, c.y - half, S * sprScale, S * sprScale);

      let sc = 1, al = 1;
      if (c.st === 1) {
        const p = Math.min(1, e / POP_MS);
        sc = 1 + easeOut(p) * (PACKS[c.z].shape === "cap" ? -0.22 : 0.42);
        al = 1 - p * p;
      } else if (c.st === 2) {
        continue;
      } else if (c.st === 3) {
        const p = Math.min(1, e / INFLATE_MS);
        const el = reduced ? p : 1 - Math.pow(2, -9 * p) * Math.cos(p * 11);
        sc = 0.24 + el * 0.76;
        al = Math.min(1, p * 3);
      }

      const d = S * sprScale * sc;
      g.globalAlpha = al;
      g.drawImage(sprites[c.z], c.x - d / 2, c.y - d / 2, d, d);
      g.globalAlpha = 1;
    }

    // the dent a stomp leaves, fading out of the ground
    for (let i = dents.length - 1; i >= 0; i--) {
      const q = dents[i], p = (now - q.t) / q.life;
      if (p >= 1) { dents.splice(i, 1); continue; }
      const rad = S * (0.45 + p * 0.5);
      const dg = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, rad);
      dg.addColorStop(0, rgba("#000000", (1 - p) * (darkNow ? 0.34 : 0.16)));
      dg.addColorStop(1, rgba("#000000", 0));
      g.fillStyle = dg;
      g.fillRect(q.x - rad, q.y - rad, rad * 2, rad * 2);
    }

    // everything past the barrier fades out — visible enough to want, dim
    // enough to read as not yours yet
    for (let i = 1; i < PACKS.length; i++) {
      if (!locked(i)) continue;
      const x0 = gateX(i);
      if (x0 > vx1) break;
      const gc = darkNow ? "#0C0C11" : "#E2E1E9";
      const fade = bridgeW * 1.1;
      const vg = g.createLinearGradient(x0, 0, x0 + fade, 0);
      vg.addColorStop(0, rgba(gc, 0));
      vg.addColorStop(1, rgba(gc, 0.7));
      g.fillStyle = vg;
      g.fillRect(x0, 0, fade, VH);
      g.fillStyle = rgba(gc, 0.7);
      g.fillRect(x0 + fade, 0, Math.max(0, worldW - x0 - fade), VH);
      break;
    }

    for (const n of npcs) if (n.placed) drawCritter(n);
    for (const [, p] of net.peers) drawCritter(p);
    if (walker.on) drawCritter(walker);
    drawCages(now);                           // bars go in front of whoever is behind them
    drawPeerTags();
    drawEmotes(now);
    drawDuel(now);
    drawBridgeFront();

    // rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i], p = (now - r.t) / r.life;
      if (p >= 1) { rings.splice(i, 1); continue; }
      if (p < 0) continue;                                  // staggered blast ring, not due yet
      // a wave ring is already out at the front of the shock and only widens
      // a little; the rest grow from nothing
      const rad = r.wave ? r.wave + easeOut(p) * S * 1.1
        : S * (r.big ? 0.3 + easeOut(p) * 2.5
          : r.stomp ? 0.28 + easeOut(p) * 1.45
          : 0.34 + easeOut(p) * 0.8);
      g.beginPath();
      g.arc(r.x, r.y, rad, 0, 6.2832);
      g.strokeStyle = rgba(r.c || PACKS[nearestZone(r.x)].accent,
        (1 - p) * (r.wave ? 0.55 : r.big ? 0.8 : r.stomp ? 0.9 : 0.5));
      g.lineWidth = (r.wave ? 6 : r.big ? 4 : r.stomp ? 5 : 2) * (1 - p) + 0.4;
      g.stroke();
    }

    if (flash) {
      const p = (now - flash.t) / 300;
      if (p >= 1) flash = null;
      else {
        const rad = S * 2.8, fc = flash.c || pack.accent;
        const fg = g.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, rad);
        fg.addColorStop(0, rgba(fc, (1 - p) * 0.42));
        fg.addColorStop(1, rgba(fc, 0));
        g.fillStyle = fg;
        g.fillRect(flash.x - rad, flash.y - rad, rad * 2, rad * 2);
      }
    }

    // shards
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i], p = (now - q.t) / q.life;
      if (p >= 1) { parts.splice(i, 1); continue; }
      q.x += q.vx; q.y += q.vy;
      q.vy += q.heart ? -0.012 : q.soft ? 0.02 : 0.08;   // hearts rise, dust hangs, shards fall
      q.vx *= q.soft ? 0.94 : 0.985;
      q.vy *= q.soft ? 0.94 : 0.985;
      const rad = q.r * (q.soft ? 1 + p * 0.9 : 1 - p * 0.6);
      g.fillStyle = rgba(q.c, (1 - p) * (q.heart ? 0.9 : q.soft ? 0.3 : 0.72));
      if (q.heart) {
        const s = rad * 1.5;
        g.beginPath();
        g.moveTo(q.x, q.y + s * 0.9);
        g.bezierCurveTo(q.x - s * 1.6, q.y - s * 0.35, q.x - s * 0.5, q.y - s * 1.25, q.x, q.y - s * 0.35);
        g.bezierCurveTo(q.x + s * 0.5, q.y - s * 1.25, q.x + s * 1.6, q.y - s * 0.35, q.x, q.y + s * 0.9);
        g.fill();
      } else {
        g.beginPath();
        g.arc(q.x, q.y, rad, 0, 6.2832);
        g.fill();
      }
    }

    // last, so it covers everything: you don't see the shockwave through a hand
    drawSlap(now);

    g.restore();
    requestAnimationFrame(frame);
  }

  /* ══ input ═══════════════════════════════════════════════ */

  /* There is no joystick any more. Put a finger down anywhere and drag: the
     point you touched becomes the centre and the character walks the way you
     pull. Let go without dragging and it was a tap, so that still pops the
     bubble you meant to pop. */

  let hinted = false;
  const REACH = 78;                        // screen pixels from the touch to full tilt
  const SLOP = 11;                         // and how far you can wander before it's a drag

  cvs.addEventListener("pointerdown", e => {
    audio();
    if (ac.state === "suspended") ac.resume();
    if (stick.id !== null) return;         // one finger drives; the rest are ignored
    stick.id = e.pointerId;
    stick.ox = e.clientX; stick.oy = e.clientY;
    stick.moved = false;
    cvs.setPointerCapture(e.pointerId);
    if (!walker.on) hit(e.clientX, e.clientY);
  });

  cvs.addEventListener("pointermove", e => {
    if (stick.id !== e.pointerId) return;
    if (!walker.on) {                      // no character: a drag is a pop trail again
      const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const p of pts) hit(p.clientX, p.clientY);
      return;
    }
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
    if (!stick.moved && Math.hypot(dx, dy) < SLOP) return;   // still could be a tap
    stick.moved = true;
    dx /= REACH; dy /= REACH;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    stick.dx = dx; stick.dy = dy;
  });

  const release = e => {
    if (stick.id !== e.pointerId) return;
    if (walker.on && !stick.moved) hit(stick.ox, stick.oy);
    stick.id = null; stick.dx = stick.dy = 0; stick.moved = false;
  };
  cvs.addEventListener("pointerup", release);
  cvs.addEventListener("pointercancel", release);
  cvs.addEventListener("contextmenu", e => e.preventDefault());

  /* keys: arrows and WASD steer, everything else pops —
     which is the whole joke of the switch packs */
  const STEER = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };
  const held = new Set();

  function steer() {
    let x = 0, y = 0;
    for (const k of held) { x += STEER[k][0]; y += STEER[k][1]; }
    const m = Math.hypot(x, y);
    keyVec.x = m ? x / m : 0;
    keyVec.y = m ? y / m : 0;
  }

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.key === "Tab") return;
    if (e.target.closest && e.target.closest("#vol, #panel, #controls, #emo, #slap")) return;
    // Shift must return before the pop-a-random-cell fallback below, or simply
    // holding it to run would machine-gun the sheet
    if (e.key === "Shift") { running = true; return; }
    const k = e.key.toLowerCase();
    if (walker.on && STEER[k]) {
      e.preventDefault();
      if (!held.has(k)) { held.add(k); steer(); }
      audio();
      return;
    }
    if (k === "f") { audio(); fireSlap(); return; }
    if (e.key === " ") e.preventDefault();
    audio();
    const live = cells.filter(c => c.st === 0);
    if (!live.length) return;
    const c = live[(Math.random() * live.length) | 0];
    popCell(c, performance.now());
    netEvent({ t: "p", i: c.idx });
  });

  addEventListener("keyup", e => {
    if (e.key === "Shift") { running = false; return; }
    const k = e.key.toLowerCase();
    if (held.delete(k)) steer();
  });
  addEventListener("blur", () => { held.clear(); steer(); running = false; });

  /* ══ chrome ══════════════════════════════════════════════ */

  const mapEl = document.getElementById("map");
  const tagEl = document.getElementById("tag");
  const nameEl = document.getElementById("packname");

  // You change material by walking into it, so the tray is a map now: it
  // shows where you are, what's open, and what the next one costs.
  function paintMap() {
    mapEl.textContent = "";
    for (let i = 0; i < PACKS.length; i++) {
      if (i) {
        const l = document.createElement("s");
        l.className = "link" + (locked(i) ? "" : " open");
        l.style.setProperty("--c", PACKS[i].accent);
        mapEl.appendChild(l);
      }
      // unlocked zones are buttons you can travel to; locked ones are inert
      const shut = locked(i);
      const n = document.createElement(shut ? "i" : "button");
      n.className = "node" + (shut ? "" : " open") + (i === zone ? " here" : "");
      n.style.setProperty("--c", PACKS[i].accent);
      n.textContent = shut ? String(PACKS[i].unlock) : "";
      n.title = shut ? PACKS[i].name + " — LV " + PACKS[i].unlock : "Travel to " + PACKS[i].name;
      if (!shut) {
        n.type = "button";
        n.setAttribute("aria-label", "Travel to " + PACKS[i].name);
        n.addEventListener("click", () => { audio(); teleport(i); });
      }
      mapEl.appendChild(n);
    }
  }

  // step through the map instead of walking it
  function teleport(i) {
    const w = walker;
    if (w.duet) endDuet(w.duet);
    w.x = zoneStart(i) + zoneW / 2;
    w.y = VH / 2;
    w.vx = w.vy = w.kx = w.ky = 0;
    w.hop = w.hopV = 0;
    cam.x = Math.min(Math.max(w.x - viewW / 2, 0), Math.max(0, worldW - viewW));   // snap, don't scroll the world
    enterZone(i);
    rings.push({ x: w.x, y: w.y, t: performance.now(), life: 520, big: true });
  }

  function enterZone(z) {
    zone = z;
    pack = PACKS[z];
    store.set("pack", pack.id);
    document.documentElement.style.setProperty("--accent", pack.accent);
    nameEl.textContent = pack.name.toLowerCase();
    const label = pack.name + " · " + pack.tag;
    if (tagEl.textContent === label) {                 // same zone: no pointless flicker
      tagEl.style.opacity = "1";
    } else {
      tagEl.style.opacity = "0";
      setTimeout(() => { tagEl.textContent = label; tagEl.style.opacity = "1"; }, 180);
    }
    droneTune();                             // the pad follows the material
    fitNpcs();
    paintMap();
  }

  /* ── setup panel ────────────────────────────────────── */

  const slapEl = document.getElementById("slap");

  function paintSlap() {
    const p = slapCharge / SLAP_AT;
    slapEl.style.setProperty("--p", p.toFixed(3));
    slapEl.classList.toggle("ready", slapCharge >= SLAP_AT);
    slapEl.setAttribute("aria-disabled", String(slapCharge < SLAP_AT));
    slapEl.title = slapCharge >= SLAP_AT
      ? "Slap the whole screen (F)"
      : "Slap charges at " + SLAP_AT + " pops — " + slapCharge + "/" + SLAP_AT;
  }
  slapEl.addEventListener("click", () => { audio(); fireSlap(); });
  slapEl.addEventListener("pointerdown", e => e.stopPropagation());
  paintSlap();

  const walkEl = document.getElementById("walk");
  const gearEl = document.getElementById("gear");
  const panelEl = document.getElementById("panel");
  const musicEl = document.getElementById("music");

  function setWalker(on) {
    walker.on = on;
    store.set("walk", on ? "1" : "0");
    walkEl.setAttribute("aria-pressed", String(on));
    walkEl.textContent = on ? "On" : "Off";
    if (!on) { held.clear(); steer(); stick.dx = stick.dy = 0; }
  }
  walkEl.addEventListener("click", () => { audio(); setWalker(!walker.on); });
  setWalker(walker.on);

  function openPanel(on) {
    panelEl.hidden = !on;
    gearEl.setAttribute("aria-expanded", String(on));
  }
  gearEl.addEventListener("click", () => { audio(); openPanel(panelEl.hidden); });
  gearEl.addEventListener("pointerdown", e => e.stopPropagation());
  panelEl.addEventListener("pointerdown", e => e.stopPropagation());
  addEventListener("pointerdown", () => { if (!panelEl.hidden) openPanel(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !panelEl.hidden) openPanel(false); });

  /* ── emotes ─────────────────────────────────────────── */

  const emoEl = document.getElementById("emo");
  for (const e of EMO) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = e;
    b.setAttribute("aria-label", "Say " + e);
    b.addEventListener("click", () => { audio(); emote(e); });
    b.addEventListener("pointerdown", ev => ev.stopPropagation());
    emoEl.appendChild(b);
  }

  function setMusic(on) {
    musicOn = on;
    store.set("music", on ? "1" : "0");
    musicEl.setAttribute("aria-pressed", String(on));
    musicEl.textContent = on ? "On" : "Off";
    if (on) musicStart(); else musicStop();
  }
  musicEl.addEventListener("click", () => setMusic(!musicOn));
  musicEl.setAttribute("aria-pressed", String(musicOn));
  musicEl.textContent = musicOn ? "On" : "Off";
  // the browser needs a gesture before it will make a sound, so a remembered
  // "on" waits for the first touch rather than failing silently
  if (musicOn) addEventListener("pointerdown", () => { if (musicOn && !mus) musicStart(); }, { once: true });

  function optionRow(host, items, current, onPick, swatch) {
    host.textContent = "";
    for (const it of items) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = swatch ? "opt sw" : "opt";
      b.dataset.v = it.v;
      if (swatch) {
        b.style.background = it.c || "linear-gradient(135deg, #F2F1F8 50%, #22222E 50%)";
        b.setAttribute("aria-label", it.t);
        b.title = it.t;
      } else {
        b.textContent = it.t;
      }
      b.setAttribute("aria-pressed", String(it.v === current()));
      b.addEventListener("click", () => {
        audio();
        onPick(it.v);
        for (const s of host.children) s.setAttribute("aria-pressed", String(s.dataset.v === current()));
      });
      host.appendChild(b);
    }
  }

  optionRow(document.getElementById("styleOpts"),
    [{ v: "fat", t: "Fat" }, { v: "crisp", t: "Crisp" }, { v: "crunch", t: "Crunch" }],
    () => popStyle,
    v => {                                   // audition it without leaving the current material
      popStyle = v;
      store.set("popstyle", v);
      if (!ac) return;
      try { out = master; WRAP[v](ac.currentTime + 0.02, 1); } catch (e) {}
      out = master;
    });

  optionRow(document.getElementById("bodyOpts"),
    Object.keys(BODIES).map(k => ({ v: k, c: BODIES[k], t: k === "auto" ? "Default" : k })),
    () => look.body,
    v => { look.body = v; store.set("body", v); }, true);

  optionRow(document.getElementById("hatOpts"),
    [{ v: "none", t: "None" }, { v: "cap", t: "Cap" }, { v: "bow", t: "Bow" },
     { v: "crown", t: "Crown" }, { v: "phones", t: "Phones" }],
    () => look.hat,
    v => { look.hat = v; store.set("hat", v); });

  optionRow(document.getElementById("eyeOpts"),
    [{ v: "dots", t: "Dots" }, { v: "happy", t: "Happy" },
     { v: "sleepy", t: "Sleepy" }, { v: "wide", t: "Wide" }],
    () => look.eyes,
    v => { look.eyes = v; store.set("eyes", v); });

  const volEl = document.getElementById("volume");
  volEl.value = String(Math.round(vol * 100));
  volEl.addEventListener("input", () => {
    vol = volEl.value / 100;
    store.set("vol", vol);
    if (master) master.gain.setTargetAtTime(vol, ac.currentTime, 0.01);
  });

  addEventListener("resize", () => layout());
  addEventListener("beforeunload", () => { store.set("pops", pops); store.set("exp", exp); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", buildSprites);
  new MutationObserver(buildSprites).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ── join ───────────────────────────────────────────── */

  const joinEl = document.getElementById("join");
  const whoEl = document.getElementById("who");
  const noteEl = document.getElementById("joinnote");

  whoEl.value = store.get("name", "");
  if (!RELAY) noteEl.textContent = "No relay configured — you'll play on your own.";

  document.getElementById("joinform").addEventListener("submit", e => {
    e.preventDefault();
    const name = whoEl.value.trim().slice(0, 14) || "anon";
    store.set("name", name);
    audio();                                 // the tap that buys us sound
    joinEl.classList.add("gone");
    setTimeout(() => { joinEl.hidden = true; }, 360);
    netConnect(name);
  });

  addEventListener("beforeunload", () => { try { net.ws && net.ws.close(); } catch (e) {} });

  countEl.textContent = fmt(pops);
  paintXp();
  paintOnline();
  tagEl.textContent = PACKS[0].name + " · " + PACKS[0].tag;
  layout();                                  // builds the world and dresses the UI for wherever you are
  requestAnimationFrame(frame);
})();
</script>
