<style>
  :root {
    --ground:      #EDECF1;
    --ground-2:    #E2E1E9;
    --surface:     rgba(255,255,255,0.72);
    --surface-2:   rgba(255,255,255,0.92);
    --hairline:    rgba(24,22,38,0.13);
    --ink:         #1A1A24;
    --muted:       #6C6B7C;
    --accent:      #57C9A8;
    --shadow:      0 1px 2px rgba(24,22,38,.10), 0 8px 24px rgba(24,22,38,.09);
    --dark: 0;
    --halo: rgba(255,255,255,.62);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:    #131319;
      --ground-2:  #0C0C11;
      --surface:   rgba(30,30,40,0.62);
      --surface-2: rgba(36,36,48,0.90);
      --hairline:  rgba(255,255,255,0.10);
      --ink:       #ECECF4;
      --muted:     #8B8A9E;
      --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
      --dark: 1;
    --halo: rgba(0,0,0,.55);
    }
  }

  :root[data-theme="dark"] {
    --ground:    #131319;
    --ground-2:  #0C0C11;
    --surface:   rgba(30,30,40,0.62);
    --surface-2: rgba(36,36,48,0.90);
    --hairline:  rgba(255,255,255,0.10);
    --ink:       #ECECF4;
    --muted:     #8B8A9E;
    --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
    --dark: 1;
    --halo: rgba(0,0,0,.55);
  }

  :root[data-theme="light"] {
    --ground:    #EDECF1;
    --ground-2:  #E2E1E9;
    --surface:   rgba(255,255,255,0.72);
    --surface-2: rgba(255,255,255,0.92);
    --hairline:  rgba(24,22,38,0.13);
    --ink:       #1A1A24;
    --muted:     #6C6B7C;
    --shadow:    0 1px 2px rgba(24,22,38,.10), 0 8px 24px rgba(24,22,38,.09);
    --dark: 0;
    --halo: rgba(255,255,255,.62);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  /* accent-tinted ground — retints when the material changes */
  #wash {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 90% at 50% -10%, color-mix(in oklab, var(--accent) 20%, transparent), transparent 65%),
      radial-gradient(90% 70% at 50% 115%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%),
      linear-gradient(var(--ground), var(--ground-2));
    transition: background 700ms ease;
    z-index: 0;
  }

  #sheet {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* ── instrument readout ───────────────────────────────── */
  .mono {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  /* keeps the readout and tray legible over a full-bleed sheet */
  #scrim {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(44% 30% at -3% -5%, color-mix(in oklab, var(--ground) 92%, transparent), transparent 76%),
      linear-gradient(to top, color-mix(in oklab, var(--ground) 62%, transparent), transparent 14%);
  }

  #hud {
    text-shadow: 0 1px 3px var(--halo), 0 0 10px var(--halo);
    position: fixed;
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    left: 22px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: none;
  }

  #mark {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #count {
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Varela Round", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(38px, 9vw, 60px);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -.03em;
    color: var(--ink);
    transition: transform 90ms cubic-bezier(.2,1.6,.4,1);
  }
  #count.tick { transform: scale(1.045); }

  #sub {
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #sub b { color: var(--accent); font-weight: 600; transition: color 500ms ease; }

  #lvl { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
  #lvlN {
    font-size: 10px; letter-spacing: .14em; font-weight: 600;
    color: var(--accent);
    transition: color 500ms ease, transform 240ms cubic-bezier(.2,1.7,.4,1);
  }
  #lvlN.up { transform: scale(1.4); }
  #bar {
    width: 82px; height: 3px; border-radius: 2px; overflow: hidden;
    background: color-mix(in oklab, var(--ink) 16%, transparent);
  }
  #bar i {
    display: block; height: 100%; width: 0%;
    background: var(--accent);
    transition: width 340ms ease, background 500ms ease;
  }
  #xp { font-size: 9px; letter-spacing: .1em; color: var(--muted); }

  /* ── volume ───────────────────────────────────────────── */
  #controls {
    position: fixed;
    top: max(24px, calc(env(safe-area-inset-top) + 12px));
    right: 22px;
    z-index: 3;
    display: flex;

<script>
(() => {
  "use strict";

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ══ audio ═══════════════════════════════════════════════
     Every sound is synthesised — no samples, nothing to load. */

  let ac = null, master = null, noiseBuf = null, lastVoice = 0, out = null;
  const pans = [];

  function audio() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = vol;
    out = master;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 8;
    comp.attack.value = 0.002;
    comp.release.value = 0.12;
    master.connect(comp).connect(ac.destination);

    const n = ac.sampleRate * 0.6;
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    // a fixed rack of panners, so a pop sounds where it happened
    if (ac.createStereoPanner) {
      for (let i = 0; i < 9; i++) {
        const p = ac.createStereoPanner();
        p.pan.value = (i / 8 * 2 - 1) * 0.62;
        p.connect(master);
        pans.push(p);
      }
    }
    return ac;
  }

  const noise = () => { const s = ac.createBufferSource(); s.buffer = noiseBuf; return s; };
  const filt = (type, freq, q) => { const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q; return f; };

  // amplitude envelope: instant-ish attack, exponential tail
  function env(t, peak, attack, decay) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    return g;
  }

  function burst(t, cfg) {          // filtered noise transient
    const a = cfg.a || 0.001;       // attack is optional — never let it reach stop() as undefined
    const s = noise(), f = filt(cfg.type, cfg.freq, cfg.q), g = env(t, cfg.gain, a, cfg.d);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + a + cfg.d + 0.02);
  }

  // no attack ramp at all — the first sample is full scale. This is what
  // separates a crack from a blip.
  function crack(t, cfg) {
    const s = noise(), f = filt(cfg.type, cfg.freq, cfg.q), g = ac.createGain();
    if (cfg.to) {
      f.frequency.setValueAtTime(cfg.freq, t);   // anchor, or the sweep starts early
      f.frequency.exponentialRampToValueAtTime(cfg.to, t + cfg.sweep);
    }
    g.gain.setValueAtTime(cfg.gain, t);
    if (cfg.knee) g.gain.exponentialRampToValueAtTime(cfg.gain * cfg.knee, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0006, t + cfg.d);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t); s.stop(t + cfg.d + 0.03);
  }

  function tone(t, cfg) {           // pitched body
    const o = ac.createOscillator();
    o.type = cfg.wave || "sine";
    o.frequency.setValueAtTime(cfg.from, t);
    if (cfg.to) o.frequency.exponentialRampToValueAtTime(cfg.to, t + cfg.sweep);
    const g = env(t, cfg.gain, cfg.a || 0.003, cfg.d);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + (cfg.a || 0.003) + cfg.d + 0.02);
  }

  /* Three readings of the same event. A pop is the film splitting, the
     plastic edge snapping past itself, and air leaving the cell — what
     changes between these is how much of each you hear and how close the
     mic is. Every pop rolls its own brightness and Q, so no two match. */
  const WRAP = {
    // dry and thin, heard across a room
    crisp(t, r) {
      const bright = 0.78 + Math.random() * 0.6;
      const dull = Math.random() < 0.22;
      crack(t, {
        type: "bandpass", freq: 3300 * r * bright, to: 660 * r, sweep: 0.03,
        q: 3.5 + Math.random() * 5, gain: dull ? 0.66 : 1.15, knee: 0.26, d: dull ? 0.035 : 0.055
      });
      if (!dull) crack(t + 0.0005, { type: "highpass", freq: 5400 * bright, q: 0.7, gain: 0.42 * bright, d: 0.007 });
      tone(t, { from: 205 * r, to: 106 * r, sweep: 0.028, gain: dull ? 0.2 : 0.36, a: 0.002, d: 0.038 });
      if (Math.random() < 0.17) {
        crack(t + 0.018 + Math.random() * 0.035, {
          type: "bandpass", freq: 2500 * r, to: 850 * r, sweep: 0.02, q: 6, gain: 0.4, knee: 0.3, d: 0.03
        });
      }
    },

    // close-mic'd ASMR: the resonance sits lower and rings longer, and the
    // air thump underneath carries real weight
    fat(t, r) {
      const bright = 0.85 + Math.random() * 0.45;
      const soft = Math.random() < 0.18;
      crack(t, {
        type: "bandpass", freq: 2150 * r * bright, to: 400 * r, sweep: 0.05,
        q: 2.4 + Math.random() * 3.4, gain: soft ? 0.62 : 1.05, knee: 0.4, d: soft ? 0.06 : 0.095
      });
      crack(t + 0.0005, { type: "highpass", freq: 3800 * bright, q: 0.7, gain: 0.2 * bright, d: 0.01 });
      tone(t, { from: 172 * r, to: 72 * r, sweep: 0.065, gain: soft ? 0.4 : 0.68, a: 0.003, d: 0.115 });
      tone(t + 0.004, { from: 340 * r, to: 232 * r, sweep: 0.05, gain: 0.17, a: 0.004, d: 0.08 });
      if (Math.random() < 0.14) {
        crack(t + 0.03 + Math.random() * 0.04, {
          type: "bandpass", freq: 1700 * r, to: 560 * r, sweep: 0.03, q: 4, gain: 0.36, knee: 0.35, d: 0.05
        });
      }
    },

    // a fistful at once: several cells giving way in a scatter
    crunch(t, r) {
      const n = 2 + (Math.random() * 3 | 0);
      for (let i = 0; i < n; i++) {
        crack(t + i * (0.007 + Math.random() * 0.022), {
          type: "bandpass", freq: (1700 + Math.random() * 2700) * r, to: 700 * r, sweep: 0.022,
          q: 4 + Math.random() * 7, gain: 0.45 + Math.random() * 0.5, knee: 0.3, d: 0.028 + Math.random() * 0.025
        });
      }
      crack(t, { type: "highpass", freq: 6000, q: 0.7, gain: 0.3, d: 0.008 });
      tone(t, { from: 195 * r, to: 92 * r, sweep: 0.035, gain: 0.34, a: 0.002, d: 0.06 });
    }
  };

  const VOICES = {
    wrap(t, r) { WRAP[popStyle] ? WRAP[popStyle](t, r) : WRAP.fat(t, r); },
    // MX blue: leaf click, then the bottom-out
    clicky(t, r) {
      burst(t, { type: "highpass", freq: 3200 * r, q: 0.7, gain: 1.0, d: 0.014 });
      burst(t + 0.002, { type: "bandpass", freq: 5200 * r, q: 9, gain: 0.7, d: 0.026 });
      tone(t + 0.004, { from: 2600 * r, to: 1500 * r, sweep: 0.02, gain: 0.2, d: 0.028 });
      burst(t + 0.02, { type: "lowpass", freq: 420, q: 1, gain: 0.35, d: 0.05 });
    },
    // lubed linear on a foam-filled board
    thock(t, r) {
      burst(t, { type: "lowpass", freq: 900 * r, q: 1.2, gain: 0.75, d: 0.045 });
      tone(t, { from: 190 * r, to: 118 * r, sweep: 0.05, gain: 0.85, a: 0.005, d: 0.1 });
      burst(t, { type: "highpass", freq: 2600, q: 0.7, gain: 0.14, d: 0.008 });
    },
    // one drip in a cave
    drop(t, r) {
      burst(t, { type: "lowpass", freq: 1400 * r, q: 1, gain: 0.35, d: 0.012 });
      tone(t, { from: 420 * r, to: 1550 * r, sweep: 0.055, gain: 0.62, a: 0.004, d: 0.075 });
      tone(t + 0.09, { from: 1750 * r, to: 2100 * r, sweep: 0.03, gain: 0.09, a: 0.004, d: 0.06 });
    },
    // wet, rude, deeply satisfying
    slime(t, r) {
      const s = noise(), f = filt("lowpass", 300, 7), g = env(t, 0.55, 0.018, 0.2);
      f.frequency.setValueAtTime(320 * r, t);
      f.frequency.exponentialRampToValueAtTime(2000 * r, t + 0.09);
      f.frequency.exponentialRampToValueAtTime(360 * r, t + 0.22);
      s.connect(f); f.connect(g); g.connect(out);
      s.start(t); s.stop(t + 0.3);
      tone(t + 0.02, { from: 240 * r, to: 150 * r, sweep: 0.16, gain: 0.22, a: 0.02, d: 0.16 });
    },
    // dry temple knock
    wood(t, r) {
      burst(t, { type: "bandpass", freq: 1500 * r, q: 6, gain: 0.7, d: 0.03 });
      tone(t, { from: 820 * r, to: 700 * r, sweep: 0.05, gain: 0.5, a: 0.002, d: 0.075 });
      tone(t, { from: 1950 * r, gain: 0.22, a: 0.002, d: 0.04 });
    }
  };

  const panTo = x => (pans.length && x >= 0) ? pans[Math.round(Math.min(1, x / W) * 8)] : master;

  function play(x, id) {
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    // queue rapid hits a few ms apart so a fast drag reads as a roll, not mush
    const t = Math.max(ac.currentTime + 0.001, lastVoice + 0.014);
    lastVoice = t;
    // pops fire from inside the draw loop — a bad voice must never stop the frame
    try {
      out = panTo(x);
      VOICES[id || pack.id](t, 0.92 + Math.random() * 0.17);
    } catch (e) {
      if (!play.warned) { play.warned = true; console.error("voice failed", e); }
    }
    out = master;
  }

  // an open palm the size of the sky, landing flat
  function slapSound() {
    if (!ac) return;
    try {
      out = master;
      const t = ac.currentTime + 0.001;
      crack(t, { type: "lowpass", freq: 900, q: 0.9, gain: 1.2, knee: 0.4, d: 0.16 });   // the meat
      tone(t, { from: 72, to: 30, sweep: 0.28, gain: 0.95, a: 0.004, d: 0.55 });         // the room
      crack(t, { type: "bandpass", freq: 3000, q: 1.6, gain: 0.5, knee: 0.3, d: 0.05 }); // skin snap
      burst(t + 0.03, { type: "lowpass", freq: 500, q: 1, gain: 0.35, d: 0.3 });         // rumble after
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  // the shove when two of them collide — no pack of its own, just weight
  function boom(x) {
    if (!ac) return;
    try {
      out = panTo(x);
      const t = ac.currentTime + 0.001;
      tone(t, { from: 165, to: 40, sweep: 0.2, gain: 0.8, a: 0.005, d: 0.34 });
      burst(t, { type: "lowpass", freq: 800, q: 1, gain: 0.55, d: 0.13 });
      burst(t, { type: "bandpass", freq: 2600, q: 2, gain: 0.3, d: 0.05 });
    } catch (e) { /* silence beats a dead render loop */ }
    out = master;
  }

  /* ══ ambient ═════════════════════════════════════════════
     A slow generative pad, keyed to whatever material you're on.
     It never repeats: notes are drawn from a minor pentatonic and
     fade in and out over several seconds, through a long delay. */

  const ROOTS = { wrap: 110, clicky: 73.42, thock: 87.31, drop: 130.81, slime: 98, wood: 82.41 };
  const SCALE = [0, 3, 5, 7, 10, 12, 15, 19];
  let mus = null;

  function padNote() {
    const root = ROOTS[pack.id] || 110;
    const semi = SCALE[(Math.random() * SCALE.length) | 0] + 12 * (1 + (Math.random() * 2 | 0));
    const f = root * Math.pow(2, semi / 12);
    const t = ac.currentTime, dur = 3.4 + Math.random() * 3.2;
    for (const v of [[1, "sine", 0.17], [2.004, "sine", 0.045], [3, "triangle", 0.016]]) {
      const o = ac.createOscillator();
      o.type = v[1];
      o.frequency.value = f * v[0];
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v[2], t + dur * 0.45);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(mus.bus);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }

  function schedule() {
    if (!mus) return;
    mus.timer = setTimeout(() => { if (mus) { try { padNote(); } catch (e) {} schedule(); } }, 1700 + Math.random() * 3400);
  }

  function droneTune() {
    if (!mus) return;
    const root = ROOTS[pack.id] || 110;
    for (const d of mus.drone) d.o.frequency.setTargetAtTime(root * d.m, ac.currentTime, 1.4);
  }

  function musicStart() {
    audio();
    if (ac.state === "suspended") ac.resume();
    if (mus) return;
    const bus = ac.createGain(); bus.gain.value = 0.0001;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 0.5;
    const dl = ac.createDelay(2); dl.delayTime.value = 0.66;
    const fb = ac.createGain(); fb.gain.value = 0.4;
    const wet = ac.createGain(); wet.gain.value = 0.4;
    bus.connect(lp); lp.connect(master);
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);

    const lfo = ac.createOscillator(); lfo.frequency.value = 0.035;   // the pad breathes
    const lfoAmt = ac.createGain(); lfoAmt.gain.value = 420;
    lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency); lfo.start();

    mus = { bus, lp, dl, fb, wet, lfo, drone: [], timer: 0 };
    const root = ROOTS[pack.id] || 110;
    for (const v of [[1, "sine", 0.1], [1.5, "sine", 0.05], [2, "triangle", 0.028]]) {
      const o = ac.createOscillator();
      o.type = v[1];
      o.frequency.value = root * v[0];
      const g = ac.createGain(); g.gain.value = v[2];
      o.connect(g); g.connect(bus); o.start();
      mus.drone.push({ o, m: v[0] });
    }
    bus.gain.setTargetAtTime(0.55, ac.currentTime, 2.2);
    try { padNote(); } catch (e) {}
    schedule();
  }

  function musicStop() {
    if (!mus) return;
    const m = mus;
    mus = null;
    clearTimeout(m.timer);
    m.bus.gain.setTargetAtTime(0.0001, ac.currentTime, 0.5);
    setTimeout(() => {
      try {
        m.lfo.stop();
        for (const d of m.drone) d.o.stop();
        m.bus.disconnect(); m.lp.disconnect(); m.dl.disconnect(); m.fb.disconnect(); m.wet.disconnect();
      } catch (e) {}
    }, 2200);
  }

  /* ══ materials ═══════════════════════════════════════════ */

  // Six zones laid end to end, joined by bridges. Each one costs ten more
  // levels than the last, so the world opens up as you play rather than
  // sitting behind a row of buttons.
  const PACKS = [
    { id: "wrap",   name: "Bubble wrap",   tag: "Cheap plastic, sharp snap",        accent: "#57C9A8", shape: "bubble", lattice: "hex",  unlock: 0  },
    { id: "clicky", name: "Clicky switch", tag: "MX blue — bright and toothy",      accent: "#5B77E5", shape: "cap",    lattice: "grid", unlock: 10 },
    { id: "thock",  name: "Thock",         tag: "Lubed linear, deep and creamy",    accent: "#8C9A5A", shape: "cap",    lattice: "grid", unlock: 20 },
    { id: "drop",   name: "Water drop",    tag: "Cave ceiling, one drip at a time", accent: "#3FA3D9", shape: "drop",   lattice: "hex",  unlock: 30 },
    { id: "slime",  name: "Slime",         tag: "Wet, rude, deeply satisfying",     accent: "#E0609B", shape: "blob",   lattice: "hex",  unlock: 40 },
    { id: "wood",   name: "Wood block",    tag: "Dry knock, temple-quiet",          accent: "#D08A3E", shape: "peg",    lattice: "grid", unlock: 50 }
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem("es." + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("es." + k, v); } catch (e) {} }
  };

  let pack = PACKS.find(p => p.id === store.get("pack", "wrap")) || PACKS[0];
  let vol = Math.min(1, Math.max(0, parseFloat(store.get("vol", "0.75"))));
  let pops = parseInt(store.get("pops", "0"), 10) || 0;
  let popStyle = store.get("popstyle", "fat");
  let musicOn = store.get("music", "0") === "1";

  // every 1000 XP is a level: LV2 at 1000, LV3 at 2000, and so on
  const PER_LEVEL = 1000;
  let exp = parseInt(store.get("exp", "0"), 10) || 0;
  let level = Math.floor(exp / PER_LEVEL) + 1;

  const look = {
    body: store.get("body", "auto"),
    hat: store.get("hat", "none"),
    eyes: store.get("eyes", "dots")
  };
  const BODIES = {
    auto: null, coral: "#E8674F", butter: "#EFC050", grass: "#5FAE5F",
    sky: "#4FA3E3", grape: "#9B6BD6", gum: "#EE7EB0"
  };

  // pop this many and you earn one almighty slap
  const SLAP_AT = 500;
  let slapCharge = Math.min(SLAP_AT, parseInt(store.get("slap", "0"), 10) || 0);
  let slapFx = null;

  // the little guy who does the walking. hop/hopV are the vertical axis —
  // only the slap uses them, but every critter carries them
  const walker = {
    on: store.get("walk", "1") === "1",
    x: 0, y: 0, vx: 0, vy: 0, kx: 0, ky: 0, hop: 0, hopV: 0,
    step: 0, face: 1, blink: 0, nextBlink: 1800,
    scale: 1, belt: true, cool: 0
  };
  // not a widget any more — just where the finger went down and how far it's pulled
  const stick = { dx: 0, dy: 0, id: null, ox: 0, oy: 0, moved: false };
  const keyVec = { x: 0, y: 0 };
  let running = false;                       // Shift, or the stick pushed to the rim

  /* ══ colour helpers ══════════════════════════════════════ */

  const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => {
    const A = hex2rgb(a), B = hex2rgb(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  };
  const rgba = (h, a) => { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

  const isDark = () => getComputedStyle(document.documentElement).getPropertyValue("--dark").trim() === "1";
  let darkNow = false;   // cached each rebuild; the draw loop can't afford getComputedStyle

  /* ══ canvas ══════════════════════════════════════════════ */

  const cvs = document.getElementById("sheet");
  const g = cvs.getContext("2d");

  /* The world has a fixed size in its own units and the camera scales it to
     fit the height of whatever screen it lands on. That is what lets two
     players agree on anything: the grid, the zones and the bridges come out
     identical on a phone and on a laptop, so cell #4271 is the same bubble
     everywhere and a position can travel as a plain pair of numbers. */
  const S = 56;                     // one cell, in world units
  const VH = 1000;                  // world height, in world units
  const sprScale = 1.7;

  let W = 0, H = 0, dpr = 1;
  let k = 1;                        // world units → screen pixels
  let viewW = 0;                    // how much world the viewport spans
  let cells = [];

  // one sprite pair per zone, so a bridge can show both sides at once
  const sprites = [], sockets = [];

  /* ══ the world ═══════════════════════════════════════════
     Zones sit end to end on one long strip: 口—口—口—口—口—口.
     Everything is drawn in world coordinates and the camera
     translates once per frame, so nothing downstream has to know. */

  const zoneW = S * 26, bridgeW = S * 6.5;
  const worldW = PACKS.length * zoneW + (PACKS.length - 1) * bridgeW;
  let zone = 0;
  const cam = { x: 0 };

  const zoneStart = i => i * (zoneW + bridgeW);
  const zoneEnd = i => zoneStart(i) + zoneW;
  const gateX = i => zoneEnd(i - 1) + bridgeW * 0.22;     // barrier sits just onto the bridge
  const locked = i => level < PACKS[i].unlock;

  function zoneAt(x) {                                    // -1 while on a bridge
    for (let i = 0; i < PACKS.length; i++) {
      if (x >= zoneStart(i) - 1 && x <= zoneEnd(i) + 1) return i;
    }
    return -1;
  }

  function nearestZone(x) {
    const i = zoneAt(x);
    if (i >= 0) return i;
    return Math.min(PACKS.length - 1, Math.max(0, Math.round(x / (zoneW + bridgeW))));
  }

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function makeSprite(draw) {
    const res = dpr * Math.max(0.4, k);        // the camera scale is part of the pixel budget
    const px = Math.ceil(S * sprScale * res);
    const c = document.createElement("canvas");
    c.width = c.height = px;
    const x = c.getContext("2d");
    x.scale(res, res);
    x.translate(S * sprScale / 2, S * sprScale / 2);
    draw(x, S / 2);
    return c;
  }

  function buildSprites() {
    darkNow = isDark();
    sprites.length = 0;
    sockets.length = 0;
    for (const P of PACKS) buildPackSprites(P);
  }

  function buildPackSprites(P) {
    const dark = darkNow;
    const A = P.accent;
    // dark rooms get darker plastic: the accent lives in the rim and the
    // specular, not in a flat body fill that would swamp the ground
    const lit = mix(A, "#ffffff", dark ? 0.60 : 0.86);   // highlight
    const mid = mix(A, dark ? "#12121A" : "#ffffff", dark ? 0.52 : 0.42);
    const deep = mix(A, "#08080E", dark ? 0.66 : 0.30);

    sprites.push(makeSprite((x, r) => {
      if (P.shape === "cap") {
        // an extruded keycap: side walls, a top face lifted off them, a dish
        const s = r * 1.9, o = -s / 2, rad = s * 0.2;
        const base = mix(A, dark ? "#3C3C4A" : "#FFFFFF", dark ? 0.6 : 0.52);
        const ins = s * 0.1, lift = s * 0.075;

        x.fillStyle = rgba("#000000", dark ? 0.34 : 0.13);
        rr(x, o, o + s * 0.05, s, s, rad); x.fill();

        const wall = x.createLinearGradient(0, o, 0, o + s);
        wall.addColorStop(0, mix(base, "#000000", dark ? 0.34 : 0.18));
        wall.addColorStop(1, mix(base, "#000000", dark ? 0.56 : 0.34));
        x.fillStyle = wall;
        rr(x, o, o, s, s, rad); x.fill();

        const face = x.createLinearGradient(0, o + ins - lift, 0, o + s - ins - lift);
        face.addColorStop(0, mix(base, "#ffffff", dark ? 0.22 : 0.44));
        face.addColorStop(1, mix(base, "#000000", dark ? 0.12 : 0.04));
        x.fillStyle = face;
        rr(x, o + ins, o + ins - lift, s - ins * 2, s - ins * 2, rad * 0.78); x.fill();

        const dish = x.createRadialGradient(0, o + s * 0.3 - lift, s * 0.04, 0, o + s * 0.44 - lift, s * 0.46);
        dish.addColorStop(0, rgba(lit, dark ? 0.18 : 0.5));
        dish.addColorStop(1, rgba(lit, 0));
        x.fillStyle = dish;
        rr(x, o + ins, o + ins - lift, s - ins * 2, s - ins * 2, rad * 0.78); x.fill();

        x.strokeStyle = rgba(mix(base, "#ffffff", 0.75), dark ? 0.32 : 0.8);
        x.lineWidth = 1;
        x.beginPath();
        x.moveTo(o + ins + rad * 0.7, o + ins - lift + 0.7);
        x.lineTo(o + s - ins - rad * 0.7, o + ins - lift + 0.7);
        x.stroke();
      } else if (P.shape === "peg") {
        const grad = x.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
        grad.addColorStop(0, mix(A, "#ffffff", dark ? 0.35 : 0.55));
        grad.addColorStop(0.72, mix(A, dark ? "#241A10" : "#8A5A28", 0.42));
        grad.addColorStop(1, mix(A, "#1A1008", dark ? 0.72 : 0.5));
        x.fillStyle = grad;
        x.beginPath(); x.arc(0, 0, r, 0, 6.2832); x.fill();
        // end grain: off-centre growth rings, as if you cut the dowel
        x.strokeStyle = rgba(mix(A, "#1A1008", 0.6), dark ? 0.3 : 0.24);
        x.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
          x.beginPath();
          x.arc(-r * 0.14, -r * 0.12, r * (0.16 + i * 0.23), 0, 6.2832);
          x.stroke();
        }
      } else {
        // bubble / droplet / blob — translucent, glossy
        const wob = P.shape === "blob";
        const path = () => {
          x.beginPath();
          if (!wob) { x.arc(0, 0, r, 0, 6.2832); return; }
          for (let i = 0; i <= 48; i++) {
            const a = i / 48 * 6.2832;
            const rad = r * (1 + 0.055 * Math.sin(a * 3 + 0.9) + 0.03 * Math.sin(a * 5));
            i ? x.lineTo(Math.cos(a) * rad, Math.sin(a) * rad) : x.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          }
          x.closePath();
        };
        const sharp = P.shape === "drop";
        const grad = x.createRadialGradient(-r * 0.34, -r * 0.38, r * 0.06, 0, 0, r * 1.06);
        grad.addColorStop(0, rgba(lit, sharp ? 0.85 : 0.72));
        grad.addColorStop(0.42, rgba(mid, dark ? 0.62 : 0.42));
        grad.addColorStop(0.86, rgba(A, dark ? 0.20 : 0.30));
        grad.addColorStop(1, rgba(deep, sharp ? 0.62 : 0.5));
        path(); x.fillStyle = grad; x.fill();
        x.lineWidth = sharp ? 1.4 : 1;
        x.strokeStyle = rgba(lit, dark ? 0.34 : 0.62);
        path(); x.stroke();
        // specular
        const sg = x.createRadialGradient(-r * 0.36, -r * 0.4, 0, -r * 0.36, -r * 0.4, r * (sharp ? 0.26 : 0.4));
        sg.addColorStop(0, rgba("#ffffff", sharp ? 0.9 : 0.62));
        sg.addColorStop(1, rgba("#ffffff", 0));
        x.fillStyle = sg;
        x.beginPath(); x.ellipse(-r * 0.36, -r * 0.4, r * 0.4, r * 0.3, -0.5, 0, 6.2832); x.fill();
      }
    }));

    sockets.push(makeSprite((x, r) => {
      const hole = mix(dark ? "#0A0A10" : "#B9B7C4", A, 0.18);
      if (P.shape === "cap") {
        const s = r * 1.68, o = -s / 2;
        x.fillStyle = rgba(hole, dark ? 0.72 : 0.42);
        rr(x, o, o, s, s, s * 0.2); x.fill();
        x.fillStyle = rgba(A, dark ? 0.26 : 0.34);       // the bare switch stem
        rr(x, -s * 0.05, -s * 0.16, s * 0.1, s * 0.32, 1); x.fill();
        rr(x, -s * 0.16, -s * 0.05, s * 0.32, s * 0.1, 1); x.fill();
      } else {
        const grad = x.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 0.94);
        grad.addColorStop(0, rgba(hole, dark ? 0.62 : 0.34));
        grad.addColorStop(1, rgba(hole, 0));
        x.fillStyle = grad;
        x.beginPath(); x.arc(0, 0, r * 0.94, 0, 6.2832); x.fill();
        x.strokeStyle = rgba(dark ? "#ffffff" : "#000000", dark ? 0.07 : 0.06);
        x.lineWidth = 1;
        x.beginPath(); x.arc(0, r * 0.06, r * 0.7, 0.5, 2.64); x.stroke();
      }
    }));
  }

  // The grid never changes shape, so it is built once and survives every
  // resize — which also means a cell keeps its index for the whole session.
  function buildCells() {
    cells = [];
    for (let i = 0; i < PACKS.length; i++) {
      const P = PACKS[i];
      const hex = P.lattice === "hex";
      const pitch = hex ? 1.03 : (P.shape === "cap" ? 1.06 : 1.12);   // caps sit close, like a board
      const stepX = S * pitch;
      const stepY = S * (hex ? 0.9 : pitch);
      const x0 = zoneStart(i), x1 = zoneEnd(i);
      const cols = Math.ceil((x1 - x0) / stepX);
      const rows = Math.ceil(VH / stepY) + 2;
      const offY = (VH - (rows - 1) * stepY) / 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = x0 + stepX * 0.5 + c * stepX + (hex && r % 2 ? stepX / 2 : 0);
          const y = offY + r * stepY;
          if (x > x1 - stepX * 0.2 || y < -S || y > VH + S) continue;
          const idx = cells.length;
          // how long this cell stays flat is a property of the cell, not a
          // coin flip — otherwise two screens would refill at different times
          cells.push({ x, y, z: i, st: 0, t: 0, idx, wait: 1500 + (idx * 2654435761 >>> 0) % 2800 });
        }
      }
    }
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    cvs.style.width = W + "px"; cvs.style.height = H + "px";
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    k = H / VH;                              // the world always fills the height exactly
    viewW = W / k;

    if (!cells.length) buildCells();

    if (!walker.x) { walker.x = zoneStart(0) + zoneW / 2; walker.y = VH * 0.5; }
    walker.x = Math.min(Math.max(walker.x, S * 0.44), worldW - S * 0.44);
    walker.y = Math.min(Math.max(walker.y, S * 0.44), VH - S * 0.44);
    cam.x = Math.min(Math.max(walker.x - viewW / 2, 0), Math.max(0, worldW - viewW));

    buildSprites();
    enterZone(nearestZone(walker.x));        // keeps the readout honest after a resize
  }

  /* ══ pops ════════════════════════════════════════════════ */

  const POP_MS = reduced ? 90 : 170;
  const INFLATE_MS = reduced ? 140 : 420;
  const parts = [];
  const rings = [];
  const dents = [];

  function burstFx(x, y, P) {
    P = P || pack;
    const A = P.accent;
    rings.push({ x, y, t: performance.now(), life: reduced ? 220 : 420 });
    if (reduced || parts.length > 260) return;
    const n = P.shape === "cap" ? 4 : 8;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, sp = (0.7 + Math.random() * 2.2) * (S / 56);
      parts.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.4,
        r: 1 + Math.random() * 2.4,
        life: 300 + Math.random() * 320, t: performance.now(), c: A
      });
    }
  }

  const fmt = n => n.toLocaleString("en-US");
  const countEl = document.getElementById("count");
  const npcEl = document.getElementById("npcN");
  const lvlEl = document.getElementById("lvlN");
  const barEl = document.getElementById("barfill");
  const xpEl = document.getElementById("xp");
  const toastEl = document.getElementById("toast");
  let toastT = 0;

  function paintXp() {
    const floor = (level - 1) * PER_LEVEL;
    lvlEl.textContent = "LV " + level;
    barEl.style.width = ((exp - floor) / PER_LEVEL * 100).toFixed(1) + "%";
    xpEl.textContent = fmt(exp - floor) + " / " + fmt(PER_LEVEL);
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  function fanfare() {
    if (!ac) return;
    try {
      out = master;
      const t0 = ac.currentTime + 0.01;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        tone(t0 + i * 0.08, { wave: "triangle", from: f, gain: 0.3, a: 0.008, d: 0.3 });
      });
      tone(t0 + 0.33, { wave: "sine", from: 1567.98, gain: 0.13, a: 0.012, d: 0.6 });
    } catch (e) { /* a failed fanfare must not cost a level */ }
    out = master;
  }

  function levelUp() {
    // crossing a zone's requirement is the real event — say so
    const opened = PACKS.find(P => P.unlock === level);
    toast(opened ? opened.name + " unlocked" : "Level " + level);
    paintMap();
    fanfare();
    lvlEl.classList.add("up");
    setTimeout(() => lvlEl.classList.remove("up"), 260);
    const cx = walker.on ? walker.x : cam.x + viewW / 2, cy = walker.on ? walker.y : VH / 2;
    rings.push({ x: cx, y: cy, t: performance.now(), life: 700, big: true });
    if (!reduced) {
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * 6.2832, sp = (1.4 + Math.random() * 3) * (S / 56);
        parts.push({
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2,
          r: 1.4 + Math.random() * 2.6, life: 620 + Math.random() * 400,
          t: performance.now(), c: pack.accent
        });
      }
    }
    store.set("exp", exp);
  }

  function addXp(n) {
    exp += n;
    const lv = Math.floor(exp / PER_LEVEL) + 1;
    if (lv > level) { level = lv; levelUp(); }
    paintXp();
  }

  // `mine` false means somebody else caused this pop: it still sounds and
  // still clears the cell, it just doesn't go on your tab.
  function popCell(c, now, mine) {
    if (c.st !== 0) return;                   // events can arrive twice; a popped cell stays popped
    const P = PACKS[c.z];                     // a cell sounds like the zone it belongs to
    c.st = 1; c.t = now;
    burstFx(c.x, c.y, P);
    play((c.x - cam.x) * k, P.id);            // panned by where it is on screen
    if (mine === false) return;
    pops++;
    countEl.textContent = fmt(pops);
    countEl.classList.add("tick");
    setTimeout(() => countEl.classList.remove("tick"), 90);
    addXp(1);
    if (!slapFx) slapCharge = Math.min(SLAP_AT, slapCharge + 1);   // the slap can't refill itself
    if (pops % 10 === 0) {
      store.set("pops", pops); store.set("exp", exp); store.set("slap", slapCharge);
      paintSlap();
    }
    if (navigator.vibrate) navigator.vibrate(P.shape === "cap" ? 6 : 10);
    if (!hinted) { hinted = true; document.getElementById("hint").classList.add("gone"); }
  }

  function popQuiet(c, now, mine) {
    if (c.st !== 0) return;
    c.st = 1; c.t = now;
    if (mine === false) return;
    pops++;
    addXp(1);
  }

  function hit(px, py) {
    const now = performance.now();
    const wx = px / k + cam.x, wy = py / k;   // screen to world
    let best = null, bd = (S * 1.05) ** 2;
    for (const c of cells) {
      if (c.st !== 0) continue;
      const d = (c.x - wx) ** 2 + (c.y - wy) ** 2;
      if (d < bd) { bd = d; best = c; }
    }
    if (best) { popCell(best, now); netEvent({ t: "p", i: best.idx }); }
    else rings.push({ x: wx, y: wy, t: now, life: 300 });   // nothing left there — still answer the touch
    if (!hinted) { hinted = true; document.getElementById("hint").classList.add("gone"); }
  }

  /* ══ the walker and the wanderers ════════════════════════ */

  const npcs = [];
  let shake = 0, flash = null;

  // Fixed, and deliberately so: online everyone has to see the same crowd,
  // so the count is no longer yours to set.
  const NPC_N = 5;

  function makeNpc() {
    return {
      x: 0, y: 0, z: -1,
      vx: 0, vy: 0, kx: 0, ky: 0, hop: 0, hopV: 0,
      hx: 0, hy: 0, tx: 0, ty: 0, turn: 0, cool: 0,
      rx: 0, ry: 0, rhop: 0, rface: 1, moving: 0, placed: 0,
      step: Math.random() * 6, face: 1, blink: 0, nextBlink: 1200 + Math.random() * 3400,
      scale: 0.8, belt: false
    };
  }

  function fitNpcs() {
    while (npcs.length > NPC_N) npcs.pop();
    while (npcs.length < NPC_N) npcs.push(makeNpc());
    if (npcEl) npcEl.textContent = String(NPC_N);
    if (!isHost()) return;                             // the host says where they are

    // they live in whichever zone the host is standing in, so the world is
    // inhabited where the action is without simulating five empty zones
    const pad = S * 0.5;
    for (const n of npcs) {
      if (n.z !== zone) {
        n.z = zone;
        n.x = zoneStart(zone) + pad + Math.random() * Math.max(1, zoneW - pad * 2);
        n.y = pad + Math.random() * Math.max(1, VH - pad * 2);
        n.placed = 1;
      }
      n.x = Math.min(Math.max(n.x, zoneStart(n.z) + pad), zoneEnd(n.z) - pad);
      n.y = Math.min(Math.max(n.y, pad), VH - pad);
    }
  }

  function tick(c, dt, mag) {
    c.step += dt * (3 + 13 * mag);
    c.blink += dt * 1000;
    if (c.blink > c.nextBlink) { c.blink = -110; c.nextBlink = 2000 + Math.random() * 3800; }
    const damp = Math.exp(-dt * 7);
    c.kx *= damp; c.ky *= damp;
    if (c.cool > 0) c.cool -= dt;
    if (c.hop < 0 || c.hopV) {                 // airborne: negative hop is up
      c.hopV += S * 26 * dt;
      c.hop += c.hopV * dt;
      if (c.hop >= 0) { c.hop = 0; c.hopV = 0; }
    }
  }

  function trample(c, now, reach, heavy, mine) {
    const r2 = reach * reach;
    for (const cell of cells) {
      if (cell.st !== 0) continue;
      if ((cell.x - c.x) ** 2 + (cell.y - c.y) ** 2 >= r2) continue;
      popCell(cell, now, mine);
      if (heavy) stompFx(cell, c);
    }
  }

  // A stomp should land harder than a tap: the cell throws its shards along
  // the direction of travel, a tight ring snaps outward, and the ground takes
  // a brief dent. Tapping stays quiet by comparison — that contrast is the point.
  function stompFx(cell, w) {
    if (reduced) return;
    const A = PACKS[cell.z].accent;
    rings.push({ x: cell.x, y: cell.y, t: performance.now(), life: 300, stomp: true });
    dents.push({ x: cell.x, y: cell.y, t: performance.now(), life: 520 });
    if (dents.length > 40) dents.shift();

    const sp = Math.hypot(w.vx, w.vy) || 1;
    const ux = w.vx / sp, uy = w.vy / sp;
    const n = parts.length > 220 ? 4 : 10;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832;
      const kick = (1.1 + Math.random() * 3.4) * (S / 56);
      parts.push({
        x: cell.x, y: cell.y,
        vx: Math.cos(a) * kick + ux * 2.4,           // thrown the way you're heading
        vy: Math.sin(a) * kick + uy * 2.4 - 1,
        r: 1.2 + Math.random() * 2.8,
        life: 380 + Math.random() * 420,
        t: performance.now(), c: A
      });
    }
  }

  // dust under the foot each time a step lands
  function footfall(w) {
    if (reduced) return;
    const u = S * 0.55 * w.scale;
    const side = Math.sin(w.step) > 0 ? 1 : -1;
    for (let i = 0; i < 5; i++) {
      const a = Math.PI + (Math.random() - 0.5) * 2.2;
      const sp = (0.4 + Math.random() * 1.1) * (S / 56);
      parts.push({
        x: w.x + side * u * 0.34, y: w.y + u * 0.98,
        vx: Math.cos(a) * sp - w.vx * 0.004,
        vy: Math.sin(a) * sp * 0.5 - 0.5,
        r: 1 + Math.random() * 2.2,
        life: 260 + Math.random() * 240,
        t: performance.now(), c: darkNow ? "#8E8CA0" : "#9C9AAE", soft: true
      });
    }
  }

  const BAND = () => S * 1.7;                 // half-height of the bridge deck

  function stepWalker(now, dt) {
    const w = walker;
    let ix = stick.dx + keyVec.x, iy = stick.dy + keyVec.y;
    if (w.duet) ix = iy = 0;                    // a hug drives you; you don't
    let mag = Math.hypot(ix, iy);
    if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }

    // Shift on a keyboard, or the drag pushed past the rim on a phone
    const runMul = (running || Math.hypot(stick.dx, stick.dy) > 0.85) ? 2 : 1;
    const speed = S * 3.1 * runMul;
    w.vx = ix * speed + w.kx; w.vy = iy * speed + w.ky;
    w.x += w.vx * dt; w.y += w.vy * dt;

    const pad = S * 0.44;
    w.x = Math.min(Math.max(w.x, pad), worldW - pad);
    w.y = Math.min(Math.max(w.y, pad), VH - pad);

    // a locked bridge stops you at the barrier
    for (let i = 1; i < PACKS.length; i++) {
      if (!locked(i)) continue;
      const gx = gateX(i) - S * 0.5;
      if (w.x > gx && w.x < zoneStart(i) + zoneW * 0.5) {
        w.x = gx;
        if (w.kx > 0) w.kx = 0;
      }
    }

    // on a bridge you walk the deck, not the void
    if (zoneAt(w.x) < 0) {
      const b = BAND();
      w.y = Math.min(Math.max(w.y, VH / 2 - b), VH / 2 + b);
    }

    if (Math.abs(ix) > 0.06) w.face += ((ix > 0 ? 1 : -1) - w.face) * Math.min(1, dt * 9);

    const before = Math.sin(w.step);
    tick(w, dt, Math.min(1.6, mag * runMul));   // legs keep up with the speed
    // a footfall is the moment the gait crosses zero — that's when it lands
    if (mag > 0.15 && before * Math.sin(w.step) <= 0) footfall(w);

    // trample what it walks over — only while actually moving, so standing
    // still doesn't turn into a machine gun as the cells refill underneath
    if (mag > 0.02 || Math.hypot(w.kx, w.ky) > S) trample(w, now, S * 0.56, true, true);

    const z = zoneAt(w.x);
    if (z >= 0 && z !== zone) enterZone(z);
  }

  function stepNpc(n, now, dt) {
    n.turn -= dt;
    if (n.turn <= 0) {                                  // pick somewhere new to amble
      n.turn = 0.9 + Math.random() * 2.4;
      const a = Math.random() * 6.2832;
      const pace = Math.random() < 0.22 ? 0 : 0.42 + Math.random() * 0.5;   // sometimes just stand there
      n.tx = Math.cos(a) * pace; n.ty = Math.sin(a) * pace;
    }
    const ease = Math.min(1, dt * 2.4);
    n.hx += (n.tx - n.hx) * ease;
    n.hy += (n.ty - n.hy) * ease;

    const speed = S * 1.6;
    n.vx = n.hx * speed + n.kx; n.vy = n.hy * speed + n.ky;
    n.x += n.vx * dt; n.y += n.vy * dt;

    // wanderers keep to their own zone — they never cross a bridge
    const pad = S * 0.5;
    const lo = zoneStart(n.z) + pad, hi = zoneEnd(n.z) - pad;
    if (n.x < lo) { n.x = lo; n.tx = n.hx = Math.abs(n.hx) + 0.2; }
    if (n.x > hi) { n.x = hi; n.tx = n.hx = -Math.abs(n.hx) - 0.2; }
    if (n.y < pad) { n.y = pad; n.ty = n.hy = Math.abs(n.hy) + 0.2; }
    if (n.y > VH - pad) { n.y = VH - pad; n.ty = n.hy = -Math.abs(n.hy) - 0.2; }

    const mag = Math.min(1, Math.hypot(n.hx, n.hy));
    n.moving = mag > 0.05 ? 1 : 0;
    if (Math.abs(n.vx) > S * 0.2) n.face += ((n.vx > 0 ? 1 : -1) - n.face) * Math.min(1, dt * 7);
    tick(n, dt, mag);

    if (mag > 0.05 || Math.hypot(n.kx, n.ky) > S) trample(n, now, S * 0.46, false, true);
  }

  // Everyone but the host is watching a recording: slide the wanderer toward
  // the position the host last reported and let the rest of the code treat it
  // exactly like a local one — including trampling, so the sheet matches.
  function stepNpcRemote(n, now, dt) {
    if (!n.placed) return;
    const e = Math.min(1, dt * 12);
    const ox = n.x, oy = n.y;
    n.x += (n.rx - n.x) * e;
    n.y += (n.ry - n.y) * e;
    n.hop += (n.rhop - n.hop) * e;
    n.vx = dt > 0 ? (n.x - ox) / dt : 0;
    n.vy = dt > 0 ? (n.y - oy) / dt : 0;
    n.face += (n.rface - n.face) * Math.min(1, dt * 7);
    n.z = nearestZone(n.x);
    tick(n, dt, n.moving ? 0.6 : 0);
    if (n.moving) trample(n, now, S * 0.46, false, true);
  }

  // a collision is a small event: shove them two bodies apart, then blow
  // the surrounding cells outward from the point of contact
  function blast(x, y, now, mine) {
    flash = { x, y, t: now };
    if (!reduced) shake = 1;
    rings.push({ x, y, t: now, life: 560, big: true });
    rings.push({ x, y, t: now + 90, life: 480, big: true });

    const R = S * 2.15, near = [];
    for (const c of cells) {
      if (c.st !== 0) continue;
      const d2 = (c.x - x) ** 2 + (c.y - y) ** 2;
      if (d2 < R * R) near.push([d2, c]);
    }
    near.sort((a, b) => a[0] - b[0]);        // pops ring outward from the middle
    for (const p of near) popCell(p[1], now, mine);
    boom((x - cam.x) * k);
    if (mine === false) return;
    addXp(25);                               // a collision is worth more than the cells it clears
    if (navigator.vibrate) navigator.vibrate([12, 24, 18]);
  }

  /* ══ the slap ════════════════════════════════════════════
     500 pops buys one. A hand comes down where you're standing, holds for a
     beat, and lifts to reveal the sheet letting go in a ring travelling out
     from the point of impact. The ripple is what sells the weight — a whole
     screen popping at once reads as a bug, not a blow. */

  const SLAP_FALL = reduced ? 0 : 380, SLAP_HOLD = 200, SLAP_LIFT = 440;
  const WAVE_MS = reduced ? 240 : 700;
  const SLAP_R = S * 13;              // the reach, in world units — the same for everyone

  function fireSlap() {
    if (slapFx || slapCharge < SLAP_AT) return;
    const x = walker.on ? walker.x : cam.x + viewW / 2;
    const y = walker.on ? walker.y : VH * 0.52;
    slapCharge = 0;
    store.set("slap", 0);
    paintSlap();
    startSlap(x, y, true);
    netEvent({ t: "k", x: Math.round(x), y: Math.round(y) });
  }

  function startSlap(x, y, mine) {
    if (slapFx) return;
    slapFx = { t0: performance.now(), x, y, mine: !!mine, hit: false, r: 0, ring: 0, n: 0 };
  }

  // The wavefront: every cell between where the ring was last frame and where
  // it is now lets go. Only the first few each frame get a real voice —
  // three hundred queued pops would take four seconds to drain.
  function stepSlap(now) {
    if (!slapFx) return;
    const e = now - slapFx.t0;
    if (e < SLAP_FALL) return;
    if (!slapFx.hit) { slapFx.hit = true; slapLand(now); }

    const p = Math.min(1, (e - SLAP_FALL) / WAVE_MS);
    const r1 = SLAP_R * easeOut(p), r0 = slapFx.r;
    if (r1 > r0) {
      slapFx.r = r1;
      let loud = 0;
      for (const c of cells) {
        if (c.st !== 0) continue;
        const d2 = (c.x - slapFx.x) ** 2 + (c.y - slapFx.y) ** 2;
        if (d2 < r0 * r0 || d2 > r1 * r1) continue;
        if (loud++ < 3) popCell(c, now, slapFx.mine);
        else popQuiet(c, now, slapFx.mine);
        slapFx.n++;
      }
      if (!reduced && r1 - slapFx.ring > S * 1.6) {      // the front, drawn where it is
        slapFx.ring = r1;
        rings.push({ x: slapFx.x, y: slapFx.y, t: now, life: 430, wave: r1 });
      }
    }

    if (p >= 1 && !slapFx.told) {
      slapFx.told = true;
      countEl.textContent = fmt(pops);                   // the quiet ones never touched it
      store.set("pops", pops); store.set("exp", exp);
      if (slapFx.mine) { addXp(40); toast(slapFx.n + " flattened"); }
    }
    if (p >= 1 && e > SLAP_FALL + SLAP_HOLD + SLAP_LIFT) slapFx = null;
  }

  function slapLand(now) {
    const cx = slapFx.x, cy = slapFx.y;
    slapSound();
    rings.push({ x: cx, y: cy, t: now, life: 540, big: true });

    if (!reduced) {
      shake = 1.8;
      flash = { x: cx, y: cy, t: now };
      for (let i = 0; i < 30; i++) {           // dust thrown out along the ground
        const a = Math.random() * 6.2832, sp = 1.5 + Math.random() * 4;
        parts.push({
          x: cx + (Math.random() - 0.5) * S * 5, y: cy + (Math.random() - 0.5) * S,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.4 - 0.6,
          r: 2 + Math.random() * 3.4, life: 520 + Math.random() * 420,
          t: now, c: darkNow ? "#8E8CA0" : "#9C9AAE", soft: true
        });
      }
    }

    // whoever is standing near it goes up. Peers are thrown on their own
    // machines and arrive here already airborne.
    for (const c of [walker, ...npcs]) {
      const d = Math.hypot(c.x - cx, c.y - cy);
      const fall = Math.max(0, 1 - d / SLAP_R);
      if (fall <= 0) continue;
      c.hopV = -S * (4 + 4.5 * fall);
      const ux = (c.x - cx) / (d || 1), uy = (c.y - cy) / (d || 1);
      c.kx += ux * S * 5 * fall;
      c.ky += uy * S * 3 * fall;
    }
    if (slapFx.mine && navigator.vibrate) navigator.vibrate([30, 40, 60]);
  }

  /* The hand is drawn once into its own canvas and stamped from there. It has
     to be: the fingers, the knuckles and the thumb overlap, so fading a live
     path would show every seam through itself. */

  const SKIN = { lit: "#F5CBAA", mid: "#E3A97F", low: "#C1815A", deep: "#98593B", nail: "#F8DDC9" };
  const skin = c => darkNow ? mix(c, "#0B0B12", 0.32) : c;
  const HAND_W = 2.0, HAND_H = 3.0, HAND_OX = 1.0, HAND_OY = 1.55;   // in units of u
  // index, middle, ring, little: x offset, fan angle, width, length
  const FINGERS = [[-0.42, -0.13, 0.25, 0.92], [-0.14, -0.04, 0.265, 1.03],
                   [0.14, 0.06, 0.25, 0.95], [0.40, 0.17, 0.215, 0.74]];
  let handCvs = null, handDark = null;

  function handSprite() {
    if (handCvs && handDark === darkNow) return handCvs;
    const u = 240, res = Math.min(2, window.devicePixelRatio || 1);
    const c = document.createElement("canvas");
    c.width = Math.ceil(u * HAND_W * res);
    c.height = Math.ceil(u * HAND_H * res);
    const x = c.getContext("2d");
    x.scale(res, res);
    x.translate(u * HAND_OX, u * HAND_OY);
    paintHand(x, u);
    handCvs = c; handDark = darkNow;
    return c;
  }

  // The back of a hand, lit from the top left like everything else here.
  function paintHand(x, u) {
    const grad = x.createLinearGradient(-u * 0.8, -u * 1.2, u * 0.9, u * 1.2);
    grad.addColorStop(0, skin(SKIN.lit));
    grad.addColorStop(0.45, skin(SKIN.mid));
    grad.addColorStop(1, skin(SKIN.low));
    const edge = rgba(skin(SKIN.deep), 0.5);

    x.lineJoin = "round";
    x.lineCap = "round";

    const digit = (px, py, w, len, tilt) => {
      x.save();
      x.translate(px, py);
      x.rotate(tilt);
      x.fillStyle = grad;
      rr(x, -w / 2, -len, w, len + w, w / 2);
      x.fill();
      x.lineWidth = u * 0.012;
      x.strokeStyle = edge;
      x.stroke();
      x.strokeStyle = rgba(skin(SKIN.deep), 0.26);              // knuckle creases
      x.lineWidth = u * 0.011;
      for (const f of [0.36, 0.66]) {
        x.beginPath();
        x.moveTo(-w * 0.34, -len * f); x.lineTo(w * 0.34, -len * f);
        x.stroke();
      }
      x.fillStyle = rgba(skin(SKIN.nail), 0.92);                // nail, foreshortened
      rr(x, -w * 0.28, -len + w * 0.16, w * 0.56, len * 0.2, w * 0.2);
      x.fill();
      x.restore();
    };

    x.fillStyle = grad;                                          // wrist, behind everything
    rr(x, -u * 0.34, u * 0.3, u * 0.68, u * 1.1, u * 0.2);
    x.fill();

    for (const f of FINGERS) digit(f[0] * u, -u * 0.3, f[2] * u, f[3] * u, f[1]);

    x.beginPath();                                               // the back of the hand
    x.moveTo(-u * 0.58, -u * 0.3);
    x.quadraticCurveTo(-u * 0.68, u * 0.2, -u * 0.44, u * 0.6);
    x.quadraticCurveTo(0, u * 0.86, u * 0.44, u * 0.6);
    x.quadraticCurveTo(u * 0.66, u * 0.2, u * 0.56, -u * 0.3);
    x.quadraticCurveTo(0, -u * 0.5, -u * 0.58, -u * 0.3);
    x.closePath();
    x.fillStyle = grad; x.fill();
    x.lineWidth = u * 0.013; x.strokeStyle = edge; x.stroke();

    x.save();                                                    // thumb, over the near edge
    x.translate(-u * 0.52, u * 0.16);
    x.rotate(-1.2);
    x.fillStyle = grad;
    rr(x, -u * 0.155, -u * 0.74, u * 0.31, u * 0.95, u * 0.155);
    x.fill();
    x.lineWidth = u * 0.013; x.strokeStyle = edge; x.stroke();
    x.fillStyle = rgba(skin(SKIN.nail), 0.88);
    rr(x, -u * 0.095, -u * 0.68, u * 0.19, u * 0.21, u * 0.08);
    x.fill();
    x.restore();

    x.strokeStyle = rgba(skin(SKIN.deep), 0.3);                  // knuckles
    x.lineWidth = u * 0.02;
    for (const f of FINGERS) {
      x.beginPath();
      x.arc(f[0] * u, -u * 0.24, u * 0.09, Math.PI * 1.15, Math.PI * 1.85);
      x.stroke();
    }

    x.strokeStyle = rgba("#FFFFFF", darkNow ? 0.05 : 0.14);      // tendons
    x.lineWidth = u * 0.022;
    for (const f of FINGERS) {
      x.beginPath();
      x.moveTo(f[0] * u, -u * 0.18);
      x.quadraticCurveTo(f[0] * u * 0.6, u * 0.12, f[0] * u * 0.32, u * 0.44);
      x.stroke();
    }
  }

  function drawPalm(cx, cy, scale, alpha) {
    const c = handSprite();
    const u = VH * 0.32 * scale;
    g.globalAlpha = alpha;
    g.drawImage(c, cx - u * HAND_OX, cy - u * HAND_OY, u * HAND_W, u * HAND_H);
    g.globalAlpha = 1;
  }

  function drawSlap(now) {
    if (!slapFx || reduced) return;
    const e = now - slapFx.t0;

    if (e < SLAP_FALL) {                       // coming down
      const p = e / SLAP_FALL;
      const drop = p * p;                      // accelerating
      const sh = 0.25 + drop * 0.75;
      g.fillStyle = rgba("#000000", (darkNow ? 0.5 : 0.3) * sh);
      g.beginPath();
      g.ellipse(slapFx.x, slapFx.y + S * 0.5, SLAP_R * 0.62 * sh, SLAP_R * 0.3 * sh, 0, 0, 6.2832);
      g.fill();
      drawPalm(slapFx.x, slapFx.y - VH * (1.5 - drop * 1.5), 0.6 + drop * 0.4, 0.45 + drop * 0.55);
      return;
    }

    const held = e - SLAP_FALL;
    if (held < SLAP_HOLD) { drawPalm(slapFx.x, slapFx.y, 1, 1); return; }

    const p = Math.min(1, (held - SLAP_HOLD) / SLAP_LIFT);   // lifting off
    if (p >= 1) return;
    drawPalm(slapFx.x, slapFx.y - VH * 1.5 * p * p, 1 - p * 0.12, (1 - p) * 0.95);
  }

  /* ══ multiplayer ═════════════════════════════════════════
     A relay, not a server: it stores nothing and decides nothing. What keeps
     everybody's world the same is that the world itself is deterministic —
     one fixed grid on every device, and cells that refill on a schedule
     baked into the cell rather than rolled at random. So clients only have
     to agree on *events*, never on state:

       · where each player is, twelve times a second
       · where the wanderers are, from whichever client is host — the lowest
         id in the room. Everyone else plays those positions back.
       · one short message per bang: a tap, a collision, a slap, an emote.

     Nobody ever sends the sheet. Cells pop under a peer's feet on your
     machine because you are running the same footsteps they are. */

  const ROOM = "friends";
  const SEND_HZ = 12;
  const DEFAULT_RELAY = "wss://sheet-relay.realworldkelvin.workers.dev";

  // ?relay=wss://… overrides and sticks, so the address can change without a rebuild
  const relayParam = new URLSearchParams(location.search).get("relay");
  if (relayParam !== null) store.set("relay", relayParam);
  const RELAY = (relayParam !== null ? relayParam : store.get("relay", DEFAULT_RELAY)).trim();

  const net = {
    ws: null, id: null, name: "", peers: new Map(), ids: new Set(),
    sendAt: 0, npcAt: 0, state: "off"
  };

  const idNum = s => parseInt(s, 10) || 0;

  // The lowest id in the room runs the wanderers. On your own, that's you —
  // which is why single player behaves exactly as it always did.
  function isHost() {
    if (net.state !== "on" || !net.id) return true;
    const me = idNum(net.id);
    for (const id of net.ids) if (idNum(id) < me) return false;
    return true;
  }

  function paintOnline() {
    const el = document.getElementById("online");
    const n = document.getElementById("onlineN");
    if (!el || !n) return;
    const here = net.peers.size + 1;
    const live = net.state === "on";
    el.classList.toggle("live", live);
    el.classList.toggle("bad", net.state === "error" || net.state === "full");
    n.innerHTML =
      net.state === "on" ? "<b>" + here + "</b> here"
      : net.state === "connecting" ? "connecting…"
      : net.state === "full" ? "room full"
      : net.state === "error" ? "reconnecting…"
      : "solo";
  }

  function netConnect(name) {
    net.name = name;
    if (!RELAY) { net.state = "solo"; paintOnline(); return; }
    net.state = "connecting";
    paintOnline();
    let ws;
    try { ws = new WebSocket(RELAY.replace(/\/+$/, "") + "/room/" + ROOM); }
    catch (e) { net.state = "error"; paintOnline(); return; }
    net.ws = ws;

    ws.onopen = () => { net.state = "on"; paintOnline(); netSend(true); };
    ws.onerror = () => { net.state = "error"; paintOnline(); };
    ws.onclose = () => {
      net.ws = null; net.peers.clear(); net.ids.clear();
      if (net.state !== "full") net.state = "error";
      paintOnline();
      setTimeout(() => { if (!net.ws && net.name) netConnect(net.name); }, 4000);
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      try { netApply(m); } catch (e) { /* a bad packet must not stop the world */ }
    };
  }

  function newPeer(id) {
    const p = {
      x: 0, y: 0, z: 0, vx: 0, vy: 0, kx: 0, ky: 0, hop: 0, hopV: 0,
      tx: 0, ty: 0, thop: 0, placed: 0,
      step: Math.random() * 6, face: 1, blink: 0, nextBlink: 2200, cool: 0,
      scale: 1, belt: true, remote: true, name: "", emo: null, duet: null,
      look: { body: "auto", hat: "none", eyes: "dots" }
    };
    net.peers.set(id, p);
    net.ids.add(id);
    paintOnline();
    return p;
  }

  function netApply(m) {
    if (m.t === "hello") {
      net.id = m.id;
      for (const id of m.peers || []) net.ids.add(id);
      return;
    }
    if (m.t === "full") { net.state = "full"; paintOnline(); return; }
    if (m.t === "join") { net.ids.add(m.id); netSend(true); return; }   // re-announce so they see us
    if (m.t === "left") {
      const p = net.peers.get(m.id);
      if (p && p.duet) endDuet(p.duet);
      net.peers.delete(m.id); net.ids.delete(m.id);
      paintOnline();
      return;
    }

    if (m.t === "s") {
      const p = net.peers.get(m.id) || newPeer(m.id);
      p.name = String(m.n || "").slice(0, 14);
      if (m.l) p.look = { body: m.l[0], hat: m.l[1], eyes: m.l[2] };
      p.tx = +m.x; p.ty = +m.y;                        // same world, same numbers
      p.thop = +m.h || 0;
      p.face = m.f >= 0 ? 1 : -1;
      p.moving = !!m.m;
      p.seen = performance.now();
      if (!p.placed) { p.placed = 1; p.x = p.tx; p.y = p.ty; }
      return;
    }

    if (m.t === "n") {                                 // the host's wanderers
      if (isHost()) return;                            // …unless that's me
      const a = m.a || [];
      for (let i = 0; i < Math.min(a.length, npcs.length); i++) {
        const n = npcs[i], s = a[i];
        n.rx = s[0]; n.ry = s[1]; n.rface = s[2]; n.moving = s[3]; n.rhop = s[4];
        if (!n.placed) { n.placed = 1; n.x = n.rx; n.y = n.ry; n.hop = n.rhop; n.face = n.rface; }
      }
      return;
    }

    if (m.t === "p") {                                 // somebody tapped a cell
      const c = cells[m.i | 0];
      if (c) popCell(c, performance.now(), false);
      return;
    }

    if (m.t === "b") {                                 // somebody walked into somebody
      blast(+m.x, +m.y, performance.now(), false);
      if (isHost() && m.i != null && npcs[m.i]) {      // the shove they felt, applied where it counts
        const n = npcs[m.i];
        const d = Math.hypot(n.x - m.x, n.y - m.y) || 1;
        n.kx += (n.x - m.x) / d * S * 7;
        n.ky += (n.y - m.y) / d * S * 7;
        n.turn = 0.15;
      }
      return;
    }

    if (m.t === "k") { startSlap(+m.x, +m.y, false); return; }

    if (m.t === "e") {
      const p = net.peers.get(m.id) || newPeer(m.id);
      p.emo = { k: String(m.k || "").slice(0, 4), t: performance.now() };
      pairUp();
      return;
    }
  }

  function netSend(force) {
    if (!net.ws || net.ws.readyState !== 1) return;
    const now = performance.now();
    if (!force && now - net.sendAt < 1000 / SEND_HZ) return;
    net.sendAt = now;
    const w = walker;
    try {
      net.ws.send(JSON.stringify({
        t: "s",
        n: net.name,
        l: [look.body, look.hat, look.eyes],
        x: Math.round(w.x), y: Math.round(w.y),        // the world is the same size everywhere now
        h: Math.round(w.hop || 0),
        f: w.face >= 0 ? 1 : -1,
        m: Math.hypot(w.vx, w.vy) > S * 0.4 ? 1 : 0
      }));
    } catch (e) { /* the socket closes itself */ }
  }

  function netEvent(o) {
    if (!net.ws || net.ws.readyState !== 1) return;
    try { net.ws.send(JSON.stringify(o)); } catch (e) {}
  }

  function netNpcs() {
    if (!net.ws || net.ws.readyState !== 1) return;
    const now = performance.now();
    if (now - net.npcAt < 1000 / SEND_HZ) return;
    net.npcAt = now;
    netEvent({
      t: "n",
      a: npcs.map(n => [Math.round(n.x), Math.round(n.y), n.face >= 0 ? 1 : -1,
                        n.moving ? 1 : 0, Math.round(n.hop || 0)])
    });
  }

  // remote players are critters somebody else is steering
  function stepPeers(now, dt) {
    for (const [id, p] of net.peers) {
      if (now - p.seen > 12000) {
        if (p.duet) endDuet(p.duet);
        net.peers.delete(id); net.ids.delete(id); paintOnline();
        continue;
      }
      const e = Math.min(1, dt * 12);
      const ox = p.x, oy = p.y;
      p.x += (p.tx - p.x) * e;
      p.y += (p.ty - p.y) * e;
      p.hop += (p.thop - p.hop) * e;
      p.vx = dt > 0 ? (p.x - ox) / dt : 0;
      p.vy = dt > 0 ? (p.y - oy) / dt : 0;
      tick(p, dt, p.moving ? 1 : 0);
      // their feet flatten your sheet too — same footsteps, same cells
      if (p.moving) trample(p, now, S * 0.56, true, false);
    }
  }

  function drawPeerTags() {
    if (!net.peers.size) return;
    const fs = Math.max(9, Math.round(S * 0.2));
    g.font = `600 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const [, p] of net.peers) {
      if (!p.name || p.x < cam.x - S * 2 || p.x > cam.x + viewW + S * 2) continue;
      const y = p.y + p.hop - S * 1.05;
      const wide = g.measureText(p.name).width + fs * 1.5;
      rr(g, p.x - wide / 2, y - fs * 0.85, wide, fs * 1.7, fs * 0.85);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.74);
      g.fill();
      g.fillStyle = rgba(darkNow ? "#ECECF4" : "#1A1A24", 0.92);
      g.fillText(p.name, p.x, y);
    }
  }

  function collide(now, hosting) {
    const w = walker;
    if (w.duet) return;                                // hugging is not colliding

    // bumping into a friend does the same thing as bumping into a wanderer.
    // The lower of the two ids owns the pair, so the bang happens once and
    // both of you see the same one.
    for (const [id, p] of net.peers) {
      if (p.duet) continue;
      const dx = p.x - w.x, dy = p.y - w.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const sep = S * 1.65;
      if (d > sep) continue;
      const ux = dx / d, uy = dy / d;
      w.x -= ux * ((sep - d) / 2 + S * 0.3);
      w.y -= uy * ((sep - d) / 2 + S * 0.3);
      w.kx -= ux * S * 7; w.ky -= uy * S * 7;
      if (p.cool > 0) continue;
      p.cool = 0.9;
      if (idNum(net.id) < idNum(id)) {
        const bx = (p.x + w.x) / 2, by = (p.y + w.y) / 2;
        blast(bx, by, now, true);
        netEvent({ t: "b", x: Math.round(bx), y: Math.round(by) });
      }
    }

    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (!n.placed) continue;
      const dx = n.x - w.x, dy = n.y - w.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const sep = S * 0.55 * (w.scale + n.scale) * 1.5;   // about two people apart
      if (d > sep) continue;

      const ux = dx / d, uy = dy / d;
      const push = (sep - d) / 2 + S * 0.3;
      n.x += ux * push; n.y += uy * push;
      w.x -= ux * push; w.y -= uy * push;

      const kick = S * 7;
      n.kx += ux * kick; n.ky += uy * kick;
      w.kx -= ux * kick; w.ky -= uy * kick;
      n.turn = 0.15;

      if (n.cool <= 0) {
        n.cool = 0.9;
        const bx = (n.x + w.x) / 2, by = (n.y + w.y) / 2;
        blast(bx, by, now, true);
        // the index rides along so the host can shove the same wanderer
        netEvent({ t: "b", x: Math.round(bx), y: Math.round(by), i });
      }
    }

    if (!hosting) return;
    for (let i = 0; i < npcs.length; i++) {             // wanderers just step around each other
      for (let j = i + 1; j < npcs.length; j++) {
        const a = npcs[i], b = npcs[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const sep = S * 0.9;
        if (d > sep) continue;
        const p = (sep - d) / 2, ux = dx / d, uy = dy / d;
        b.x += ux * p; b.y += uy * p;
        a.x -= ux * p; a.y -= uy * p;
      }
    }
  }

  /* ══ emotes, and what two of them together mean ══════════
     One tap puts a face over your head for two seconds and tells the room.
     If two people show the same face inside that window, the closest pair of
     them stops being two people standing near each other and starts being a
     scene: hearts hug, skulls throw hands. Every client works out the pair
     from the same events, and each one only drives its own body — so the two
     halves meet in the middle without anybody being in charge. */

  const EMO = ["❤️", "😭", "😠", "💀"];
  const EMO_MS = 2000;
  const DUET_REACH = S * 20;                 // further apart than this and the moment has passed
  const duets = [];

  function emote(k) {
    walker.emo = { k, t: performance.now() };
    netEvent({ t: "e", k });
    pairUp();
  }

  function bodies() {
    const list = [{ id: net.id || "me", b: walker }];
    for (const [id, p] of net.peers) list.push({ id, b: p });
    return list;
  }

  function pairUp() {
    const now = performance.now();
    for (const kind of ["❤️", "💀"]) {
      const set = bodies().filter(o =>
        o.b.emo && o.b.emo.k === kind && now - o.b.emo.t < EMO_MS && !o.b.duet && o.b.placed !== 0);
      if (set.length < 2) continue;
      let best = null, bd = DUET_REACH;
      for (let i = 0; i < set.length; i++) {
        for (let j = i + 1; j < set.length; j++) {
          const d = Math.hypot(set[i].b.x - set[j].b.x, set[i].b.y - set[j].b.y);
          if (d < bd) { bd = d; best = [set[i].b, set[j].b]; }
        }
      }
      if (best) startDuet(kind, best[0], best[1], now);
    }
  }

  function startDuet(kind, a, b, now) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const D = {
      kind, a, b, t0: now,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,        // frozen, so it can't drift apart
      ux: dx / d, uy: dy / d,
      dur: kind === "❤️" ? 2200 : 2400, jab: 0
    };
    a.duet = D; b.duet = D;
    a.emo = b.emo = null;                              // the scene replaces the face
    duets.push(D);
  }

  function endDuet(D) {
    const i = duets.indexOf(D);
    if (i >= 0) duets.splice(i, 1);
    if (D.a) D.a.duet = null;
    if (D.b) D.b.duet = null;
  }

  const APPROACH = 620;

  function stepDuets(now, dt) {
    for (let i = duets.length - 1; i >= 0; i--) {
      const D = duets[i];
      const e = now - D.t0;
      if (e > D.dur) { endDuet(D); continue; }

      const gap = D.kind === "❤️" ? S * 0.58 : S * 1.25;
      const ease = easeOut(Math.min(1, e / APPROACH));

      // where each of them belongs this instant: their half of the gap, plus
      // however far into the other one they're leaning
      const L = D.kind === "💀" ? lunges(e) : ZERO2;
      drive(D.a, D.cx - D.ux * (gap / 2 - L[0]), D.cy - D.uy * (gap / 2 - L[0]), ease, dt);
      drive(D.b, D.cx + D.ux * (gap / 2 - L[1]), D.cy + D.uy * (gap / 2 - L[1]), ease, dt);

      D.a.face = D.ux >= 0 ? 1 : -1;                   // look at each other
      D.b.face = D.ux >= 0 ? -1 : 1;

      if (D.kind === "❤️") {
        if (!reduced && e > APPROACH && Math.random() < dt * 14) {
          parts.push({
            x: D.cx + (Math.random() - 0.5) * S * 0.8, y: D.cy - S * 0.4,
            vx: (Math.random() - 0.5) * 0.6, vy: -1.1 - Math.random(),
            r: 2.4 + Math.random() * 2, life: 700 + Math.random() * 400,
            t: now, c: "#EE6B8B", heart: true
          });
        }
      } else {
        // three landed punches, one every 400ms once they're in range
        const beat = Math.floor((e - APPROACH) / 400);
        if (beat >= 0 && beat < 3 && beat >= D.jab) {
          D.jab = beat + 1;
          punchFx(D, now, beat);
        }
      }
    }
  }

  // Three punches, one every 400ms, taking turns. Returns how far each of
  // the two is leaning into the other right now.
  const ZERO2 = [0, 0];
  function lunges(e) {
    const t = e - APPROACH;
    if (t < 0) return ZERO2;
    const beat = Math.floor(t / 400), phase = t % 400;
    if (beat > 2 || phase > 200) return ZERO2;
    const amt = Math.sin(phase / 200 * Math.PI) * S * 0.5;
    return beat % 2 === 0 ? [amt, 0] : [0, amt];
  }

  // only bodies this client owns get pushed; the peer's own machine is doing
  // the same sum for the other half
  function drive(b, x, y, ease, dt) {
    if (b.remote) return;
    b.vx = 0; b.vy = 0; b.kx = 0; b.ky = 0;
    const e = Math.min(1, dt * (6 + 16 * ease));
    b.x += (x - b.x) * e;
    b.y += (y - b.y) * e;
    b.step += dt * 9;
  }

  function punchFx(D, now, beat) {
    const s = beat % 2 ? -1 : 1;                       // +1: a hits b, -1: b hits a
    const hx = D.cx + D.ux * S * 0.3 * s, hy = D.cy + D.uy * S * 0.3 * s;
    const target = beat % 2 ? D.a : D.b;
    if (!target.remote) {                              // their own machine rocks them back
      target.kx += D.ux * S * 5 * s;
      target.ky += D.uy * S * 5 * s;
      target.hopV = Math.min(target.hopV, -S * 1.4);
    }
    rings.push({ x: hx, y: hy, t: now, life: 300, stomp: true });
    if (!reduced) {
      shake = Math.max(shake, 0.55);
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * 6.2832, sp = 1 + Math.random() * 2.4;
        parts.push({
          x: hx, y: hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
          r: 1.4 + Math.random() * 2, life: 300 + Math.random() * 240,
          t: now, c: "#F0C24B"
        });
      }
    }
    boom((hx - cam.x) * k);
  }

  // the face over your head, and the hearts over a hug
  function drawEmotes(now) {
    const list = [walker, ...net.peers.values()];
    const size = S * 0.66;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = size + `px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    for (const b of list) {
      if (!b.emo) continue;
      const e = now - b.emo.t;
      if (e > EMO_MS) { b.emo = null; continue; }
      if (b.x < cam.x - S * 2 || b.x > cam.x + viewW + S * 2) continue;
      const p = e / EMO_MS;
      const pop = p < 0.16 ? easeOut(p / 0.16) : 1;
      const y = b.y + b.hop - S * 1.62 - pop * S * 0.16;
      g.globalAlpha = p > 0.82 ? (1 - p) / 0.18 : 1;
      g.fillStyle = rgba(darkNow ? "#0C0C11" : "#FFFFFF", 0.55);
      g.beginPath();
      g.ellipse(b.x, y + size * 0.06, size * 0.62, size * 0.58, 0, 0, 6.2832);
      g.fill();
      g.fillText(b.emo.k, b.x, y);
      g.globalAlpha = 1;
    }
  }

  function drawCritter(w) {
    const L = w.look || look;          // remote players wear their own
    const u = S * 0.55 * w.scale;
    // the player is the opposite of the ground, so it separates from any
    // sheet; the wanderers sit in between and read as background life
    const dressed = w.belt && BODIES[L.body];
    const body = !w.belt ? (darkNow ? "#9C9AB0" : "#77758A")
      : dressed || (darkNow ? "#F2F1F8" : "#22222E");
    const face = dressed ? "#1B1B26"
      : (w.belt ? (darkNow ? "#22222E" : "#F2F1F8") : "#1C1C26");
    const spd = Math.min(1, Math.hypot(w.vx, w.vy) / (S * 3.1));
    const gait = Math.sin(w.step);
    const bob = gait * u * 0.07 * (0.4 + spd);
    const sq = 1 + Math.sin(w.step * 2) * 0.05 * spd;
    const bw = u * 0.76 / sq, bh = u * 0.84 * sq;

    g.save();
    g.translate(w.x, w.y);

    // the shadow stays on the ground and shrinks with altitude
    const air = Math.min(1, -w.hop / (S * 2.2));
    g.fillStyle = rgba("#000000", (darkNow ? 0.36 : 0.18) * (1 - air * 0.55));
    g.beginPath();
    g.ellipse(0, u * 1.1, u * (0.54 - air * 0.2), u * (0.13 - air * 0.05), 0, 0, 6.2832);
    g.fill();
    g.translate(0, w.hop);

    // mid-scene, lean into whoever you're hugging or hitting
    const D = w.duet;
    if (D) g.rotate((D.a === w ? 1 : -1) * (D.ux >= 0 ? 1 : -1) * (D.kind === "❤️" ? 0.17 : 0.1));

    g.fillStyle = body;
    for (const s of [-1, 1]) {                       // feet, tucked under the body
      const lift = Math.max(0, gait * s) * u * 0.3 * spd;
      g.beginPath();
      g.ellipse(s * u * 0.34, u * 0.96 + bob * 0.25 - lift, u * 0.22, u * 0.14, 0, 0, 6.2832);
      g.fill();
    }

    g.translate(0, bob);

    if (w.belt) {
      // arms swing against the legs — unless they're busy holding somebody
      const hugX = D && D.kind === "❤️" ? w.face * u * 0.32 : 0;
      for (const s of [-1, 1]) {
        const swing = Math.max(0, -gait * s) * u * 0.14 * spd;
        g.beginPath();
        g.ellipse(s * (bw + u * 0.04) + hugX, u * 0.16 - swing - (hugX ? u * 0.16 : 0),
          u * 0.125, u * 0.17, 0, 0, 6.2832);
        g.fill();
      }
    } else {
      g.strokeStyle = body; g.lineWidth = u * 0.07;  // wanderers get an antenna instead
      g.beginPath(); g.moveTo(0, -bh * 0.9); g.lineTo(0, -bh - u * 0.2); g.stroke();
      g.fillStyle = rgba(pack.accent, 0.9);
      g.beginPath(); g.arc(0, -bh - u * 0.29, u * 0.11, 0, 6.2832); g.fill();
      g.fillStyle = body;
    }

    rr(g, -bw, -bh, bw * 2, bh * 2, u * 0.52);
    g.fillStyle = body; g.fill();
    g.strokeStyle = rgba(face, 0.22); g.lineWidth = u * 0.07; g.stroke();

    if (w.belt) {                                    // a belt in the material's colour
      g.save();
      g.clip();
      g.fillStyle = rgba(pack.accent, 0.95);
      g.fillRect(-bw, u * 0.24, bw * 2, u * 0.17);
      g.restore();
    }

    if (w.belt && L.hat !== "none") drawHat(u, bw, bh, w.face, L);

    const ex = w.face * u * 0.1, open = w.blink < 0 ? 0.16 : 1;
    const eyes = w.belt ? L.eyes : "dots";
    g.fillStyle = face;
    g.strokeStyle = face;
    g.lineCap = "round";

    if (eyes === "happy" || eyes === "sleepy") {
      const up = eyes === "happy";
      g.lineWidth = u * 0.075;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.arc(ex + s * u * 0.26, -u * (up ? 0.15 : 0.27), u * 0.13,
          up ? Math.PI * 1.14 : Math.PI * 0.14, up ? Math.PI * 1.86 : Math.PI * 0.86);
        g.stroke();
      }
    } else {
      const big = eyes === "wide";
      const rx = u * (big ? 0.145 : 0.11), ry = u * (big ? 0.175 : 0.135) * open;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.ellipse(ex + s * u * (big ? 0.28 : 0.25), -u * 0.2, rx, ry, 0, 0, 6.2832);
        g.fill();
      }
      if (open === 1) {                              // catchlights
        g.fillStyle = dressed ? "#FFFFFF" : body;
        for (const s of [-1, 1]) {
          g.beginPath();
          g.arc(ex + s * u * (big ? 0.28 : 0.25) + u * 0.045, -u * 0.25, u * (big ? 0.045 : 0.035), 0, 6.2832);
          g.fill();
        }
      }
    }

    g.restore();
  }

  // hats sit on the head, in the material's colour
  function drawHat(u, bw, bh, dir, L) {
    L = L || look;
    const A = pack.accent;
    g.fillStyle = A;
    g.strokeStyle = A;

    if (L.hat === "cap") {
      g.beginPath(); g.arc(0, -bh * 0.5, bw * 0.94, Math.PI, 0); g.fill();
      g.beginPath();
      g.ellipse((dir >= 0 ? 1 : -1) * bw * 0.72, -bh * 0.48, bw * 0.62, u * 0.1, 0, 0, 6.2832);
      g.fill();
    } else if (L.hat === "bow") {
      const bx = -bw * 0.5, by = -bh * 0.86;
      for (const s of [-1, 1]) {
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(bx + s * u * 0.28, by - u * 0.17);
        g.lineTo(bx + s * u * 0.28, by + u * 0.17);
        g.closePath(); g.fill();
      }
      g.beginPath(); g.arc(bx, by, u * 0.085, 0, 6.2832); g.fill();
    } else if (L.hat === "crown") {
      const cy = -bh * 0.74, cw = bw * 0.72, ch = u * 0.46;   // points must clear the head
      g.beginPath();
      g.moveTo(-cw, cy);
      g.lineTo(-cw * 0.56, cy - ch);
      g.lineTo(-cw * 0.19, cy - ch * 0.34);
      g.lineTo(0, cy - ch * 1.18);
      g.lineTo(cw * 0.19, cy - ch * 0.34);
      g.lineTo(cw * 0.56, cy - ch);
      g.lineTo(cw, cy);
      g.closePath(); g.fill();
    } else if (L.hat === "phones") {
      g.lineWidth = u * 0.11;
      g.beginPath(); g.arc(0, -bh * 0.3, bw * 1.02, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      for (const s of [-1, 1]) {
        rr(g, s * bw * 1.02 - u * 0.12, -bh * 0.42, u * 0.24, u * 0.34, u * 0.1);
        g.fill();
      }
    }
  }

  /* ══ bridges ═════════════════════════════════════════════ */

  // Wood palette shared by both passes
  const wood = () => ({
    deckTop: darkNow ? "#3B3125" : "#CBAE85",
    deckMid: darkNow ? "#2E261C" : "#B8975F",
    deckLow: darkNow ? "#221B14" : "#9A7C54",
    beam:    darkNow ? "#6C5B47" : "#7C6242",
    beamLit: darkNow ? "#8A7660" : "#A2825A",
    dark:    darkNow ? "#0B0908" : "#6B5334"
  });

  function eachBridge(fn) {
    const b = BAND(), y0 = VH / 2 - b, y1 = VH / 2 + b;
    const vx0 = cam.x - S, vx1 = cam.x + viewW + S;
    for (let i = 1; i < PACKS.length; i++) {
      const x0 = zoneEnd(i - 1), x1 = zoneStart(i);
      if (x1 < vx0 || x0 > vx1) continue;
      fn(i, x0, x1, y0, y1);
    }
  }

  // A railing: top beam, posts, a mid rail, and cross-bracing below the beam.
  // `dir` is -1 for the far side (bracing hangs down into the deck) and +1 for
  // the near side, so both read as standing on the deck.
  function railing(x0, x1, y, dir) {
    const W_ = wood();
    const post = S * 0.7 * dir;                  // far rail rises up, near rail drops toward you
    const step = S * 1.5;

    g.strokeStyle = rgba(W_.dark, 0.5);          // bracing
    g.lineWidth = Math.max(1, S * 0.028);
    for (let x = x0; x < x1 - step; x += step) {
      g.beginPath();
      g.moveTo(x, y); g.lineTo(Math.min(x + step, x1), y + post);
      g.moveTo(Math.min(x + step, x1), y); g.lineTo(x, y + post);
      g.stroke();
    }

    g.strokeStyle = rgba(W_.beam, 0.9);          // mid rail
    g.lineWidth = Math.max(1.5, S * 0.04);
    g.beginPath(); g.moveTo(x0, y + post * 0.52); g.lineTo(x1, y + post * 0.52); g.stroke();

    g.fillStyle = W_.beam;                       // posts
    const pw = Math.max(2, S * 0.075);
    for (let x = x0; x <= x1 + 1; x += step) {
      const px = Math.min(x, x1);
      g.fillRect(px - pw / 2, Math.min(y, y + post), pw, Math.abs(post));
    }
