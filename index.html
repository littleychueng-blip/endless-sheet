    g.strokeStyle = W_.beamLit;                  // top beam
    g.lineWidth = Math.max(2.5, S * 0.085);
    g.lineCap = "round";
    g.beginPath(); g.moveTo(x0, y + post); g.lineTo(x1, y + post); g.stroke();
    g.lineCap = "butt";

    g.strokeStyle = rgba(W_.dark, 0.85);         // deck edge
    g.lineWidth = Math.max(2, S * 0.06);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  }

  // Behind the critters: deck, planks, far railing, the barrier itself
  function drawBridgeBack() {
    eachBridge((i, x0, x1, y0, y1) => {
      const W_ = wood();

      const deck = g.createLinearGradient(0, y0, 0, y1);
      deck.addColorStop(0, W_.deckTop);
      deck.addColorStop(0.5, W_.deckMid);
      deck.addColorStop(1, W_.deckLow);
      g.fillStyle = deck;
      g.fillRect(x0, y0, x1 - x0, y1 - y0);

      g.strokeStyle = rgba(W_.dark, 0.4);                       // planks
      g.lineWidth = 1;
      for (let x = x0 + S * 0.3; x < x1; x += S * 0.52) {
        g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
      }

      const sh = g.createLinearGradient(0, y1, 0, y1 + S * 0.8);  // shadow into the void
      sh.addColorStop(0, rgba("#000000", darkNow ? 0.5 : 0.22));
      sh.addColorStop(1, rgba("#000000", 0));
      g.fillStyle = sh;
      g.fillRect(x0, y1, x1 - x0, S * 0.8);

      railing(x0, x1, y0, -1);                                  // far side

      if (!locked(i)) return;
      const gx = gateX(i), A = PACKS[i].accent;
      g.strokeStyle = rgba(A, 0.95);
      g.lineWidth = Math.max(3, S * 0.11);
      g.setLineDash([S * 0.2, S * 0.15]);
      g.beginPath(); g.moveTo(gx, y0 - S * 0.8); g.lineTo(gx, y1 + S * 0.8); g.stroke();
      g.setLineDash([]);
    });
  }

  // In front of the critters: near railing, then the gate sign on top of all
  function drawBridgeFront() {
    eachBridge((i, x0, x1, y0, y1) => {
      railing(x0, x1, y1, 1);

      if (!locked(i)) return;
      const gx = gateX(i), A = PACKS[i].accent;
      g.fillStyle = rgba(darkNow ? "#E8E6F0" : "#22222E", 0.92);
      for (const py of [y0 - S * 0.8, y1 + S * 0.8]) {
        g.beginPath(); g.arc(gx, py, S * 0.09, 0, 6.2832); g.fill();
      }

      const line1 = PACKS[i].name.toUpperCase();
      const line2 = "LV " + PACKS[i].unlock + " TO UNLOCK";
      const fs = Math.max(9, Math.round(S * 0.23));
      g.font = `600 ${fs}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      g.textAlign = "center";
      g.textBaseline = "middle";
      const wide = Math.max(g.measureText(line1).width, g.measureText(line2).width) + fs * 2.4;
      const ty = y0 - S * 2;
      rr(g, gx - wide / 2, ty - fs * 1.9, wide, fs * 3.8, fs * 1.9);
      g.fillStyle = rgba(darkNow ? "#16161E" : "#FFFFFF", 0.92);
      g.fill();
      g.strokeStyle = rgba(A, 0.55);
      g.lineWidth = 1.5;
      g.stroke();
      g.fillStyle = rgba(A, 1);
      g.fillText(line1, gx, ty - fs * 0.62);
      g.fillStyle = rgba(darkNow ? "#ECECF4" : "#1A1A24", 0.8);
      g.fillText(line2, gx, ty + fs * 0.68);
    });
  }

  /* ══ draw ════════════════════════════════════════════════ */

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  let prevT = performance.now();

  function frame() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - prevT) / 1000);
    prevT = now;

    const hosting = isHost();
    // whoever inherits the room inherits the wanderers: pull them into the
    // zone you're actually standing in, or they'd stay where the last host left
    if (hosting !== net.wasHost) { net.wasHost = hosting; if (hosting) fitNpcs(); }

    if (walker.on) stepWalker(now, dt);
    if (hosting) { for (const n of npcs) stepNpc(n, now, dt); }
    else { for (const n of npcs) stepNpcRemote(n, now, dt); }
    stepPeers(now, dt);
    stepDuets(now, dt);
    if (walker.on) collide(now, hosting);
    stepSlap(now);
    netSend(false);
    if (hosting) netNpcs();

    // the camera trails the walker down the strip
    const focus = walker.on ? walker.x : cam.x + viewW / 2;
    const target = Math.min(Math.max(focus - viewW / 2, 0), Math.max(0, worldW - viewW));
    cam.x += (target - cam.x) * Math.min(1, dt * 7);

    g.clearRect(0, 0, W, H);
    g.save();
    g.scale(k, k);                            // world units from here down
    let ox = -cam.x, oy = 0;
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 4.5);
      const m = S * 0.17 * shake * shake;
      ox += (Math.random() - 0.5) * m;
      oy += (Math.random() - 0.5) * m;
    }
    g.translate(ox, oy);

    drawBridgeBack();

    const half = S * sprScale / 2;
    const vx0 = cam.x - S, vx1 = cam.x + viewW + S;

    for (const c of cells) {
      // The whole sheet keeps its clock, on screen or not. A cell somebody
      // popped three zones away has to be as far along when you walk up to it
      // as it is on their screen — if it only started counting once you looked,
      // the two of you would be standing in different worlds.
      let e = now - c.t;
      if (c.st === 1 && e > POP_MS) { c.st = 2; c.t = now; e = 0; }
      else if (c.st === 2 && e > c.wait) { c.st = 3; c.t = now; e = 0; }
      else if (c.st === 3 && e > INFLATE_MS) { c.st = 0; c.t = now; e = 0; }

      if (c.x < vx0 || c.x > vx1) continue;   // clocked everywhere, drawn only in shot

      if (c.st !== 0) g.drawImage(sockets[c.z], c.x - half, c.y - half, S * sprScale, S * sprScale);

      let sc = 1, al = 1;
      if (c.st === 1) {
        const p = Math.min(1, e / POP_MS);
        sc = 1 + easeOut(p) * (PACKS[c.z].shape === "cap" ? -0.22 : 0.42);
        al = 1 - p * p;
      } else if (c.st === 2) {
        continue;
      } else if (c.st === 3) {
        const p = Math.min(1, e / INFLATE_MS);
        const el = reduced ? p : 1 - Math.pow(2, -9 * p) * Math.cos(p * 11);
        sc = 0.24 + el * 0.76;
        al = Math.min(1, p * 3);
      }

      const d = S * sprScale * sc;
      g.globalAlpha = al;
      g.drawImage(sprites[c.z], c.x - d / 2, c.y - d / 2, d, d);
      g.globalAlpha = 1;
    }

    // the dent a stomp leaves, fading out of the ground
    for (let i = dents.length - 1; i >= 0; i--) {
      const q = dents[i], p = (now - q.t) / q.life;
      if (p >= 1) { dents.splice(i, 1); continue; }
      const rad = S * (0.45 + p * 0.5);
      const dg = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, rad);
      dg.addColorStop(0, rgba("#000000", (1 - p) * (darkNow ? 0.34 : 0.16)));
      dg.addColorStop(1, rgba("#000000", 0));
      g.fillStyle = dg;
      g.fillRect(q.x - rad, q.y - rad, rad * 2, rad * 2);
    }

    // everything past the barrier fades out — visible enough to want, dim
    // enough to read as not yours yet
    for (let i = 1; i < PACKS.length; i++) {
      if (!locked(i)) continue;
      const x0 = gateX(i);
      if (x0 > vx1) break;
      const gc = darkNow ? "#0C0C11" : "#E2E1E9";
      const fade = bridgeW * 1.1;
      const vg = g.createLinearGradient(x0, 0, x0 + fade, 0);
      vg.addColorStop(0, rgba(gc, 0));
      vg.addColorStop(1, rgba(gc, 0.7));
      g.fillStyle = vg;
      g.fillRect(x0, 0, fade, VH);
      g.fillStyle = rgba(gc, 0.7);
      g.fillRect(x0 + fade, 0, Math.max(0, worldW - x0 - fade), VH);
      break;
    }

    for (const n of npcs) if (n.placed) drawCritter(n);
    for (const [, p] of net.peers) drawCritter(p);
    if (walker.on) drawCritter(walker);
    drawPeerTags();
    drawEmotes(now);
    drawBridgeFront();

    // rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i], p = (now - r.t) / r.life;
      if (p >= 1) { rings.splice(i, 1); continue; }
      if (p < 0) continue;                                  // staggered blast ring, not due yet
      // a wave ring is already out at the front of the shock and only widens
      // a little; the rest grow from nothing
      const rad = r.wave ? r.wave + easeOut(p) * S * 1.1
        : S * (r.big ? 0.3 + easeOut(p) * 2.5
          : r.stomp ? 0.28 + easeOut(p) * 1.45
          : 0.34 + easeOut(p) * 0.8);
      g.beginPath();
      g.arc(r.x, r.y, rad, 0, 6.2832);
      g.strokeStyle = rgba(PACKS[nearestZone(r.x)].accent,
        (1 - p) * (r.wave ? 0.55 : r.big ? 0.8 : r.stomp ? 0.9 : 0.5));
      g.lineWidth = (r.wave ? 6 : r.big ? 4 : r.stomp ? 5 : 2) * (1 - p) + 0.4;
      g.stroke();
    }

    if (flash) {
      const p = (now - flash.t) / 300;
      if (p >= 1) flash = null;
      else {
        const rad = S * 2.8;
        const fg = g.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, rad);
        fg.addColorStop(0, rgba(pack.accent, (1 - p) * 0.42));
        fg.addColorStop(1, rgba(pack.accent, 0));
        g.fillStyle = fg;
        g.fillRect(flash.x - rad, flash.y - rad, rad * 2, rad * 2);
      }
    }

    // shards
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i], p = (now - q.t) / q.life;
      if (p >= 1) { parts.splice(i, 1); continue; }
      q.x += q.vx; q.y += q.vy;
      q.vy += q.heart ? -0.012 : q.soft ? 0.02 : 0.08;   // hearts rise, dust hangs, shards fall
      q.vx *= q.soft ? 0.94 : 0.985;
      q.vy *= q.soft ? 0.94 : 0.985;
      const rad = q.r * (q.soft ? 1 + p * 0.9 : 1 - p * 0.6);
      g.fillStyle = rgba(q.c, (1 - p) * (q.heart ? 0.9 : q.soft ? 0.3 : 0.72));
      if (q.heart) {
        const s = rad * 1.5;
        g.beginPath();
        g.moveTo(q.x, q.y + s * 0.9);
        g.bezierCurveTo(q.x - s * 1.6, q.y - s * 0.35, q.x - s * 0.5, q.y - s * 1.25, q.x, q.y - s * 0.35);
        g.bezierCurveTo(q.x + s * 0.5, q.y - s * 1.25, q.x + s * 1.6, q.y - s * 0.35, q.x, q.y + s * 0.9);
        g.fill();
      } else {
        g.beginPath();
        g.arc(q.x, q.y, rad, 0, 6.2832);
        g.fill();
      }
    }

    // last, so it covers everything: you don't see the shockwave through a hand
    drawSlap(now);

    g.restore();
    requestAnimationFrame(frame);
  }

  /* ══ input ═══════════════════════════════════════════════ */

  /* There is no joystick any more. Put a finger down anywhere and drag: the
     point you touched becomes the centre and the character walks the way you
     pull. Let go without dragging and it was a tap, so that still pops the
     bubble you meant to pop. */

  let hinted = false;
  const REACH = 78;                        // screen pixels from the touch to full tilt
  const SLOP = 11;                         // and how far you can wander before it's a drag

  cvs.addEventListener("pointerdown", e => {
    audio();
    if (ac.state === "suspended") ac.resume();
    if (stick.id !== null) return;         // one finger drives; the rest are ignored
    stick.id = e.pointerId;
    stick.ox = e.clientX; stick.oy = e.clientY;
    stick.moved = false;
    cvs.setPointerCapture(e.pointerId);
    if (!walker.on) hit(e.clientX, e.clientY);
  });

  cvs.addEventListener("pointermove", e => {
    if (stick.id !== e.pointerId) return;
    if (!walker.on) {                      // no character: a drag is a pop trail again
      const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const p of pts) hit(p.clientX, p.clientY);
      return;
    }
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
    if (!stick.moved && Math.hypot(dx, dy) < SLOP) return;   // still could be a tap
    stick.moved = true;
    dx /= REACH; dy /= REACH;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    stick.dx = dx; stick.dy = dy;
  });

  const release = e => {
    if (stick.id !== e.pointerId) return;
    if (walker.on && !stick.moved) hit(stick.ox, stick.oy);
    stick.id = null; stick.dx = stick.dy = 0; stick.moved = false;
  };
  cvs.addEventListener("pointerup", release);
  cvs.addEventListener("pointercancel", release);
  cvs.addEventListener("contextmenu", e => e.preventDefault());

  /* keys: arrows and WASD steer, everything else pops —
     which is the whole joke of the switch packs */
  const STEER = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };
  const held = new Set();

  function steer() {
    let x = 0, y = 0;
    for (const k of held) { x += STEER[k][0]; y += STEER[k][1]; }
    const m = Math.hypot(x, y);
    keyVec.x = m ? x / m : 0;
    keyVec.y = m ? y / m : 0;
  }

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.key === "Tab") return;
    if (e.target.closest && e.target.closest("#vol, #panel, #controls, #emo, #slap")) return;
    // Shift must return before the pop-a-random-cell fallback below, or simply
    // holding it to run would machine-gun the sheet
    if (e.key === "Shift") { running = true; return; }
    const k = e.key.toLowerCase();
    if (walker.on && STEER[k]) {
      e.preventDefault();
      if (!held.has(k)) { held.add(k); steer(); }
      audio();
      return;
    }
    if (k === "f") { audio(); fireSlap(); return; }
    if (e.key === " ") e.preventDefault();
    audio();
    const live = cells.filter(c => c.st === 0);
    if (!live.length) return;
    const c = live[(Math.random() * live.length) | 0];
    popCell(c, performance.now());
    netEvent({ t: "p", i: c.idx });
  });

  addEventListener("keyup", e => {
    if (e.key === "Shift") { running = false; return; }
    const k = e.key.toLowerCase();
    if (held.delete(k)) steer();
  });
  addEventListener("blur", () => { held.clear(); steer(); running = false; });

  /* ══ chrome ══════════════════════════════════════════════ */

  const mapEl = document.getElementById("map");
  const tagEl = document.getElementById("tag");
  const nameEl = document.getElementById("packname");

  // You change material by walking into it, so the tray is a map now: it
  // shows where you are, what's open, and what the next one costs.
  function paintMap() {
    mapEl.textContent = "";
    for (let i = 0; i < PACKS.length; i++) {
      if (i) {
        const l = document.createElement("s");
        l.className = "link" + (locked(i) ? "" : " open");
        l.style.setProperty("--c", PACKS[i].accent);
        mapEl.appendChild(l);
      }
      // unlocked zones are buttons you can travel to; locked ones are inert
      const shut = locked(i);
      const n = document.createElement(shut ? "i" : "button");
      n.className = "node" + (shut ? "" : " open") + (i === zone ? " here" : "");
      n.style.setProperty("--c", PACKS[i].accent);
      n.textContent = shut ? String(PACKS[i].unlock) : "";
      n.title = shut ? PACKS[i].name + " — LV " + PACKS[i].unlock : "Travel to " + PACKS[i].name;
      if (!shut) {
        n.type = "button";
        n.setAttribute("aria-label", "Travel to " + PACKS[i].name);
        n.addEventListener("click", () => { audio(); teleport(i); });
      }
      mapEl.appendChild(n);
    }
  }

  // step through the map instead of walking it
  function teleport(i) {
    const w = walker;
    if (w.duet) endDuet(w.duet);
    w.x = zoneStart(i) + zoneW / 2;
    w.y = VH / 2;
    w.vx = w.vy = w.kx = w.ky = 0;
    w.hop = w.hopV = 0;
    cam.x = Math.min(Math.max(w.x - viewW / 2, 0), Math.max(0, worldW - viewW));   // snap, don't scroll the world
    enterZone(i);
    rings.push({ x: w.x, y: w.y, t: performance.now(), life: 520, big: true });
  }

  function enterZone(z) {
    zone = z;
    pack = PACKS[z];
    store.set("pack", pack.id);
    document.documentElement.style.setProperty("--accent", pack.accent);
    nameEl.textContent = pack.name.toLowerCase();
    const label = pack.name + " · " + pack.tag;
    if (tagEl.textContent === label) {                 // same zone: no pointless flicker
      tagEl.style.opacity = "1";
    } else {
      tagEl.style.opacity = "0";
      setTimeout(() => { tagEl.textContent = label; tagEl.style.opacity = "1"; }, 180);
    }
    droneTune();                             // the pad follows the material
    fitNpcs();
    paintMap();
  }

  /* ── setup panel ────────────────────────────────────── */

  const slapEl = document.getElementById("slap");

  function paintSlap() {
    const p = slapCharge / SLAP_AT;
    slapEl.style.setProperty("--p", p.toFixed(3));
    slapEl.classList.toggle("ready", slapCharge >= SLAP_AT);
    slapEl.setAttribute("aria-disabled", String(slapCharge < SLAP_AT));
    slapEl.title = slapCharge >= SLAP_AT
      ? "Slap the whole screen (F)"
      : "Slap charges at " + SLAP_AT + " pops — " + slapCharge + "/" + SLAP_AT;
  }
  slapEl.addEventListener("click", () => { audio(); fireSlap(); });
  slapEl.addEventListener("pointerdown", e => e.stopPropagation());
  paintSlap();

  const walkEl = document.getElementById("walk");
  const gearEl = document.getElementById("gear");
  const panelEl = document.getElementById("panel");
  const musicEl = document.getElementById("music");

  function setWalker(on) {
    walker.on = on;
    store.set("walk", on ? "1" : "0");
    walkEl.setAttribute("aria-pressed", String(on));
    walkEl.textContent = on ? "On" : "Off";
    if (!on) { held.clear(); steer(); stick.dx = stick.dy = 0; }
  }
  walkEl.addEventListener("click", () => { audio(); setWalker(!walker.on); });
  setWalker(walker.on);

  function openPanel(on) {
    panelEl.hidden = !on;
    gearEl.setAttribute("aria-expanded", String(on));
  }
  gearEl.addEventListener("click", () => { audio(); openPanel(panelEl.hidden); });
  gearEl.addEventListener("pointerdown", e => e.stopPropagation());
  panelEl.addEventListener("pointerdown", e => e.stopPropagation());
  addEventListener("pointerdown", () => { if (!panelEl.hidden) openPanel(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !panelEl.hidden) openPanel(false); });

  /* ── emotes ─────────────────────────────────────────── */

  const emoEl = document.getElementById("emo");
  for (const e of EMO) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = e;
    b.setAttribute("aria-label", "Say " + e);
    b.addEventListener("click", () => { audio(); emote(e); });
    b.addEventListener("pointerdown", ev => ev.stopPropagation());
    emoEl.appendChild(b);
  }

  function setMusic(on) {
    musicOn = on;
    store.set("music", on ? "1" : "0");
    musicEl.setAttribute("aria-pressed", String(on));
    musicEl.textContent = on ? "On" : "Off";
    if (on) musicStart(); else musicStop();
  }
  musicEl.addEventListener("click", () => setMusic(!musicOn));
  musicEl.setAttribute("aria-pressed", String(musicOn));
  musicEl.textContent = musicOn ? "On" : "Off";
  // the browser needs a gesture before it will make a sound, so a remembered
  // "on" waits for the first touch rather than failing silently
  if (musicOn) addEventListener("pointerdown", () => { if (musicOn && !mus) musicStart(); }, { once: true });

  function optionRow(host, items, current, onPick, swatch) {
    host.textContent = "";
    for (const it of items) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = swatch ? "opt sw" : "opt";
      b.dataset.v = it.v;
      if (swatch) {
        b.style.background = it.c || "linear-gradient(135deg, #F2F1F8 50%, #22222E 50%)";
        b.setAttribute("aria-label", it.t);
        b.title = it.t;
      } else {
        b.textContent = it.t;
      }
      b.setAttribute("aria-pressed", String(it.v === current()));
      b.addEventListener("click", () => {
        audio();
        onPick(it.v);
        for (const s of host.children) s.setAttribute("aria-pressed", String(s.dataset.v === current()));
      });
      host.appendChild(b);
    }
  }

  optionRow(document.getElementById("styleOpts"),
    [{ v: "fat", t: "Fat" }, { v: "crisp", t: "Crisp" }, { v: "crunch", t: "Crunch" }],
    () => popStyle,
    v => {                                   // audition it without leaving the current material
      popStyle = v;
      store.set("popstyle", v);
      if (!ac) return;
      try { out = master; WRAP[v](ac.currentTime + 0.02, 1); } catch (e) {}
      out = master;
    });

  optionRow(document.getElementById("bodyOpts"),
    Object.keys(BODIES).map(k => ({ v: k, c: BODIES[k], t: k === "auto" ? "Default" : k })),
    () => look.body,
    v => { look.body = v; store.set("body", v); }, true);

  optionRow(document.getElementById("hatOpts"),
    [{ v: "none", t: "None" }, { v: "cap", t: "Cap" }, { v: "bow", t: "Bow" },
     { v: "crown", t: "Crown" }, { v: "phones", t: "Phones" }],
    () => look.hat,
    v => { look.hat = v; store.set("hat", v); });

  optionRow(document.getElementById("eyeOpts"),
    [{ v: "dots", t: "Dots" }, { v: "happy", t: "Happy" },
     { v: "sleepy", t: "Sleepy" }, { v: "wide", t: "Wide" }],
    () => look.eyes,
    v => { look.eyes = v; store.set("eyes", v); });

  const volEl = document.getElementById("volume");
  volEl.value = String(Math.round(vol * 100));
  volEl.addEventListener("input", () => {
    vol = volEl.value / 100;
    store.set("vol", vol);
    if (master) master.gain.setTargetAtTime(vol, ac.currentTime, 0.01);
  });

  addEventListener("resize", () => layout());
  addEventListener("beforeunload", () => { store.set("pops", pops); store.set("exp", exp); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", buildSprites);
  new MutationObserver(buildSprites).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ── join ───────────────────────────────────────────── */

  const joinEl = document.getElementById("join");
  const whoEl = document.getElementById("who");
  const noteEl = document.getElementById("joinnote");

  whoEl.value = store.get("name", "");
  if (!RELAY) noteEl.textContent = "No relay configured — you'll play on your own.";

  document.getElementById("joinform").addEventListener("submit", e => {
    e.preventDefault();
    const name = whoEl.value.trim().slice(0, 14) || "anon";
    store.set("name", name);
    audio();                                 // the tap that buys us sound
    joinEl.classList.add("gone");
    setTimeout(() => { joinEl.hidden = true; }, 360);
    netConnect(name);
  });

  addEventListener("beforeunload", () => { try { net.ws && net.ws.close(); } catch (e) {} });

  countEl.textContent = fmt(pops);
  paintXp();
  paintOnline();
  tagEl.textContent = PACKS[0].name + " · " + PACKS[0].tag;
  layout();                                  // builds the world and dresses the UI for wherever you are
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
