# Deploy the relay:
#   cd server
#   npx wrangler login      # opens a browser, approve once
#   npx wrangler deploy
#
# The Durable Object namespace can only be created by a migration, which is why
# this has to go through wrangler — the dashboard can bind to an existing
# namespace but cannot create one.

name = "sheet-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed classes are the ones available on the Workers free plan.
# The relay never touches storage; this only picks the backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
